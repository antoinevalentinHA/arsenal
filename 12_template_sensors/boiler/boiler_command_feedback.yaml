    # ======================================================
    # ERROR — LAST : SURFACE RETIRÉE, SANS ÉQUIVALENT
    # ------------------------------------------------------
    # boiler/error/last n'existe pas sur la surface cible. Les six gabarits
    # qui en dérivaient — reason, domain, action, request_id, ts, summary —
    # sont RETIRÉS.
    #
    # Le diagnostic par erreur ponctuelle est REMPLACÉ SANS ÊTRE REPRODUIT :
    #   - last_result PAR MESURE, dans les attributs de
    #     sensor.boiler_telemetry_status ;
    #   - le champ reason porté par les acquittements REJETÉS, ci-dessus.
    # Il n'existe plus de topic d'erreur global.
    # Réf : interface_ha_boiler_bridge.md §3.5
    # ======================================================
