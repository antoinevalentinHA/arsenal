# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSORS
#     Age des donnees — COULEUR (centre / battement)
# ----------------------------------------------------------
# 🎯 RÔLE
#   Exposer une couleur (green/blue/orange/red/grey) par intégration :
#     sensor.couleur_age_<integration>
#
# 🧠 Principe "centre" :
#   - centre_minutes : rythme nominal attendu
#   - band_minutes   : zone verte autour du centre (battement)
#   - seuil_minutes  : KO (incident)
#
# 🎨 Sorties :
#   - blue   : plus frais que centre - band (très vivant)
#   - green  : dans [centre-band ; centre+band]
#   - orange : au-dessus de centre+band (ralentit)
#   - red    : >= seuil_minutes (incident)
#   - grey   : unknown/unavailable/non numérique
# ==========================================================

- trigger:
    - platform: state
      entity_id:
        - sensor.homekit_station_enfants_age_donnees
        - sensor.homekit_station_salle_de_jeux_age_donnees
        - sensor.netatmo_age_donnees
        - sensor.switchbot_age_donnees
        - sensor.fujitsu_age_donnees
        - sensor.petite_maison_cumulus_age_donnees
        - sensor.synology_age_donnees
        - sensor.audi_age_donnees
    - platform: homeassistant
      event: start

  sensor:
    # Une entree = une couleur. Centre 4 min / bande 2 / seuil 45 :
    # cadence reelle mesuree a 3,8 et 3,9 min le 2026-08-24, hors
    # facades. Les anciennes valeurs (centre 1,0 / seuil 15) etaient
    # calees sur un age artificiellement plafonne a 5 min par le tick
    # /5 des facades, pas sur la cadence reelle des stations.
    - name: "Couleur age HomeKit Station Enfants"
      unique_id: couleur_age_homekit_station_enfants
      availability: &couleur_age_availability >
        {% set integration = this.entity_id | replace('sensor.couleur_age_', '') %}
        {% set src_map = {
          'homekit_station_enfants': 'sensor.homekit_station_enfants_age_donnees',
          'homekit_station_salle_de_jeux': 'sensor.homekit_station_salle_de_jeux_age_donnees',
          'netatmo': 'sensor.netatmo_age_donnees',
          'switchbot': 'sensor.switchbot_age_donnees',
          'fujitsu': 'sensor.fujitsu_age_donnees',
          'cumulus': 'sensor.petite_maison_cumulus_age_donnees',
          'synology': 'sensor.synology_age_donnees',
          'audi': 'sensor.audi_age_donnees'
        } %}
        {% set src = src_map.get(integration) %}
        {{ src is not none and states(src) not in ['unknown','unavailable',None] }}

      state: &couleur_age_logic >
        {% set integration = this.entity_id | replace('sensor.couleur_age_', '') %}

        {% set src_map = {
          'homekit_station_enfants': 'sensor.homekit_station_enfants_age_donnees',
          'homekit_station_salle_de_jeux': 'sensor.homekit_station_salle_de_jeux_age_donnees',
          'netatmo': 'sensor.netatmo_age_donnees',
          'switchbot': 'sensor.switchbot_age_donnees',
          'fujitsu': 'sensor.fujitsu_age_donnees',
          'cumulus': 'sensor.petite_maison_cumulus_age_donnees',
          'synology': 'sensor.synology_age_donnees',
          'audi': 'sensor.audi_age_donnees'
        } %}

        {% set centre_map = {
          'homekit_station_enfants': 4.0,
          'homekit_station_salle_de_jeux': 4.0,
          'netatmo': 2.0,
          'switchbot': 5.0,
          'fujitsu': 2.0,
          'cumulus': 2.0,
          'synology': 2.0,
          'audi': 5.0
        } %}

        {% set seuil_map = {
          'homekit_station_enfants': 45,
          'homekit_station_salle_de_jeux': 45,
          'netatmo': 30,
          'switchbot': 30,
          'fujitsu': 45,
          'cumulus': 60,
          'synology': 30,
          'audi': 120
        } %}

        {% set band_map = {
          'homekit_station_enfants': 2.0,
          'homekit_station_salle_de_jeux': 2.0,
          'netatmo': 1.0,
          'switchbot': 2.0,
          'fujitsu': 1.0,
          'cumulus': 1.0,
          'synology': 1.0,
          'audi': 2.0
        } %}

        {% set src = src_map.get(integration) %}
        {% set raw = states(src) if src is not none else 'unknown' %}
        {% set age = raw | replace(',', '.') | float(default=none) %}

        {% set centre = centre_map.get(integration, 2.0) | float(2.0) %}
        {% set band = band_map.get(integration, 1.0) | float(1.0) %}
        {% set seuil = seuil_map.get(integration, 60) | float(60) %}

        {% if age is none %}
          grey
        {% elif age >= seuil %}
          red
        {% elif age < (centre - band) %}
          blue
        {% elif age <= (centre + band) %}
          green
        {% else %}
          orange
        {% endif %}

    - name: "Couleur age HomeKit Station Salle De Jeux"
      unique_id: couleur_age_homekit_station_salle_de_jeux
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age Netatmo"
      unique_id: couleur_age_netatmo
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age SwitchBot"
      unique_id: couleur_age_switchbot
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age Fujitsu"
      unique_id: couleur_age_fujitsu
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age Cumulus"
      unique_id: couleur_age_cumulus
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age Synology"
      unique_id: couleur_age_synology
      availability: *couleur_age_availability
      state: *couleur_age_logic

    - name: "Couleur age Audi"
      unique_id: couleur_age_audi
      availability: *couleur_age_availability
      state: *couleur_age_logic
# ==========================================================
# SANTÉ D'UNE ENTRÉE DE CONFIGURATION — couleur TROIS AXES
# ----------------------------------------------------------
# 📐 CONTRAT — resilience_integrations.md v2.0 §12.5
#   R-UI-1 : un indicateur ne doit JAMAIS afficher sain un
#            périmètre dont un axe est en incident.
#   R-UI-2 : un vert calculé sur un périmètre incomplet est
#            pire qu'une absence d'indicateur.
#
# ⚠️ POURQUOI UN CAPTEUR DISTINCT DES `couleur_age_*`
#   Les capteurs `couleur_age_*` ci-dessus sont, par
#   construction, des couleurs de FRAÎCHEUR. Réutiliser cette
#   machinerie ici afficherait VERT pendant qu'une entrée est
#   en échec de configuration avec un âge figé bas — très
#   exactement le faux vert constaté le 2026-08-23 (contrat
#   §15). La santé d'une entrée exige les trois axes.
#
# 🎨 SORTIES
#   grey   : état d'entrée indéterminé / âge non numérique
#   red    : un axe au moins en incident avéré (débouncé)
#   orange : entrée non `loaded` (anomalie pas encore débouncée)
#            ou fraîcheur dégradée
#   green  : entrée chargée, aucun axe en incident, âge frais
#
# 📎 PAS DE `blue`
#   Le niveau « très vivant » suppose une cadence nominale
#   mesurée. Celle des `cover.*` de cette entrée ne l'est pas
#   encore (cf. `a_confirmer_runtime` au registre). Aucun seuil
#   n'est inventé ici.
# ==========================================================

- trigger:
    - platform: state
      entity_id:
        - sensor.homekit_prise_control_age_donnees
        - sensor.etat_entree_homekit_prise_control
        - binary_sensor.indisponibilite_franche_homekit_prise_control
        - binary_sensor.echec_configuration_homekit_prise_control
    - platform: homeassistant
      event: start

  sensor:
    - name: "Couleur sante HomeKit Prise Control"
      unique_id: couleur_sante_homekit_prise_control
      default_entity_id: sensor.couleur_sante_homekit_prise_control

      state: >
        {% set etat = states('sensor.etat_entree_homekit_prise_control') %}
        {% set age = states('sensor.homekit_prise_control_age_donnees') | float(default=none) %}

        {# Axe fraîcheur inapplicable ici (covers en push) : il n'entre NI dans
           l'incident, NI dans la nuance orange. Cf. pont_idiamant.md §8.3. #}
        {% set incident = is_state('binary_sensor.echec_configuration_homekit_prise_control', 'on')
                       or is_state('binary_sensor.indisponibilite_franche_homekit_prise_control', 'on') %}

        {% if etat in ['indetermine', 'introuvable', 'unknown', 'unavailable'] or age is none %}
          grey
        {% elif incident %}
          red
        {% elif etat != 'loaded' %}
          orange
        {% else %}
          green
        {% endif %}
