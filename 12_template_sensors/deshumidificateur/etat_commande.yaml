# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSOR (DÉSHUMIDIFICATEUR)
# ----------------------------------------------------------
# 📛 Nom UI :
#   Déshumidificateur — État commandé (décision exécutoire)
#
# 🎯 Rôle :
#   DÉCISION EXÉCUTOIRE unique du déshumidificateur (autorité de domaine,
#   contrat deshumidificateur/autorite_de_domaine.md §2/§8). Dérivée PURE de :
#     - le titulaire (input_select.deshumidificateur_titulaire_autorite)
#     - la décision auto PUBLIÉE (input_select.deshumidificateur_decision_auto)
#     - la consigne manuelle (input_select.deshumidificateur_consigne_manuelle)
#   En régime automatique : vaut la décision auto PUBLIÉE (branche « auto »,
#   produite par activation/desactivation/converger_auto — §8). En régime
#   manuel : vaut la consigne. Vocabulaire d'exécution : {on, off} (= target_state).
#
#   La décision auto THÉORIQUE reste `binary_sensor…demarrage_recommande` (exposée
#   via `etat_theorique`) : calculée en permanence, non exécutoire en manuel (§2).
#
# 🧱 Principe Arsenal :
#   - Décision PURE (aucun effet de bord, aucune mémoire, aucune tempo)
#   - N'écrit aucun relais, ne lit aucun état physique
#   - La décision auto reste calculée et exposée comme décision THÉORIQUE
#     non exécutoire quand le titulaire est manuel (§2)
#
# ⚠️ Anti-fallback strict (§2) :
#   `availability` = vrai UNIQUEMENT si le titulaire porte une valeur valide
#   ET la source qu'il désigne est valide. À défaut → indisponible. Un
#   unknown/unavailable NE VAUT NI 'automatique', NI un état — aucune valeur
#   substituée.
#
# 🔌 Consommé par :
#   - `automation.deshumidificateur_application` — CONSOMMATEUR EXÉCUTOIRE UNIQUE
#     (trigger d'état + événement `deshumidificateur_application_requise`). §8.
#
# 📍 Entité :
#   sensor.deshumidificateur_etat_commande
# ==========================================================

- sensor:
    - name: "Deshumidificateur Etat Commande"
      unique_id: deshumidificateur_etat_commande
      default_entity_id: sensor.deshumidificateur_etat_commande

      availability: >
        {% set t = states('input_select.deshumidificateur_titulaire_autorite') %}
        {% set auto = states('input_select.deshumidificateur_decision_auto') %}
        {% set cons = states('input_select.deshumidificateur_consigne_manuelle') %}
        {{ (t == 'automatique' and auto in ['on', 'off'])
           or (t == 'manuel' and cons in ['on', 'off']) }}

      state: >
        {% if is_state('input_select.deshumidificateur_titulaire_autorite', 'manuel') %}
          {{ states('input_select.deshumidificateur_consigne_manuelle') }}
        {% else %}
          {{ states('input_select.deshumidificateur_decision_auto') }}
        {% endif %}

      icon: >
        {% set m = this.state %}
        {% if m == 'on' %} mdi:air-humidifier
        {% elif m == 'off' %} mdi:air-humidifier-off
        {% else %} mdi:help-circle-outline
        {% endif %}

      attributes:
        titulaire: >
          {{ states('input_select.deshumidificateur_titulaire_autorite') }}
        source_decision: >
          {% if is_state('input_select.deshumidificateur_titulaire_autorite', 'manuel') %}
            consigne manuelle
          {% else %}
            décision automatique publiée
          {% endif %}
        etat_theorique: >
          {{ states('binary_sensor.deshumidificateur_cave_demarrage_recommande') }}
