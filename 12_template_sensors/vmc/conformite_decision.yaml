# ==========================================================
# 🧠 ARSENAL — BINARY SENSOR : VMC conformité décision
# ----------------------------------------------------------
# 🎯 ROLE
#   Vérifier que l'état physique réel de la VMC est conforme à la
#   DÉCISION EXÉCUTOIRE (C36 §16.5), et non à la seule décision
#   automatique.
#
# 🧱 PRINCIPE
#   Ce capteur mesure l'écart entre :
#     - la décision exécutoire  → binary_sensor.vmc_haute_vitesse_commandee
#       (régime automatique → décision auto ; régime manuel → consigne)
#     - l'état physiquement actif → switch.vmc_l1 / switch.vmc_l2
#
#   ON  = état réel conforme à la décision EXÉCUTOIRE
#   OFF = état réel contradictoire (non-conformité)
#   unknown = conformité indéterminée : décision exécutoire indisponible
#             (anti-fallback §16.2) OU XOR relais invalide
#
#   👉 Sous autorité MANUELLE, un écart entre la décision AUTOMATIQUE
#      (théorique, non exécutoire) et l'état physique est LÉGITIME : il
#      est exposé en attribut (decision_theorique / ecart_theorique),
#      SANS constituer une non-conformité. La conformité ne se juge que
#      contre la décision exécutoire.
#
# 🚫 CAUSE EXPOSÉE — AUCUNE CAUSE MUETTE (§16.2)
#   Tant que les relais sont lisibles, ce capteur reste DISPONIBLE et
#   expose, quand la décision exécutoire est indisponible, la cause
#   précise via l'attribut cause_indetermination (titulaire / consigne /
#   décision auto / XOR). Pas de capteur diagnostic agrégé.
#   👉 L'indisponibilité PHYSIQUE des relais n'est pas une cause exposée
#      ici : elle rend ce capteur lui-même `unavailable`. Elle est portée
#      par les entités relais et binary_sensor.vmc_coherence_physique.
#
# ❌ NE PAS CONFONDRE AVEC
#   binary_sensor.vmc_coherence_physique → validité électrique (XOR) seule.
#
# ⏱️ HYSTÉRÉSIS
#   Au retour en basse vitesse, l'application impose une durée minimale
#   de maintien (input_number.vmc_duree_min_haute). Pendant cette fenêtre,
#   un OFF de ce capteur est LÉGITIME (attribut non_conformite_legitime),
#   ancré sur le last_changed de la décision exécutoire.
#
# ⏱️ TOLÉRANCE TRANSITOIRE
#   delay_off: 8s — absorbe les transitoires de bascule relais.
#
# ❌ AUCUN EFFET DE BORD — ne corrige rien, ne déclenche rien, ne pilote
#   aucun relais. Observabilité fonctionnelle pure.
# ==========================================================

- binary_sensor:
    - name: "VMC conformité décision"
      unique_id: vmc_conformite_decision
      default_entity_id: binary_sensor.vmc_conformite_decision

      delay_off:
        seconds: 8

      # Disponible dès que l'état physique est LISIBLE. La décision
      # exécutoire indisponible n'entraîne PAS l'indisponibilité de ce
      # capteur : elle produit l'état `unknown` + la cause exposée
      # (§16.2 — aucune cause muette).
      availability: >
        {% set l1 = states('switch.vmc_l1') %}
        {% set l2 = states('switch.vmc_l2') %}
        {{ l1 in ['on', 'off'] and l2 in ['on', 'off'] }}

      state: >
        {% set executoire = states('binary_sensor.vmc_haute_vitesse_commandee') %}
        {% set l1 = states('switch.vmc_l1') == 'on' %}
        {% set l2 = states('switch.vmc_l2') == 'on' %}
        {% set xor_valide = (l1 and not l2) or (l2 and not l1) %}

        {# Décision exécutoire indisponible → conformité INDÉTERMINÉE #}
        {% if executoire not in ['on', 'off'] %}
          unknown
        {# XOR invalide → état réel non interprétable #}
        {% elif not xor_valide %}
          unknown
        {# Conformité fonctionnelle vs décision EXÉCUTOIRE #}
        {% elif executoire == 'on' %}
          {{ l1 and not l2 }}
        {% else %}
          {{ l2 and not l1 }}
        {% endif %}

      icon: >
        {% if is_state(this.entity_id, 'on') %}
          mdi:check-circle-outline
        {% elif is_state(this.entity_id, 'off') %}
          mdi:alert-circle-outline
        {% else %}
          mdi:help-circle-outline
        {% endif %}

      attributes:

        # Décision attendue = décision EXÉCUTOIRE (interface consommée par
        # l'alerte de non-conformité, inchangée).
        decision_attendue: >
          {% set executoire = states('binary_sensor.vmc_haute_vitesse_commandee') %}
          {% if executoire == 'on' %}
            haute
          {% elif executoire == 'off' %}
            basse
          {% else %}
            {{ executoire }}
          {% endif %}

        etat_physique_reel: >
          {% set l1 = states('switch.vmc_l1') %}
          {% set l2 = states('switch.vmc_l2') %}
          {% if l1 in ['unavailable', 'unknown']
                or l2 in ['unavailable', 'unknown'] %}
            indisponible
          {% elif l1 == 'on' and l2 == 'off' %}
            haute
          {% elif l2 == 'on' and l1 == 'off' %}
            basse
          {% else %}
            invalide
          {% endif %}

        xor_valide: >
          {% set l1 = states('switch.vmc_l1') == 'on' %}
          {% set l2 = states('switch.vmc_l2') == 'on' %}
          {{ (l1 and not l2) or (l2 and not l1) }}

        # Fenêtre d'hystérésis ancrée sur la décision EXÉCUTOIRE : décision
        # exécutoire OFF, L1 encore actif, et durée écoulée < durée minimale.
        dans_fenetre_hysteresis: >
          {% set executoire = states('binary_sensor.vmc_haute_vitesse_commandee') %}
          {% set l1 = states('switch.vmc_l1') %}
          {% set duree_min = states('input_number.vmc_duree_min_haute') | float(15) %}
          {% if executoire == 'off' and l1 == 'on' %}
            {% set last_off = states.binary_sensor.vmc_haute_vitesse_commandee.last_changed %}
            {% set elapsed = (now() - last_off).total_seconds() / 60 %}
            {{ elapsed < duree_min }}
          {% else %}
            false
          {% endif %}

        non_conformite_legitime: >
          {% set executoire = states('binary_sensor.vmc_haute_vitesse_commandee') %}
          {% set l1 = states('switch.vmc_l1') %}
          {% set duree_min = states('input_number.vmc_duree_min_haute') | float(15) %}
          {% set dans_fenetre = false %}
          {% if executoire == 'off' and l1 == 'on' %}
            {% set last_off = states.binary_sensor.vmc_haute_vitesse_commandee.last_changed %}
            {% set elapsed = (now() - last_off).total_seconds() / 60 %}
            {% set dans_fenetre = elapsed < duree_min %}
          {% endif %}
          {{ is_state(this.entity_id, 'off')
             and is_state('binary_sensor.vmc_haute_vitesse_commandee', 'off')
             and is_state('switch.vmc_l1', 'on')
             and dans_fenetre }}

        # Décision AUTOMATIQUE théorique (information) : en régime manuel,
        # son écart avec le réel est LÉGITIME et n'est pas une non-conformité.
        decision_theorique: >
          {% set req = states('binary_sensor.vmc_haute_vitesse_requise') %}
          {% if req == 'on' %}
            haute
          {% elif req == 'off' %}
            basse
          {% else %}
            {{ req }}
          {% endif %}

        ecart_theorique: >
          {% set req = states('binary_sensor.vmc_haute_vitesse_requise') %}
          {% set l1 = states('switch.vmc_l1') == 'on' %}
          {% set l2 = states('switch.vmc_l2') == 'on' %}
          {% set reel_haute = l1 and not l2 %}
          {% set reel_basse = l2 and not l1 %}
          {% if req == 'on' %}
            {{ not reel_haute }}
          {% elif req == 'off' %}
            {{ not reel_basse }}
          {% else %}
            unknown
          {% endif %}

        # Cause précise quand la conformité est indéterminée (§16.2).
        # NB : l'indisponibilité physique des relais n'est PAS une cause exposée
        # ici — ce capteur devient lui-même `unavailable` quand les relais ne
        # sont pas lisibles (voir availability), ce qui masque cet attribut.
        # Elle est portée par les entités relais (switch.vmc_l1 / vmc_l2) et par
        # binary_sensor.vmc_coherence_physique (§13.4, §13.10, contrat §16.2).
        cause_indetermination: >
          {% set titulaire = states('input_select.vmc_titulaire_autorite') %}
          {% set consigne = states('input_select.vmc_consigne_manuelle') %}
          {% set req = states('binary_sensor.vmc_haute_vitesse_requise') %}
          {% set l1 = states('switch.vmc_l1') %}
          {% set l2 = states('switch.vmc_l2') %}
          {% if titulaire not in ['automatique', 'manuel'] %}
            Titulaire d'autorité indisponible
          {% elif titulaire == 'manuel' and consigne not in ['basse', 'haute'] %}
            Consigne manuelle indisponible
          {% elif titulaire == 'automatique' and req not in ['on', 'off'] %}
            Décision automatique indisponible
          {% elif (l1 == 'on' and l2 == 'on') or (l1 == 'off' and l2 == 'off') %}
            XOR relais invalide — état physique non interprétable
          {% else %}
            none
          {% endif %}
