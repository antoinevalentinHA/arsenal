# ==========================================================
# 🧠 ARSENAL — BINARY SENSOR : VMC haute vitesse COMMANDÉE
# ----------------------------------------------------------
# 🎯 RÔLE
#   DÉCISION EXÉCUTOIRE UNIQUE de la VMC (pilote C36, §16.2).
#   Matérialise, en un seul point, l'autorité active :
#     - titulaire = automatique → suit la décision automatique
#       binary_sensor.vmc_haute_vitesse_requise (§3.1) ;
#     - titulaire = manuel       → suit la consigne
#       input_select.vmc_consigne_manuelle (§16.3).
#   ON = haute commandée · OFF = basse commandée.
#
# 🧱 DÉRIVÉ PUR (§2.4-like)
#   Aucun état propre, aucune mémoire, aucun timer, aucune
#   lecture de l'état physique. Fonction pure de :
#     input_select.vmc_titulaire_autorite,
#     input_select.vmc_consigne_manuelle,
#     binary_sensor.vmc_haute_vitesse_requise,
#     sensor.atmo_france_pm10_bordeaux,      (veto §17)
#     sensor.atmo_france_pm25_bordeaux.      (veto §17)
#
# 🚫 ANTI-FALLBACK STRICT (§16.2) — availability
#   La décision exécutoire n'est VALIDE que si le titulaire porte
#   une valeur valide ET que la source qu'il désigne est valide :
#     - automatique → décision auto ∈ {on, off} ;
#     - manuel      → consigne ∈ {basse, haute}.
#   À défaut → INDISPONIBLE (unavailable). Un unknown/unavailable
#   NE VAUT NI automatique, NI basse, NI absence de besoin :
#   AUCUNE valeur n'est substituée. L'application (PR C) s'abstient
#   sur une décision exécutoire indisponible.
#
# 🌫️ VETO SANITAIRE D'IMPORT — POLLUTION (§17, contrat v2.7)
#   En régime AUTOMATIQUE uniquement, la haute vitesse commandée
#   vaut « requise ET NON veto ». Le veto est actif si l'indice
#   PM10 OU PM2.5 COURANT ∈ {4,5,6,7} (« Mauvais » ou pire ; 7
#   Évènement inclus). Régime MANUEL : consigne souveraine, le
#   veto ne s'exerce pas (§17.6). Donnée non exploitable (`0`
#   « Indisponible »/valeur forcée en cas d'échec, unknown,
#   unavailable, non numérique) → AUCUN veto déduit (§17.4) ;
#   `availability` INCHANGÉE. Voies (§5,§6) et vmc_haute_vitesse_requise
#   (§3.1) NON modifiées : seul le régime COMMANDÉ est suspendu.
#   Entités J+1 et indice global : HORS décision (§17.2).
#
# ⚠️ Exposition de la cause d'indisponibilité (§16.2)
#   Quand cette entité est unavailable, HA masque ses attributs :
#   la cause d'indisponibilité au diagnostic est portée par la
#   couche conformité, dont l'adaptation vers cette décision
#   relève de la PR C (§16.5, §16.6). Les attributs ci-dessous
#   documentent le régime actif LORSQUE la décision est disponible.
# ==========================================================

- binary_sensor:
    - name: "VMC haute vitesse commandée"
      unique_id: vmc_haute_vitesse_commandee
      default_entity_id: binary_sensor.vmc_haute_vitesse_commandee

      # ANTI-FALLBACK : indisponible si le titulaire ou la source
      # qu'il désigne n'est pas valide. Aucune valeur substituée.
      availability: >
        {% set t = states('input_select.vmc_titulaire_autorite') %}
        {% set req = states('binary_sensor.vmc_haute_vitesse_requise') %}
        {% set cons = states('input_select.vmc_consigne_manuelle') %}
        {{ (t == 'automatique' and req in ['on', 'off'])
           or (t == 'manuel' and cons in ['basse', 'haute']) }}

      # ON = haute, OFF = basse. Les entrées sont garanties valides
      # par l'availability ci-dessus (pas de valeur inventée).
      # Régime automatique : requise ET NON veto pollution (§17).
      # Régime manuel : consigne souveraine, veto non exercé (§17.6).
      state: >
        {% if is_state('input_select.vmc_titulaire_autorite', 'manuel') %}
          {{ is_state('input_select.vmc_consigne_manuelle', 'haute') }}
        {% else %}
          {% set pm10 = states('sensor.atmo_france_pm10_bordeaux') | int(0) %}
          {% set pm25 = states('sensor.atmo_france_pm25_bordeaux') | int(0) %}
          {% set veto = pm10 in [4, 5, 6, 7] or pm25 in [4, 5, 6, 7] %}
          {{ is_state('binary_sensor.vmc_haute_vitesse_requise', 'on') and not veto }}
        {% endif %}

      icon: >
        {% if is_state(this.entity_id, 'on') %}
          mdi:fan-chevron-up
        {% else %}
          mdi:fan
        {% endif %}

      attributes:
        # Régime / titulaire courant (diagnostic, lecture seule).
        titulaire: >
          {{ states('input_select.vmc_titulaire_autorite') }}

        # Source de la décision exécutoire selon le régime.
        source_decision: >
          {% if is_state('input_select.vmc_titulaire_autorite', 'manuel') %}
            consigne manuelle
          {% else %}
            décision automatique
          {% endif %}

        # Régime commandé, lisible (haute / basse / indisponible).
        regime_commande: >
          {% if is_state(this.entity_id, 'on') %}
            haute
          {% elif is_state(this.entity_id, 'off') %}
            basse
          {% else %}
            indisponible
          {% endif %}

        # §17.7 — état du veto pollution, TROIS états distincts.
        # Non exploitable N'EST PAS « inactif » (§17.4) : c'est
        # « indisponible », aucun veto déduit.
        veto_pollution: >
          {% set pm10 = states('sensor.atmo_france_pm10_bordeaux') | int(0) %}
          {% set pm25 = states('sensor.atmo_france_pm25_bordeaux') | int(0) %}
          {% set pm10_ok = pm10 >= 1 and pm10 <= 7 %}
          {% set pm25_ok = pm25 >= 1 and pm25 <= 7 %}
          {% if pm10 in [4, 5, 6, 7] or pm25 in [4, 5, 6, 7] %}
            actif
          {% elif not pm10_ok and not pm25_ok %}
            indisponible
          {% else %}
            inactif
          {% endif %}

        # §17.7 — valeurs PM COURANTES utilisées (état brut, jamais un
        # repli numérique). J+1 et indice global : hors décision (§17.2).
        pm10_indice: >
          {{ states('sensor.atmo_france_pm10_bordeaux') }}

        pm25_indice: >
          {{ states('sensor.atmo_france_pm25_bordeaux') }}

        # §17.7 — distinction « requise mais suspendue par veto » vs
        # « non requise ». Vrai uniquement en automatique, requise ON et
        # veto actif (en manuel le veto ne s'exerce pas, §17.6).
        requise_mais_vetoee: >
          {% set pm10 = states('sensor.atmo_france_pm10_bordeaux') | int(0) %}
          {% set pm25 = states('sensor.atmo_france_pm25_bordeaux') | int(0) %}
          {% set veto = pm10 in [4, 5, 6, 7] or pm25 in [4, 5, 6, 7] %}
          {{ is_state('input_select.vmc_titulaire_autorite', 'automatique')
             and is_state('binary_sensor.vmc_haute_vitesse_requise', 'on')
             and veto }}
