# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSORS
#     Imprimerie — Surveillance d'ambiance des stocks — Situation
# ----------------------------------------------------------
# 🎯 RÔLE
#   Classer, pour chaque voie (zone × grandeur), la mesure
#   courante par rapport aux seuils critiques communs :
#     - dans_plage               : valeur numérique valide, bornes
#                                  INCLUSES (10 ≤ T ≤ 35 ; 30 ≤ HR ≤ 80)
#     - hors_plage               : valeur numérique valide hors bornes
#     - mesure_invalide          : unknown / unavailable / non
#                                  numérique / capteur absent
#     - parametres_indisponibles : seuil illisible (abstention)
#     - inactif                  : voie d'essai hors essai
#
# 🧩 PÉRIMÈTRE
#   Voies réelles :
#     sensor.temperature_surveillance_stock_carton
#       ← sensor.temperature_stock_carton
#     sensor.humidite_relative_surveillance_stock_carton
#       ← sensor.humidite_relative_stock_carton
#     sensor.temperature_surveillance_stock_pf
#       ← sensor.temperature_stock_pf
#     sensor.humidite_relative_surveillance_stock_pf
#       ← sensor.humidite_relative_stock_pf
#   Voie d'ESSAI :
#     sensor.temperature_surveillance_essai_stock
#       ← valeur SIMULÉE dérivée des seuils de production selon
#         input_select.essai_alarme_stock (aucun capteur source lu
#         ni écrit)
#
#   La voie est lue dans l'entity_id (`<grandeur>_surveillance_
#   <zone>`) : une seule logique (ancre YAML) pour les cinq voies,
#   essai compris — l'essai éprouve la MÊME décision.
#
# 📜 CONTRAT
#   00_documentation_arsenal/contrats/imprimerie/surveillance_ambiance_stock.md
#
# 🧱 NATURE
#   Décision pure, sans mémoire, sans effet de bord.
#   Aucune valeur de repli : une mesure ou un seuil illisible
#   n'est JAMAIS classé « dans_plage ».
#
# 🚫 NE FAIT PAS
#   - aucune temporisation (cf. depassement_prolonge.yaml)
#   - aucune notification, aucune écriture
#   - n'utilise pas les seuils statistiques dynamiques
#     (`*_seuil_bas_*` / `*_seuil_haut_*`) : ce sont des repères
#     de coloration, pas des seuils critiques
#   - aucune statistique long terme (pas de state_class)
# ==========================================================

- sensor:
    - &surveillance_stock
      name: "Température Surveillance Stock Carton"
      unique_id: temperature_surveillance_stock_carton
      default_entity_id: sensor.temperature_surveillance_stock_carton
      icon: mdi:shield-search
      state: >-
        {% set p = this.entity_id.split('.')[1].split('_surveillance_') %}
        {% set g = p[0] %}
        {% set z = p[1] %}
        {% set bas = states('input_select.' ~ g ~ '_seuil_critique_bas_stock') | float(none) %}
        {% set haut = states('input_select.' ~ g ~ '_seuil_critique_haut_stock') | float(none) %}
        {% if z == 'essai_stock' %}
          {% set phase = states('input_select.essai_alarme_stock') %}
          {% set actif = phase in ['hors_plage', 'invalide', 'dans_plage'] %}
          {% if phase == 'hors_plage' and haut is not none %}
            {% set v = haut + 1 %}
          {% elif phase == 'dans_plage' and bas is not none and haut is not none %}
            {% set v = (bas + haut) / 2 %}
          {% else %}
            {% set v = none %}
          {% endif %}
        {% else %}
          {% set actif = true %}
          {% set v = states('sensor.' ~ g ~ '_' ~ z) | float(none) %}
        {% endif %}
        {% if not actif %}
          inactif
        {% elif bas is none or haut is none %}
          parametres_indisponibles
        {% elif v is none %}
          mesure_invalide
        {% elif v < bas or v > haut %}
          hors_plage
        {% else %}
          dans_plage
        {% endif %}
      attributes:
        valeur: >-
          {% set p = this.entity_id.split('.')[1].split('_surveillance_') %}
          {% set g = p[0] %}
          {% set z = p[1] %}
          {% set bas = states('input_select.' ~ g ~ '_seuil_critique_bas_stock') | float(none) %}
          {% set haut = states('input_select.' ~ g ~ '_seuil_critique_haut_stock') | float(none) %}
          {% if z == 'essai_stock' %}
            {% set phase = states('input_select.essai_alarme_stock') %}
            {% if phase == 'hors_plage' and haut is not none %}
              {{ haut + 1 }}
            {% elif phase == 'dans_plage' and bas is not none and haut is not none %}
              {{ (bas + haut) / 2 }}
            {% else %}
              {{ none }}
            {% endif %}
          {% else %}
            {{ states('sensor.' ~ g ~ '_' ~ z) | float(none) }}
          {% endif %}
        valeur_simulee: >-
          {{ this.entity_id.endswith('_essai_stock') }}

    - <<: *surveillance_stock
      name: "Humidité relative Surveillance Stock Carton"
      unique_id: humidite_relative_surveillance_stock_carton
      default_entity_id: sensor.humidite_relative_surveillance_stock_carton

    - <<: *surveillance_stock
      name: "Température Surveillance Stock PF"
      unique_id: temperature_surveillance_stock_pf
      default_entity_id: sensor.temperature_surveillance_stock_pf

    - <<: *surveillance_stock
      name: "Humidité relative Surveillance Stock PF"
      unique_id: humidite_relative_surveillance_stock_pf
      default_entity_id: sensor.humidite_relative_surveillance_stock_pf

    # Voie d'ESSAI — même logique, valeur simulée.
    - <<: *surveillance_stock
      name: "Température Surveillance Essai Stock"
      unique_id: temperature_surveillance_essai_stock
      default_entity_id: sensor.temperature_surveillance_essai_stock
      icon: mdi:test-tube
