# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSOR
#     NAS Admission — Diagnostic AUDIT (état de la transaction)
# ----------------------------------------------------------
# 📌 Fichier
#   12_template_sensors/system/nas_admission/nas_admission_audit_etat_transaction.yaml
#
# 🎯 RÔLE
#   Exposer, en lecture diagnostique, le dernier état
#   transactionnel connu pour l'opération AUDIT — jamais un
#   résultat métier (voir domaine arsenal_self pour
#   ok/alert/error, contrats/nas_transactionnel.md §12).
#
# 🧱 PRINCIPE
#   - Source : sensor.nas_admission_result_operation /
#     sensor.nas_admission_result_transaction_verdict /
#     sensor.nas_admission_result_run_id /
#     sensor.nas_admission_result_request_id
#     (12_template_sensors/system/nas_admission/nas_admission_result_correlation.yaml)
#   - Le canal source est PARTAGÉ AUDIT + RELEASE_DIFF (contrat
#     §13.1) : ce fichier FILTRE sur operation == 'AUDIT' et
#     LATCHE (via this.state) le dernier verdict AUDIT connu —
#     un message RELEASE_DIFF sur le canal partagé ne doit
#     jamais effacer ou remplacer l'état AUDIT affiché ici.
#   - Diagnostic minimal inspiré de nas_transactionnel.md §14
#     (last_operation/last_run_id/last_transaction_verdict),
#     décliné côté HA pour le seul périmètre du pilote AUDIT
#     (C51 Lot 5).
#
# ⚠️ IMPORTANT
#   - 'sans_donnee' avant toute première transaction AUDIT
#     observée (aucun latch à faire : rien à latcher)
#   - Cette entité ne décide rien et ne déclenche aucune action
#     corrective — lecture seule
#   - Ne remplace pas la corrélation réelle effectuée par le
#     script exécutif (qui compare le request_id à sa propre
#     transaction en cours, pas au dernier message reçu)
# ==========================================================

- sensor:
    - name: "NAS admission AUDIT état transaction"
      unique_id: nas_admission_audit_etat_transaction
      icon: mdi:list-status
      state: >
        {% set op = states('sensor.nas_admission_result_operation') %}
        {% set verdict = states('sensor.nas_admission_result_transaction_verdict') %}
        {% if op == 'AUDIT' and verdict not in ['unknown', 'unavailable', ''] %}
          {{ verdict }}
        {% else %}
          {% set prev = this.state %}
          {{ prev if prev not in [none, 'unknown', 'unavailable'] else 'sans_donnee' }}
        {% endif %}
      attributes:
        request_id: >
          {% set op = states('sensor.nas_admission_result_operation') %}
          {% if op == 'AUDIT' %}
            {{ states('sensor.nas_admission_result_request_id') }}
          {% else %}
            {{ this.attributes.get('request_id', 'unknown') }}
          {% endif %}
        run_id: >
          {% set op = states('sensor.nas_admission_result_operation') %}
          {% if op == 'AUDIT' %}
            {{ states('sensor.nas_admission_result_run_id') }}
          {% else %}
            {{ this.attributes.get('run_id', 'unknown') }}
          {% endif %}
