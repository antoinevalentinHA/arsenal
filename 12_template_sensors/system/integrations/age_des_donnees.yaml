# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSORS : AGE DES DONNEES (CANON)
# ----------------------------------------------------------
# 🎯 RÔLE
#   Normaliser le calcul "age des donnees" (minutes) pour
#   toutes les integrations basees sur un group.* de capteurs.
#
# ✅ SORTIE CANON
#   - Valeur : entier (minutes)
#   - Unité  : "min"
#   - Plafond: 300
#   - Fallback : conserve la derniere valeur numerique (999 si vide)
#
# ⚠️ NOTE UI
#   - Pas de device_class: duration
#     (sinon l'UI peut afficher 4:00 au lieu de 240 min)
#
# 🕒 REFERENCE TEMPORELLE — last_reported (et NON last_updated)
#   La fraîcheur mesure la LIVENESS de l'intégration, pas la stabilité
#   de la valeur. `last_reported` se rafraîchit à chaque écriture du
#   coordinateur même si la valeur est identique, et ne gèle que si
#   l'intégration cesse réellement de rapporter. `last_updated`, lui,
#   ne bouge qu'au changement de valeur : une intégration saine mais
#   « calme » (valeurs stables) y paraît figée -> faux gel -> relances.
#   Choix délibéré : ne PAS revenir à last_updated / last_changed ici.
# ==========================================================

- sensor:
    - &age_donnees_canon
      unit_of_measurement: "min"
      state_class: measurement

      state: >
        {% set UNAV = ['unknown','unavailable','', none] %}
        {% set MAX_MINUTES = 300 %}
        {% set grp = state_attr(this.entity_id, 'source_group') %}

        {% if grp in UNAV %}
          {{ this.state | float(999) }}
        {% else %}
          {% set items = expand(grp) %}
          {% if items | count > 0 %}
            {% set entites = items
                | rejectattr('state', 'in', ['unknown','unavailable'])
                | selectattr('last_reported', 'defined')
                | list %}
            {% if entites | count > 0 %}
              {% set last = entites | map(attribute='last_reported') | map('as_timestamp') | max %}
              {% set age = ((now().timestamp() - last) / 60) | int(0) %}
              {{ [age, MAX_MINUTES] | min }}
            {% else %}
              {{ this.state | float(999) }}
            {% endif %}
          {% else %}
            {{ this.state | float(999) }}
          {% endif %}
        {% endif %}

    - <<: *age_donnees_canon
      name: "Audi Age Donnees"
      unique_id: audi_age_donnees
      icon: mdi:car-clock
      attributes:
        source_group: "group.audi_capteurs"

    - <<: *age_donnees_canon
      name: "Petite Maison Cumulus Age Donnees"
      unique_id: petite_maison_cumulus_age_donnees
      icon: mdi:water-boiler
      attributes:
        source_group: "group.petite_maison_cumulus"

    - <<: *age_donnees_canon
      name: "Fujitsu Age donnees"
      unique_id: fujitsu_age_donnees
      icon: mdi:air-conditioner
      attributes:
        source_group: "group.fujitsu_capteurs"

    # Une entree de configuration = un capteur d'age (v2.3 §12).
    # `homekit_age_donnees` (groupe agrege des deux stations + deux
    # facades) est supprime : il ne mesurait la fraicheur d'aucune
    # entree, et les facades l'empechaient structurellement de monter.
    - <<: *age_donnees_canon
      name: "Homekit Station Enfants Age Donnees"
      unique_id: homekit_station_enfants_age_donnees
      icon: mdi:home-thermometer-outline
      attributes:
        source_group: "group.homekit_station_enfants"

    - <<: *age_donnees_canon
      name: "Homekit Station Salle De Jeux Age Donnees"
      unique_id: homekit_station_salle_de_jeux_age_donnees
      icon: mdi:home-thermometer-outline
      attributes:
        source_group: "group.homekit_station_salle_de_jeux"

    # Entrée `homekit_controller` du pont de volets (Prise Control).
    # Chaîne ancrée sur CETTE entrée uniquement — cf. contrat
    # resilience_integrations.md v2.0 §12.3 (R-ANCRAGE-1).
    - <<: *age_donnees_canon
      name: "Homekit Prise Control Age Donnees"
      unique_id: homekit_prise_control_age_donnees
      icon: mdi:window-shutter
      attributes:
        source_group: "group.homekit_prise_control"

    - <<: *age_donnees_canon
      name: "Netatmo Age Donnees"
      unique_id: netatmo_age_donnees
      icon: mdi:weather-cloudy
      attributes:
        source_group: "group.netatmo_capteurs"

    # Un capteur d'age par ENTREE-domaine (scission du 2026-08-24).
    # Cote BLE l'age est OBSERVABILITE PURE : l'axe fraicheur y est
    # inapplicable (push sur changement, R-AXE1-1) et n'est pas cable.
