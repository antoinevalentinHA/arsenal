      name: "SwitchBot BLE Age Donnees"
      unique_id: switchbot_ble_age_donnees
      icon: mdi:bluetooth
      attributes:
        source_group: "group.switchbot_ble_capteurs"

    - <<: *age_donnees_canon
      name: "SwitchBot Cloud Age Donnees"
      unique_id: switchbot_cloud_age_donnees
      icon: mdi:cloud-outline
      attributes:
        source_group: "group.switchbot_cloud_capteurs"

    - <<: *age_donnees_canon
      name: "Synology Age Donnees"
      unique_id: synology_age_donnees
