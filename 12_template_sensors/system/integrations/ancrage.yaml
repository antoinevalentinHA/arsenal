# ==========================================================
#  🧠 ARSENAL — TEMPLATE BINARY SENSOR
#     Ancrage des chaînes de résilience (contrôle runtime)
# ----------------------------------------------------------
#  🎯 RÔLE
#     Vérifier que chaque périmètre de détection déclaré est
#     ancré sur UNE SEULE entrée de configuration.
#
#  📐 CONTRAT — resilience_integrations.md §12.3 / §12.4
#     R-ANCRAGE-1 : le périmètre observé doit appartenir à
#     l'entrée que l'action répare.
#     R-ANCRAGE-2 : aucune entité dérivée dans le périmètre.
#
#  ⚠️ POURQUOI CE CONTRÔLE EST RUNTIME ET NON CI
#     L'appartenance d'une entité à une entrée n'existe QUE
#     dans le registre d'entités de Home Assistant. Elle se lit
#     par `config_entry_id()`, une fonction de template — donc
#     indisponible à une analyse statique du dépôt.
#
#     La CI couvre le volet statiquement décidable (règle R15 :
#     aucune entité produite par les templates du dépôt dans un
#     périmètre). Ce capteur couvre le reste : l'appartenance
#     réelle. Les deux sont complémentaires, aucun ne remplace
#     l'autre.
#
#  🧱 CE QU'IL DÉTECTE
#     - membre sans entrée de configuration  -> dérivé ou
#       étranger (R-ANCRAGE-2). Vérifié sur TOUS les groupes.
#     - groupe vide ou introuvable
#     - périmètre couvrant PLUSIEURS entrées alors que l'action
#       ne recharge qu'une entrée -> mal ancré (R-ANCRAGE-1)
#     - périmètre NON FERMÉ sur son domaine : ses entrées
#       appartiennent à plusieurs intégrations. Contrôle ajouté
#       après l'incident du 2026-08-24 — `group.switchbot_capteurs`
#       couvrait switchbot + switchbot_cloud + mqtt, si bien qu'un
#       rechargement ciblé y aurait rechargé le broker Mosquitto.
#       Avec un ciblage, le groupe devient une ACL D'ACTION : sa
#       composition décide de ce qui sera rechargé.
#
#  🧭 DEUX FAMILLES DE PÉRIMÈTRES
#     Un périmètre multi-entrées n'est pas fautif en soi : il
#     l'est quand l'ACTION n'en recharge qu'une (R-ANCRAGE-4).
#
#     - `GROUPES_MONO`  : l'action désigne UNE entrée précise
#       (`entry_id`). Le périmètre DOIT donc tenir dans une
#       entrée unique, sinon l'action ne répare pas ce qu'elle
#       observe.
#     - `GROUPES_CIBLES` : l'action cible le périmètre lui-même
#       (`reload_target`), donc recharge toutes ses entrées par
#       construction. Le multi-entrées y est légitime.
#
#     ⚠️ Déplacer un groupe de MONO vers CIBLES sans que son
#     automation transmette réellement `reload_target` revient à
#     faire taire un écart réel. Les deux doivent bouger ensemble.
#
#  🕒 CADENCE — trois déclencheurs, et c'est délibéré
#     La composition d'un groupe ne change qu'au DÉPLOIEMENT.
#     C'est précisément pour ça qu'un tick très espacé ne suffit
#     pas : le déploiement est le moment où le contrôle doit
#     parler, et un rechargement des modèles ne déclenche NI
#     `homeassistant: start` NI un tick horaire.
#
#     - `event_template_reloaded` : évaluation immédiate au
#       rechargement des modèles. C'est le cas d'usage principal.
#     - `homeassistant: start` : au démarrage.
#     - `time_pattern` horaire : filet de sécurité. Si le nom
#       d'événement ci-dessus devenait faux, le trigger ne
#       déclencherait simplement jamais (HA n'échoue pas sur un
#       type d'événement inconnu) et la fenêtre aveugle resterait
#       bornée à une heure au lieu d'être infinie.
#
#     `config_entry_id` n'étant pas réactive, un capteur sans
#     trigger figerait sa valeur au démarrage.
#     Couche OBSERVATION : aucun de ces réveils ne déclenche
#     d'action (R-AXE3-5).
#
#  📋 ÉNUMÉRATION DÉCLARATIVE
#     La liste des groupes est écrite en clair — ce ne sont pas
#     des secrets. Aucun balayage de `states` (R-AXE3-6) : le
#     capteur ne s'abonne qu'aux groupes qu'il cite.
#
#  🚫 INTERDITS
#     - Déclencher une action depuis ce fichier
#     - Balayer les entités du système pour découvrir les groupes
#     - Retirer un groupe de la liste pour faire taire un écart
#     - Classer un groupe en CIBLES sans que son automation
#       transmette `reload_target` sur ce même groupe
# ==========================================================

- trigger:
    - platform: event
      event_type: event_template_reloaded
    - platform: homeassistant
      event: start
    - platform: time_pattern
      hours: "/1"

  binary_sensor:
    - name: "Ancrage chaines resilience non conforme"
      unique_id: ancrage_chaines_resilience_non_conforme
      default_entity_id: binary_sensor.ancrage_chaines_resilience_non_conforme
      icon: mdi:link-variant-off

      state: >
        {% set mono = [
          'group.netatmo_capteurs',
          'group.fujitsu_capteurs',
          'group.homekit_station_enfants',
          'group.homekit_station_salle_de_jeux',
          'group.petite_maison_cumulus',
          'group.synology_capteurs',
          'group.homekit_prise_control',
          'group.audi_capteurs',
          'group.withings_capteurs'
        ] %}
        {% set cibles = ['group.switchbot_ble_capteurs',
                         'group.switchbot_cloud_capteurs'] %}
        {% set ns = namespace(fautifs=0) %}
        {% for g in mono + cibles %}
          {% set membres = expand(g) | map(attribute='entity_id') | list %}
          {% set entrees = membres | map('config_entry_id') | unique | list %}
          {% set domaines = entrees | reject('none') | map('config_entry_attr','domain') | unique | list %}
          {% if membres | count == 0
                or none in entrees
                or domaines | count > 1
                or (g in mono and entrees | count != 1) %}
            {% set ns.fautifs = ns.fautifs + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.fautifs > 0 }}

      attributes:
        detail: >
          {% set mono = [
            'group.netatmo_capteurs',
            'group.fujitsu_capteurs',
            'group.homekit_station_enfants',
            'group.homekit_station_salle_de_jeux',
            'group.petite_maison_cumulus',
            'group.synology_capteurs',
            'group.homekit_prise_control',
            'group.audi_capteurs',
            'group.withings_capteurs'
          ] %}
          {% set cibles = ['group.switchbot_ble_capteurs',
                           'group.switchbot_cloud_capteurs'] %}
          {% set ns = namespace(lignes=[]) %}
          {% for g in mono + cibles %}
            {% set membres = expand(g) | map(attribute='entity_id') | list %}
            {% set entrees = membres | map('config_entry_id') | unique | list %}
            {% if membres | count == 0 %}
              {% set ns.lignes = ns.lignes + [g ~ ' : groupe vide'] %}
            {% elif none in entrees %}
              {% set ns.lignes = ns.lignes + [g ~ ' : membre(s) sans entree de configuration'] %}
            {% elif (entrees | reject('none') | map('config_entry_attr','domain') | unique | list | count) > 1 %}
              {% set ns.lignes = ns.lignes + [g ~ ' : perimetre NON FERME, domaines = ' ~ (entrees | reject('none') | map('config_entry_attr','domain') | unique | list | join('+'))] %}
            {% elif g in mono and entrees | count != 1 %}
              {% set ns.lignes = ns.lignes + [g ~ ' : ' ~ (entrees | count) ~ ' entrees pour une action mono-entree'] %}
            {% endif %}
          {% endfor %}
          {{ ns.lignes | join(' | ') if ns.lignes else 'ancrage conforme sur tous les perimetres declares' }}
