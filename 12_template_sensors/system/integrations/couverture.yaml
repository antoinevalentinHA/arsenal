# ==========================================================
#  🧠 ARSENAL — TEMPLATE BINARY SENSOR
#     Couverture des entrées de configuration (contrôle runtime)
# ----------------------------------------------------------
#  🎯 RÔLE
#     Vérifier que, dans chaque domaine portant au moins une
#     chaîne de résilience, toute entrée active est SOIT
#     couverte par un périmètre, SOIT dérogée explicitement.
#
#  📐 CONTRAT — resilience_integrations.md v3.0 §10.2
#     R-COUVERTURE-1 : couverture exhaustive BORNÉE aux domaines
#     portant une chaîne, avec dérogations déclarées. Une entrée
#     ni couverte ni dérogée est un ÉCART.
#     R-COUVERTURE-2 : une dérogation porte entrée, motif, et
#     critère de levée.
#     R-COUVERTURE-3 : contrôle runtime, alimenté par
#     `integration_entities()`.
#
#  ⚠️ POURQUOI `integration_entities()` ET NON UN BALAYAGE DE `states`
#     Un balayage de `states` établirait une souscription à TOUS
#     les changements d'état du système — coût permanent
#     injustifiable pour une observation rare (R-AXE3-6).
#     `integration_entities()` n'établit AUCUNE souscription :
#     vérifié le 2026-08-24 dans l'éditeur de modèles, qui
#     indique explicitement « n'écoute aucun événement ».
#     Corollaire : la lecture n'étant pas réactive, les
#     déclencheurs explicites sont OBLIGATOIRES (R-AXE3-4).
#
#  🧱 CE QU'IL DÉTECTE
#     Pour chaque domaine sous couverture : les entrées présentes
#     qui ne sont ni dans un périmètre déclaré, ni dérogées.
#
#  🚫 DEUX LIMITES ASSUMÉES — un `off` ne prouve pas l'exhaustivité
#     1. Une entrée SANS AUCUNE ENTITÉ est invisible ici. Ce
#        contrôle trouve des trous ; il ne prouve pas qu'il n'y
#        en a plus.
#     2. Les domaines dont la chaîne n'a PAS de périmètre
#        (`disponibilite_native`, cf. Zigbee2MQTT) sont exclus du
#        décompte et listés ci-dessous. Leur absence est un FAIT
#        DOCUMENTÉ, pas un trou.
#
#  🔑 UNE DÉROGATION SE DÉCLARE PAR ENTITÉ TÉMOIN, JAMAIS PAR TITRE
#     Contrat §12.5.2, R-ANCRAGE-9 et R-COUVERTURE-4.
#     Le titre d'une entrée n'est ni stable ni unique : il est
#     choisi par l'intégration, souvent dérivé d'un compte ou d'un
#     identifiant matériel, et deux entrées d'un même domaine
#     peuvent porter le MÊME. Mesuré le 2026-08-24 : les deux
#     stations HomeKit s'appellent toutes deux « Weather Station ».
#     Déroger par titre aurait donc pu en dérober deux d'un coup,
#     sans que rien ne le dise.
#
#     Un TÉMOIN est une entité de l'entrée, écrite en clair ici.
#     Elle ne DÉSIGNE pas l'entrée, elle la RÉSOUT à l'exécution
#     par `config_entry_id()` — une entité appartenant à une seule
#     entrée, la dérogation ne peut pas déborder.
#
#     Mode de défaillance, et il est BRUYANT : si le témoin
#     disparaît (renommage, remplacement de matériel), il ne
#     résout plus, l'entrée cesse d'être dérogée et REDEVIENT un
#     écart visible. Une dérogation périmée se signale d'elle-même
#     au lieu de survivre en silence. L'attribut `detail` nomme en
#     plus le témoin mort, faute de quoi on chercherait une entrée
#     nouvelle là où il n'y a qu'un témoin obsolète.
#
#  🚫 INTERDITS
#     - Déclencher une action depuis ce fichier
#     - Balayer `states` pour énumérer les entrées
#     - Ajouter un domaine à `sans_perimetre` pour faire taire un
#       écart : cette liste est réservée aux chaînes réellement
#       dépourvues de groupe source
#     - Inscrire une dérogation ici sans l'inscrire au registre
#       avec son motif et son critère de levée (R-COUVERTURE-2)
#     - Déroger par TITRE d'entrée (R-ANCRAGE-9) : un titre n'est
#       pas une clé
#     - Déroger par MOTIF plutôt que par témoin nominatif : un
#       motif auto-dérogerait des entrées futures que personne
#       n'aurait examinées — et raterait celles qui ne suivent pas
#       la convention de nommage. `switch.bot_*` illustre les deux
#       travers à la fois : il dérogerait tout futur Bot, et
#       manquerait `switch.deshumidificateur`
# ==========================================================

- trigger:
    - platform: event
      event_type: event_template_reloaded
    - platform: homeassistant
      event: start
    - platform: time_pattern
      hours: "/1"

  binary_sensor:
    - name: "Couverture entrees resilience incomplete"
      unique_id: couverture_entrees_resilience_incomplete
      default_entity_id: binary_sensor.couverture_entrees_resilience_incomplete
      icon: mdi:shield-alert-outline

      state: >
        {% set couples = [
          ('netatmo',            ['group.netatmo_capteurs']),
          ('fujitsu_airstage',   ['group.fujitsu_capteurs']),
          ('homekit_controller', ['group.homekit_station_enfants',
                                  'group.homekit_station_salle_de_jeux',
                                  'group.homekit_prise_control']),
          ('overkiz',            ['group.petite_maison_cumulus']),
          ('switchbot',          ['group.switchbot_ble_capteurs']),
          ('switchbot_cloud',    ['group.switchbot_cloud_capteurs']),
          ('synology_dsm',       ['group.synology_capteurs']),
          ('audiconnect',        ['group.audi_capteurs']),
          ('withings',           ['group.withings_capteurs'])
        ] %}
        {# Dérogations déclarées, par ENTITÉ TÉMOIN — chacune figure au
           registre avec son motif et son critère de levée (R-COUVERTURE-2).
           Le témoin ne désigne pas l'entrée : il la RÉSOUT, à l'exécution.
           ⚠️ Liste NOMINATIVE, jamais un motif : `switch.bot_*`
           auto-dérogerait tout futur Bot sans que personne ne l'écrive —
           et raterait `switch.deshumidificateur`, qui ne porte pas le
           préfixe. Un motif se trompe dans les deux sens à la fois. #}
        {% set derogations_temoins = [
          'switch.bot_chambre_parents',
          'switch.deshumidificateur'
        ] %}
        {% set derogees = derogations_temoins
           | map('config_entry_id') | reject('none') | unique | list %}
        {% set ns = namespace(ecarts=0) %}
        {% for dom, groupes in couples %}
          {% set presentes = integration_entities(dom)
             | map('config_entry_id') | reject('none') | unique | list %}
          {% set nsg = namespace(couv=[]) %}
          {% for g in groupes %}
            {% set nsg.couv = nsg.couv + (expand(g) | map(attribute='entity_id')
               | map('config_entry_id') | reject('none') | list) %}
          {% endfor %}
          {% for e in presentes %}
            {% if e not in nsg.couv and e not in derogees %}
              {% set ns.ecarts = ns.ecarts + 1 %}
            {% endif %}
          {% endfor %}
        {% endfor %}
        {{ ns.ecarts > 0 }}

      attributes:
        # Domaines sous couverture dont la chaîne n'a pas de périmètre :
        # exclus du décompte, et c'est un fait documenté.
        sans_perimetre: "mqtt (Zigbee2MQTT — chaîne en disponibilité native, binaire de bridge)"

        detail: >
          {% set couples = [
            ('netatmo',            ['group.netatmo_capteurs']),
            ('fujitsu_airstage',   ['group.fujitsu_capteurs']),
            ('homekit_controller', ['group.homekit_station_enfants',
                                    'group.homekit_station_salle_de_jeux',
                                    'group.homekit_prise_control']),
            ('overkiz',            ['group.petite_maison_cumulus']),
            ('switchbot',          ['group.switchbot_ble_capteurs']),
            ('switchbot_cloud',    ['group.switchbot_cloud_capteurs']),
            ('synology_dsm',       ['group.synology_capteurs']),
            ('audiconnect',        ['group.audi_capteurs']),
            ('withings',           ['group.withings_capteurs'])
          ] %}
          {% set derogations_temoins = [
            'switch.bot_chambre_parents',
            'switch.deshumidificateur'
          ] %}
          {% set derogees = derogations_temoins
             | map('config_entry_id') | reject('none') | unique | list %}
          {% set nsm = namespace(morts=[]) %}
          {% for w in derogations_temoins %}
            {% if config_entry_id(w) is none %}
              {% set nsm.morts = nsm.morts + [w] %}
            {% endif %}
          {% endfor %}
          {% set ns = namespace(lignes=[]) %}
          {% for dom, groupes in couples %}
            {% set presentes = integration_entities(dom)
               | map('config_entry_id') | reject('none') | unique | list %}
            {% set nsg = namespace(couv=[], manque=[]) %}
            {% for g in groupes %}
              {% set nsg.couv = nsg.couv + (expand(g) | map(attribute='entity_id')
                 | map('config_entry_id') | reject('none') | list) %}
            {% endfor %}
            {% for e in presentes %}
              {% if e not in nsg.couv and e not in derogees %}
                {% set nsg.manque = nsg.manque + [config_entry_attr(e, 'title')] %}
              {% endif %}
            {% endfor %}
            {% if nsg.manque %}
              {% set ns.lignes = ns.lignes + [
                 dom ~ ' : ' ~ (presentes | count - nsg.manque | count) ~ '/'
                 ~ (presentes | count) ~ ' — non couvert(es) : '
                 ~ (nsg.manque | join(', ')) ] %}
            {% endif %}
          {% endfor %}
          {% set base = ns.lignes | join(' | ') if ns.lignes
             else 'toutes les entrees des domaines sous couverture sont couvertes ou derogees' %}
          {# Un temoin qui ne resout plus signale une derogation PERIMEE. L'ecart
             remonte de toute facon (l'entree redevient non couverte), mais sans
             ce message on chercherait une entree nouvelle au lieu d'un temoin
             mort — deux diagnostics tres differents. #}
          {{ base ~ (' || TEMOIN(S) DE DEROGATION SANS ENTREE : '
             ~ (nsm.morts | join(', ')) if nsm.morts else '') }}
