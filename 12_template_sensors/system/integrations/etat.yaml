# ==========================================================
#  🧠 ARSENAL — TEMPLATE BINARY SENSORS
#     Age des donnees — ETATS METIER (gel / retour ok)
# ----------------------------------------------------------
#  🎯 ROLE
#     Stabiliser les triggers des automations de resilience :
#       - gel_avere       : incident confirme (debounce)
#       - recovery_en_cours : EPISODE DE RECOVERY OUVERT
#       - retour_ok       : retour constate, uniquement si recovery_en_cours
#
#  ⚠️ recovery_en_cours = "EPISODE OUVERT", PAS "timer actif"
#     L'expiration du backoff est un evenement NORMAL du cycle : elle
#     declenche la tentative suivante. Definir ce binaire sur le seul
#     timer en faisait une DENT DE SCIE, et le retour_ok (debounce 2 min)
#     pouvait etre coupe net par une expiration -> compteur jamais remis
#     a zero, chaine bloquee a vie apres un plafond.
#     Observe le 2026-08-24 : reprise a 11:26:30, backoff expirant a
#     11:27:57, debounce coupe a ~90 s.
#     Un episode est ouvert tant que le backoff tourne OU que le compteur
#     de tentatives est non nul. Cf. resilience_integrations.md R-RECOV-1.
#
#     audi / withings : chaines ORPHELINES (aucun compteur, aucune
#     automation). Laissees sur la definition historique — un terme sur
#     une entite inexistante n'apporterait rien.
#
#  ✅ PRINCIPE
#     - Les automations ne doivent plus declencher sur numeric_state + for
#       mais sur transition d'etat (off -> on) de ces binary_sensors.
#
#  🧱 NOTE
#     - Fichier monolithique requis si usage d'ancres YAML.
# ==========================================================

- binary_sensor:

    # -------------------------
    # Constantes (ancres)
    # -------------------------
    - name: "_internal_dummy_anchor_holder"
      unique_id: age_donnees_internal_dummy_anchor_holder
      state: >
        {{ false }}
      attributes:
        _age_ok_delay: &age_ok_delay "00:02:00"
        _age_gel_delay_5: &age_gel_delay_5 "00:05:00"
        _age_gel_delay_10: &age_gel_delay_10 "00:10:00"
        # Axe 3 (échec de configuration) — R-AXE3-2 : le débounce doit
        # laisser le réessai natif de Home Assistant converger. Valeur
        # volontairement > au délai de gel de référence (5 min).
        _echec_entree_delay: &echec_entree_delay "00:15:00"

    # ==========================================================
    # AUDI
    # ==========================================================

    - name: "Recovery en cours — Audi"
      unique_id: recovery_en_cours_audi
      default_entity_id: binary_sensor.recovery_en_cours_audi
      state: >
        {{ is_state('timer.audi_reload_backoff', 'active') }}

    - name: "Gel avéré — Audi"
      unique_id: gel_avere_audi
      default_entity_id: binary_sensor.gel_avere_audi
      delay_on: *age_gel_delay_10
      state: >
        {{ (states('sensor.audi_age_donnees') | int(999)) >= 120 }}

    - name: "Retour OK — Audi"
      unique_id: retour_ok_audi
      default_entity_id: binary_sensor.retour_ok_audi
      delay_on: *age_ok_delay
      state: >
        {{
          is_state('binary_sensor.recovery_en_cours_audi', 'on')
          and (states('sensor.audi_age_donnees') | int(999)) < 10
        }}

    # ==========================================================
    # OVERKIZ (PETITE MAISON — CUMULUS)
    # ==========================================================

    - name: "Recovery en cours — Overkiz"
      unique_id: recovery_en_cours_overkiz
      default_entity_id: binary_sensor.recovery_en_cours_overkiz
      state: >
        {{ is_state('timer.overkiz_reload_backoff', 'active')
           or (states('input_number.overkiz_reload_tentatives') | int(0)) > 0 }}

    - name: "Gel avéré — Overkiz"
      unique_id: gel_avere_overkiz
      default_entity_id: binary_sensor.gel_avere_overkiz
      delay_on: *age_gel_delay_5
      state: >
        {{ (states('sensor.petite_maison_cumulus_age_donnees') | int(999)) >= 90 }}

    - name: "Retour OK — Overkiz"
      unique_id: retour_ok_overkiz
      default_entity_id: binary_sensor.retour_ok_overkiz
      delay_on: *age_ok_delay
      state: >
        {{
          is_state('binary_sensor.recovery_en_cours_overkiz', 'on')
          and (states('sensor.petite_maison_cumulus_age_donnees') | int(999)) < 10
        }}

    - name: "Indisponibilité franche — Overkiz"
      unique_id: indisponibilite_franche_overkiz
      default_entity_id: binary_sensor.indisponibilite_franche_overkiz
      delay_on: *age_gel_delay_5
      state: >
        {{ expand('group.petite_maison_cumulus')
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count == 0 }}

