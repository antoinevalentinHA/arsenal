           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count == 0 }}

    # ==========================================================
    # HOMEKIT
    # ==========================================================

    # Axe fraicheur APPLICABLE aux deux stations : constate le
    # 2026-08-24, age reel de 3,8 et 3,9 min hors facades, en
    # variation continue (R-AXE1-1). Seuil de gel 45 min conserve.
    - name: "Recovery en cours — HomeKit Station Enfants"
      unique_id: recovery_en_cours_homekit_station_enfants
      default_entity_id: binary_sensor.recovery_en_cours_homekit_station_enfants
      state: >
        {{ is_state('timer.homekit_station_enfants_reload_backoff', 'active')
           or (states('input_number.homekit_station_enfants_reload_tentatives') | int(0)) > 0 }}

    - name: "Gel avéré — HomeKit Station Enfants"
      unique_id: gel_avere_homekit_station_enfants
      default_entity_id: binary_sensor.gel_avere_homekit_station_enfants
      delay_on: *age_gel_delay_5
      state: >
        {{ (states('sensor.homekit_station_enfants_age_donnees') | int(999)) >= 45 }}

    - name: "Retour OK — HomeKit Station Enfants"
      unique_id: retour_ok_homekit_station_enfants
      default_entity_id: binary_sensor.retour_ok_homekit_station_enfants
      delay_on: *age_ok_delay
      state: >
        {{
          is_state('binary_sensor.recovery_en_cours_homekit_station_enfants', 'on')
          and (states('sensor.homekit_station_enfants_age_donnees') | int(999)) < 10
        }}

    - name: "Indisponibilité franche — HomeKit Station Enfants"
      unique_id: indisponibilite_franche_homekit_station_enfants
      default_entity_id: binary_sensor.indisponibilite_franche_homekit_station_enfants
      delay_on: *age_gel_delay_5
      state: >
        {{ expand('group.homekit_station_enfants')
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count == 0 }}

    - name: "Recovery en cours — HomeKit Station Salle de Jeux"
      unique_id: recovery_en_cours_homekit_station_salle_de_jeux
      default_entity_id: binary_sensor.recovery_en_cours_homekit_station_salle_de_jeux
      state: >
        {{ is_state('timer.homekit_station_salle_de_jeux_reload_backoff', 'active')
           or (states('input_number.homekit_station_salle_de_jeux_reload_tentatives') | int(0)) > 0 }}

    - name: "Gel avéré — HomeKit Station Salle de Jeux"
      unique_id: gel_avere_homekit_station_salle_de_jeux
      default_entity_id: binary_sensor.gel_avere_homekit_station_salle_de_jeux
      delay_on: *age_gel_delay_5
      state: >
        {{ (states('sensor.homekit_station_salle_de_jeux_age_donnees') | int(999)) >= 45 }}

    - name: "Retour OK — HomeKit Station Salle de Jeux"
      unique_id: retour_ok_homekit_station_salle_de_jeux
      default_entity_id: binary_sensor.retour_ok_homekit_station_salle_de_jeux
      delay_on: *age_ok_delay
      state: >
        {{
          is_state('binary_sensor.recovery_en_cours_homekit_station_salle_de_jeux', 'on')
          and (states('sensor.homekit_station_salle_de_jeux_age_donnees') | int(999)) < 10
        }}

    - name: "Indisponibilité franche — HomeKit Station Salle de Jeux"
      unique_id: indisponibilite_franche_homekit_station_salle_de_jeux
      default_entity_id: binary_sensor.indisponibilite_franche_homekit_station_salle_de_jeux
      delay_on: *age_gel_delay_5
      state: >
        {{ expand('group.homekit_station_salle_de_jeux')
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count == 0 }}

    # ==========================================================
    # HOMEKIT — ENTRÉE « PRISE CONTROL » (pont volets)
    # ----------------------------------------------------------
    # Chaîne ancrée sur UNE entrée de configuration
    # (contrat resilience_integrations.md v2.0 §12.3, R-ANCRAGE-1).
    # Les trois axes sont câblés : fraîcheur, disponibilité et
    # échec de configuration.
    # ==========================================================

    - name: "Recovery en cours — HomeKit Prise Control"
      unique_id: recovery_en_cours_homekit_prise_control
      default_entity_id: binary_sensor.recovery_en_cours_homekit_prise_control
      state: >
        {{ is_state('timer.homekit_prise_control_reload_backoff', 'active')
           or (states('input_number.homekit_prise_control_reload_tentatives') | int(0)) > 0 }}

    # ⚠️ PAS DE BINAIRE DE GEL POUR CETTE ENTRÉE — axe fraîcheur INAPPLICABLE.
    # Les `cover.*` de ce pont sont en PUSH : ils ne rapportent qu'au changement
    # d'état, sans écriture périodique du coordinateur. `last_reported` reste
    # donc figé tant qu'aucun volet ne bouge, et l'âge croît linéairement —
    # un seuil de gel produirait un faux incident toutes les ~50 minutes.
    # Mesuré le 2026-08-24 : 4 volets sains, last_reported identique et figé
    # depuis 22 minutes. Cf. resilience_integrations.md invariant 1 (la
    # fraîcheur suppose une écriture périodique) et pont_idiamant.md §8.3.
    # Cette entrée est couverte par les axes disponibilité + échec de config.

    - name: "Indisponibilité franche — HomeKit Prise Control"
      unique_id: indisponibilite_franche_homekit_prise_control
      default_entity_id: binary_sensor.indisponibilite_franche_homekit_prise_control
      delay_on: *age_gel_delay_5
      state: >
        {{ expand('group.homekit_prise_control')
           | rejectattr('state', 'in', ['unknown', 'unavailable'])
           | list | count == 0 }}

    # Axe 3 — R-AXE3-1/2/3. Sélection POSITIVE des états d'échec :
    # tout autre état (dont `desactivee`, `introuvable`,
    # `indetermine`, `setup_in_progress`, `failed_unload`) ne
    # constitue PAS un incident. `desactivee` est exclu par
    # construction en amont (R-AXE3-3 : une entrée désactivée par
    # décision n'est pas en panne).
    - name: "Échec de configuration — HomeKit Prise Control"
      unique_id: echec_configuration_homekit_prise_control
      default_entity_id: binary_sensor.echec_configuration_homekit_prise_control
      delay_on: *echec_entree_delay
      state: >
        {{ states('sensor.etat_entree_homekit_prise_control')
           in ['setup_retry', 'setup_error', 'migration_error', 'not_loaded'] }}

    # Retour OK : les TROIS axes doivent être revenus au vert.
    # Un retour de fraîcheur seul ne vaut pas reprise si l'entrée
    # n'est pas rechargée (invariant 3, non-substitution).
    - name: "Retour OK — HomeKit Prise Control"
      unique_id: retour_ok_homekit_prise_control
      default_entity_id: binary_sensor.retour_ok_homekit_prise_control
      delay_on: *age_ok_delay
      # ⚠️ AUCUN terme d'âge ici — l'axe fraîcheur est inapplicable à cette
      # entrée (R-PONT-10 / R-AXE1-1). L'y laisser rouvrirait R-PONT-8 par une
      # autre porte : l'âge d'un volet immobile repasse au-dessus de 10 min en
      # quelques minutes, donc la fenêtre de constat du retour se refermerait
      # d'elle-même et le compteur resterait figé. Le retour se constate sur
      # les DEUX axes câblés, et sur eux seuls.
      state: >
        {{
          is_state('binary_sensor.recovery_en_cours_homekit_prise_control', 'on')
          and is_state('binary_sensor.indisponibilite_franche_homekit_prise_control', 'off')
          and is_state('binary_sensor.echec_configuration_homekit_prise_control', 'off')
        }}

    # ==========================================================
    # NETATMO
    # ==========================================================

