# ==========================================================
# 🧠 ARSENAL — TEMPLATE BINARY_SENSOR
#     Arrosage — Suspension pluie (PROJECTION DÉRIVÉE du verdict C41)
# ----------------------------------------------------------
# 🎯 RÔLE
#   PROJECTION BOOLÉENNE dérivée du verdict d'arbitrage pluie
#   (sensor.arrosage_pluie_arbitrage, contrat 20 §10). Cette entité N'EST PLUS
#   l'autorité sémantique : elle ne fait que refléter, pour compatibilité avec
#   la décision V1 (contrat 17, INCHANGÉ), si le sous-domaine pluie demande de
#   DIFFÉRER l'arrosage.
#
#   État = `on` (serrée = différer) UNIQUEMENT si le verdict ∈
#     { attente_infiltration, report_pluie_credible }.
#   État = `off` (relâchée) pour TOUS les autres verdicts, y compris
#     `pluie_indecidable`, ET par défaut si le verdict est indisponible
#     (doute ⇒ OFF, doctrine F1 : ne jamais priver le jardin ; frein additif
#     06 §7.3 : un `off` relâche un frein, n'actionne aucun accélérateur).
#
# 🧩 PÉRIMÈTRE
#   - Projection en lecture seule ; AUCUNE logique métier, AUCUN seuil ici.
#   - N'agit pas, ne pilote rien, aucun appel Rain Bird.
#   - Identité conservée (unique_id / entity_id) ⇒ consommée telle quelle par
#     binary_sensor.arrosage_intention (contrat 17).
#
# 🆔 UNIQUE_ID : arrosage_suspension_pluie  (INCHANGÉ)
#
# 🔗 DÉPENDANCE : sensor.arrosage_pluie_arbitrage (verdict + attributs).
#
# 🏷️ STATUT : Projection dérivée — arbitrage pluie (C41).
# ==========================================================

- binary_sensor:
    - name: "Arrosage suspension pluie"
      unique_id: arrosage_suspension_pluie
      default_entity_id: binary_sensor.arrosage_suspension_pluie
      icon: >
        {% set v = states('sensor.arrosage_pluie_arbitrage') %}
        {{ 'mdi:umbrella' if v in ['attente_infiltration', 'report_pluie_credible'] else 'mdi:watering-can' }}
      state: >
        {% set v = states('sensor.arrosage_pluie_arbitrage') %}
        {{ v in ['attente_infiltration', 'report_pluie_credible'] }}
      attributes:
        # Diagnostic passthrough (lecture seule) — le SENS vit dans le verdict.
        verdict: "{{ states('sensor.arrosage_pluie_arbitrage') }}"
        motif: "{{ state_attr('sensor.arrosage_pluie_arbitrage', 'motif') }}"
        # fiabilité honnête : confirmé si le frein vient d'une pluie OBSERVÉE
        # (attente d'infiltration), présumé s'il vient d'une PRÉVISION (report).
        fiabilite: >
          {% set v = states('sensor.arrosage_pluie_arbitrage') %}
          {% if v == 'attente_infiltration' %}confirme
          {% elif v == 'report_pluie_credible' %}presume
          {% else %}aucun{% endif %}
