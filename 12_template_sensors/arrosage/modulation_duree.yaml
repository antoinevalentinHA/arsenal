# ==========================================================
# 🧠 ARSENAL — TEMPLATE SENSORS
#     Arrosage — Modulation de durée : décision backend (C11 P4, L1)
# ----------------------------------------------------------
# 🎯 RÔLE
#   Produire la DÉCISION de durée applicable modulée (contrat
#   19_modulation_duree.md), à partir de la durée nominale opérateur et
#   des recommandations des canaux sol (primaire) et climat (secondaire).
#   Couche RECOMMANDATION + DÉCISION (PAS observation). Décision consommée
#   par le Run (snapshot unique au démarrage).
#
# 🧱 ARCHITECTURE (3 entités sémantiques — AUCUN JSON transporté en état)
#   - sensor.arrosage_modulation_reco_sol    : état = STATUT sol
#       (reduction/neutre/abstention) ; attributs facteur, motif.
#   - sensor.arrosage_modulation_reco_climat : état = STATUT climat
#       (demande_forte/neutre/abstention) ; attributs facteur, motif.
#   - sensor.arrosage_modulation_duree_applicable : état = DURÉE (min) ;
#       attributs = trace de composition + facteurs théorique/appliqué + motif.
#   Chaque état porte une valeur sémantique courte. La décision CONSOMME les
#   deux recos (répétition limitée et contrôlée, pas de bus JSON interne).
#   Une abstention/erreur d'un canal ⇒ facteur lu = 1,0 (neutre), la décision
#   RESTE disponible tant que la durée nominale est numérique.
#
# 🧱 MODÈLE M4 (contrat 19 §5) — précédence d'abstention puis composition
#   ordonnée MULTIPLICATIVE : nominale × facteur_sol × facteur_climat
#   → arrondi (demi → entier pair) → clamp [1,60].
#
# 🔢 CALIBRATION (mise en service minimale, recalibrable — contrat §6)
#   Réduction sol = 0,95 (perturbation initiale minimale réversible), gate sol :
#   état sol `complet` ET médiane disponible ET médiane ≥ seuil déclenchement.
#   Allongement sol = 1,0 (non calibré, différé preuve runtime).
#   ALLONGEMENT climatique RÉEL (contrat 19 §5.5) : forte demande qualifiée
#   (climat 'complet' ET (ET₀ >= 6,0 OU VPD >= 2,3)) ⇒ facteur climat = 1,05.
#   Composition base × sol × climat, PLANCHER nominal sous forte demande :
#   durée_avant_arrondi = max(base, base × sol × 1,05) — réduction + climat fort
#   ne descend jamais sous la base. Climat NON qualifié ⇒ durée = base
#   (protection, aucune réduction). Seuils ET₀/VPD et facteur 1,05 = calibration
#   initiale réversible (≈ quartile supérieur observé), recalibrables en runtime.
#
# 🎛️ CONTRÔLE (input_boolean.arrosage_modulation_duree_actif)
#   - `on`        : modulation autorisée (facteur appliqué = théorique).
#   - `off`       : désactivation OPÉRATEUR ⇒ durée = base, appliqué = 1,0,
#                   motif `modulation_desactivee`.
#   - unknown/unavailable : contrôle NON QUALIFIÉ ⇒ durée = base, appliqué
#                   = 1,0, motif `controle_modulation_indisponible` (JAMAIS
#                   présenté comme une désactivation volontaire).
#
# 🔗 ENTRÉES (entités réelles existantes — lecture LIVE)
#   Base   : input_number.arrosage_rainbird_station_1_duree_minutes ([1,60])
#   Seuil  : input_number.arrosage_seuil_humidite_declenchement
#   Sol    : sensor.jardin_reservoir_sol_etat · sensor.jardin_humidite_sol_mediane
#   Climat : sensor.arrosage_demande_climatique_etat
#   Actif  : input_boolean.arrosage_modulation_duree_actif
#
# 🚫 NE FAIT PAS
#   - N'écrit AUCUN helper ; ne pilote rien ; ne touche pas la décision « quand ».
#   - Le Run ne la consomme pas encore (L2).
#
# 🏷️ STATUT
#   Décision backend — modulation de durée (C11 P4, L1)
# ==========================================================

- sensor:

    # ===== Recommandation CANAL SOL (primaire) — état = statut =====
    - name: "Arrosage modulation reco sol"
      unique_id: arrosage_modulation_reco_sol
      default_entity_id: sensor.arrosage_modulation_reco_sol
      icon: mdi:water-percent
      state: >
        {% set etat = states('sensor.jardin_reservoir_sol_etat') %}
        {% set mediane = states('sensor.jardin_humidite_sol_mediane') | float(none) %}
        {% set seuil = states('input_number.arrosage_seuil_humidite_declenchement') | float(none) %}
        {% if etat == 'complet' and mediane is not none %}
        {{ 'reduction' if (seuil is not none and mediane >= seuil) else 'neutre' }}
        {% elif etat == 'degrade' %}neutre
        {% else %}abstention{% endif %}
      attributes:
        facteur: >
          {% set etat = states('sensor.jardin_reservoir_sol_etat') %}
          {% set mediane = states('sensor.jardin_humidite_sol_mediane') | float(none) %}
          {% set seuil = states('input_number.arrosage_seuil_humidite_declenchement') | float(none) %}
          {% if etat == 'complet' and mediane is not none and seuil is not none and mediane >= seuil %}0.95{% else %}1.0{% endif %}
        motif: >
          {% set etat = states('sensor.jardin_reservoir_sol_etat') %}
          {% set mediane = states('sensor.jardin_humidite_sol_mediane') | float(none) %}
          {% set seuil = states('input_number.arrosage_seuil_humidite_declenchement') | float(none) %}
          {% if etat == 'complet' and mediane is not none %}
          {{ 'sol_complet_mediane_ge_seuil' if (seuil is not none and mediane >= seuil) else 'sol_complet_mediane_sous_seuil_allongement_differe' }}
          {% elif etat == 'degrade' %}sol_degrade_confiance_insuffisante_pour_reduire
          {% else %}sol_non_qualifie{% endif %}

    # ===== Recommandation CANAL CLIMAT (secondaire) — état = statut =====
    # Allongement non calibré ⇒ facteur neutre 1,0 (le climat ne réduit jamais).
    # Porte en outre la QUALIFICATION DE DEMANDE (contrat 19 §5.4/§5.5) :
    #   demande_forte : climat 'complet' ET (ET₀ >= seuil OU VPD >= seuil) ;
    #   neutre        : climat 'complet' ET demande faible/normale ;
    #   abstention    : climat non pleinement qualifié (degrade/indispo/indéterminé).
    # SEUILS = calibration INITIALE de protection (≈ quartile supérieur des
    # distributions observées ~1 mois), recalibrables après validation runtime
    # (contrat 19 §6). Constantes explicites ci-dessous, PAS de helper.
    - name: "Arrosage modulation reco climat"
      unique_id: arrosage_modulation_reco_climat
      default_entity_id: sensor.arrosage_modulation_reco_climat
      icon: mdi:sun-thermometer-outline
      state: >
        {% set etat = states('sensor.arrosage_demande_climatique_etat') %}
        {% set et0 = states('sensor.arrosage_demande_climatique_et0') | float(none) %}
        {% set vpd = states('sensor.arrosage_demande_climatique_vpd') | float(none) %}
        {% set ET0_FORTE = 6.0 %}
        {% set VPD_FORTE = 2.3 %}
        {% if etat == 'complet' and et0 is not none and vpd is not none %}
        {{ 'demande_forte' if (et0 >= ET0_FORTE or vpd >= VPD_FORTE) else 'neutre' }}
        {% else %}abstention{% endif %}
      attributes:
        # Facteur climat : 1,05 (allongement RÉEL) sous forte demande qualifiée,
        # sinon 1,0. Le climat n'abaisse jamais la durée (facteur >= 1).
        facteur: >
          {% set etat = states('sensor.arrosage_demande_climatique_etat') %}
          {% set et0 = states('sensor.arrosage_demande_climatique_et0') | float(none) %}
          {% set vpd = states('sensor.arrosage_demande_climatique_vpd') | float(none) %}
          {% set ET0_FORTE = 6.0 %}
          {% set VPD_FORTE = 2.3 %}
          {% if etat == 'complet' and et0 is not none and vpd is not none and (et0 >= ET0_FORTE or vpd >= VPD_FORTE) %}1.05{% else %}1.0{% endif %}
        motif: >
          {% set etat = states('sensor.arrosage_demande_climatique_etat') %}
          {% set et0 = states('sensor.arrosage_demande_climatique_et0') | float(none) %}
          {% set vpd = states('sensor.arrosage_demande_climatique_vpd') | float(none) %}
          {% set ET0_FORTE = 6.0 %}
          {% set VPD_FORTE = 2.3 %}
          {% if etat == 'complet' and et0 is not none and vpd is not none %}
          {% set e = et0 >= ET0_FORTE %}
          {% set v = vpd >= VPD_FORTE %}
          {% if e and v %}demande_forte_et0_vpd
          {% elif e %}demande_forte_et0
          {% elif v %}demande_forte_vpd
          {% else %}demande_faible_ou_normale{% endif %}
          {% elif etat == 'degrade' %}climat_degrade
          {% elif etat == 'indisponible' %}climat_indisponible
          {% else %}climat_etat_indetermine{% endif %}

    # ===== DÉCISION : durée applicable (min) =====
    - name: "Arrosage modulation durée applicable"
      unique_id: arrosage_modulation_duree_applicable
      default_entity_id: sensor.arrosage_modulation_duree_applicable
      unit_of_measurement: "min"
      icon: mdi:timer-cog-outline
      # Disponible dès que la durée NOMINALE est numérique ; l'abstention d'un
      # canal ne rend JAMAIS la décision indisponible.
      availability: >
        {{ is_number(states('input_number.arrosage_rainbird_station_1_duree_minutes')) }}
      state: >
        {% set base = states('input_number.arrosage_rainbird_station_1_duree_minutes') | float(1) %}
        {% set applied = is_state('input_boolean.arrosage_modulation_duree_actif', 'on') %}
        {% set cli_s = states('sensor.arrosage_modulation_reco_climat') %}
        {% set sol_f = state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) %}
        {% set cli_f = state_attr('sensor.arrosage_modulation_reco_climat', 'facteur') | float(1.0) %}
        {# Composition + plancher nominal (contrat 19 §5.5) :
           - forte demande (cli_f=1.05) : max(1, sol_f*1.05) → jamais sous la base ;
           - demande faible/normale (cli_f=1.0) : sol_f (la réduction s'applique) ;
           - climat non qualifié (abstention) : 1.0 (protection nominale). #}
        {% set fa = 1.0 if not applied
             else ([1.0, (sol_f * cli_f)] | max if cli_s == 'demande_forte'
                   else (sol_f if cli_s == 'neutre' else 1.0)) %}
        {% set dva = base * fa %}
        {% set fl = dva | int %}
        {% set frac = dva - fl %}
        {% set r = fl if frac < 0.5 else (fl + 1 if frac > 0.5 else (fl if (fl % 2) == 0 else fl + 1)) %}
        {{ [[r, 1] | max, 60] | min }}
      attributes:
        duree_nominale: "{{ states('input_number.arrosage_rainbird_station_1_duree_minutes') | float(1) }}"
        modulation_controle: >
          {% set m = states('input_boolean.arrosage_modulation_duree_actif') %}
          {{ 'on' if m == 'on' else ('off' if m == 'off' else 'indisponible') }}
        sol_statut: "{{ states('sensor.arrosage_modulation_reco_sol') }}"
        sol_facteur: "{{ state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) }}"
        sol_motif: "{{ state_attr('sensor.arrosage_modulation_reco_sol', 'motif') }}"
        climat_statut: "{{ states('sensor.arrosage_modulation_reco_climat') }}"
        climat_facteur: "{{ state_attr('sensor.arrosage_modulation_reco_climat', 'facteur') | float(1.0) }}"
        climat_motif: "{{ state_attr('sensor.arrosage_modulation_reco_climat', 'motif') }}"
        duree_apres_sol: >
          {% set base = states('input_number.arrosage_rainbird_station_1_duree_minutes') | float(1) %}
          {% set applied = is_state('input_boolean.arrosage_modulation_duree_actif', 'on') %}
          {% set sol_f = state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) %}
          {{ (base * (sol_f if applied else 1.0)) | round(4) }}
        duree_avant_arrondi: >
          {% set base = states('input_number.arrosage_rainbird_station_1_duree_minutes') | float(1) %}
          {% set applied = is_state('input_boolean.arrosage_modulation_duree_actif', 'on') %}
          {% set cli_s = states('sensor.arrosage_modulation_reco_climat') %}
          {% set sol_f = state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) %}
          {% set cli_f = state_attr('sensor.arrosage_modulation_reco_climat', 'facteur') | float(1.0) %}
          {% set fa = 1.0 if not applied
               else ([1.0, (sol_f * cli_f)] | max if cli_s == 'demande_forte'
                     else (sol_f if cli_s == 'neutre' else 1.0)) %}
          {{ (base * fa) | round(4) }}
        facteur_theorique: >
          {% set sol_f = state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) %}
          {% set cli_f = state_attr('sensor.arrosage_modulation_reco_climat', 'facteur') | float(1.0) %}
          {{ (sol_f * cli_f) | round(4) }}
        facteur_applique: >
          {% set applied = is_state('input_boolean.arrosage_modulation_duree_actif', 'on') %}
          {% set cli_s = states('sensor.arrosage_modulation_reco_climat') %}
          {% set sol_f = state_attr('sensor.arrosage_modulation_reco_sol', 'facteur') | float(1.0) %}
          {% set cli_f = state_attr('sensor.arrosage_modulation_reco_climat', 'facteur') | float(1.0) %}
          {% set fa = 1.0 if not applied
               else ([1.0, (sol_f * cli_f)] | max if cli_s == 'demande_forte'
                     else (sol_f if cli_s == 'neutre' else 1.0)) %}
          {{ fa | round(4) }}
        motif_global: >
          {% set m = states('input_boolean.arrosage_modulation_duree_actif') %}
          {% if m == 'off' %}modulation_desactivee
          {% elif m != 'on' %}controle_modulation_indisponible
          {% else %}
          {% set ss = states('sensor.arrosage_modulation_reco_sol') %}
          {% set cs = states('sensor.arrosage_modulation_reco_climat') %}
          {% if cs == 'demande_forte' %}
          {% if ss == 'reduction' %}compensation_sol_climat{% else %}allongement_climatique{% endif %}
          {% elif cs == 'abstention' %}
          {% if ss == 'reduction' %}climat_non_qualifie_plancher_nominal
          {% elif ss == 'abstention' %}abstention_double
          {% else %}abstention_climat{% endif %}
          {% else %}
          {% if ss == 'reduction' %}reduction_sol
          {% elif ss == 'abstention' %}abstention_sol
          {% else %}neutre{% endif %}
          {% endif %}
          {% endif %}
        note: "Décision de durée modulée (contrat 19 §5.5). Forte demande climatique ⇒ allongement réel ×1,05 avec plancher nominal (réduction+climat ne descend jamais sous la base) ; climat non qualifié ⇒ durée nominale. Consommée par le Run (snapshot)."
