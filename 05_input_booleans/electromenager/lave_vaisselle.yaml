# ==========================================================
#  INPUT_BOOLEAN : Lave-vaisselle – Cycle en cours
# ----------------------------------------------------------
#  🧠 Rôle :
#     État logique indiquant si un cycle de
#     lave-vaisselle est considéré comme
#     en cours par le système.
#
#     Ce booléen constitue la source de vérité
#     métier sur l’état du cycle.
#
#  🧱 Nature :
#     - État logique métier
#     - Vérité fonctionnelle persistante
#
#  🔄 Cycle de vie :
#     - ON  : un cycle est considéré comme actif
#     - OFF : aucun cycle n’est en cours
#
#  📥 N’effectue PAS :
#     - aucune détection électrique directe
#     - aucune mesure de consommation
#     - aucune commande de la prise
#
#  📤 Utilisation :
#     - Écrit par :
#         • automatisations de début de cycle
#         • automatisations de fin de cycle
#     - Lu par :
#         • décision binary_sensor.lave_vaisselle_fin_cycle_etablie
#         • automatisation de début (garde « cycle inactif »)
#         • projection de la notification persistante
#           (10080000000006)
#     - Son last_changed n'est PAS une durée de cycle : il est
#       remis à l'heure du démarrage à chaque redémarrage HA.
#       La durée se lit sur input_datetime.lave_vaisselle_debut_cycle
#       (C57).
#
#  🧠 Principe Arsenal :
#     - Un cycle applicatif est représenté
#       par un état logique explicite
# ==========================================================

lave_vaisselle_cycle:
  name: Lave-vaisselle - cycle en cours
  icon: mdi:dishwasher
