name: Arsenal Docs

on:
  push:
    branches: [main]        # post-merge : re-valide main. Les branches de PR
  pull_request:             # sont couvertes par pull_request, sans doubler
                            # l'execution (audit CI, P1 anti-double-run).

# Annule les runs obsoletes d'une branche ; ne coupe jamais main (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documentation lint (read-only, blocking)
        run: |
          python scripts/docs_lint/docs_lint.py \
            --exceptions scripts/docs_lint/docs_lint_exceptions.txt

      - name: Changelog index gate (DOC-CI-1, pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/docs_lint/docs_ci_changelog_index.py \
            --base "${{ github.event.pull_request.base.sha }}"

      - name: Orphan report gate (DOC-CI-3, stock)
        run: |
          python scripts/docs_lint/docs_ci_orphan_report.py

      - name: Contract index count gate (DOC-CI-2)
        run: |
          python scripts/docs_lint/docs_ci_contract_counts.py

      - name: Index naming gate (DOC-CI-5, stock)
        run: |
          python scripts/docs_lint/docs_ci_naming.py

      - name: Navigation leaf pages gate (DOC-CI-6, R-NAV-LEAF-1)
        run: |
          python scripts/docs_lint/docs_ci_navigation_leaf_pages.py
