name: Arsenal Docs

on:
  # P3 (audit CI) : docs_lint scanne le perimetre 00_documentation_arsenal (defaut) et les
  # gates DOC-CI-* portent sur ce meme arbre ; l'outillage vit sous scripts/docs_lint/. Une PR
  # sans changement docs n'a rien a linter ici. `main` non protege : run skippe = merge non
  # bloque (pas de sentinelle).
  push:
    branches: [main]        # post-merge : re-valide main (si un chemin change). Les PR
    paths: ["00_documentation_arsenal/**", "scripts/docs_lint/**", ".github/workflows/docs.yml"]
  pull_request:             # passent par pull_request, sans doubler (P1).
    paths: ["00_documentation_arsenal/**", "scripts/docs_lint/**", ".github/workflows/docs.yml"]

# Annule les runs obsoletes d'une branche ; ne coupe jamais main (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documentation lint (read-only, blocking)
        run: |
          python scripts/docs_lint/docs_lint.py \
            --exceptions scripts/docs_lint/docs_lint_exceptions.txt

      - name: Changelog index gate (DOC-CI-1, pull_request only)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/docs_lint/docs_ci_changelog_index.py \
            --base "${{ github.event.pull_request.base.sha }}"

      - name: Orphan report gate (DOC-CI-3, stock)
        run: |
          python scripts/docs_lint/docs_ci_orphan_report.py

      - name: Contract index count gate (DOC-CI-2)
        run: |
          python scripts/docs_lint/docs_ci_contract_counts.py

      - name: Index naming gate (DOC-CI-5, stock)
        run: |
          python scripts/docs_lint/docs_ci_naming.py

      - name: Navigation leaf pages gate (DOC-CI-6, R-NAV-LEAF-1)
        run: |
          python scripts/docs_lint/docs_ci_navigation_leaf_pages.py
