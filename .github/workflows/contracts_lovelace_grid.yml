name: Arsenal Contracts — Lovelace Grid

on:
  push:
    paths:
      - '18_lovelace/**'
      - 'scripts/arsenal_contracts/check_lovelace_grid_contracts.py'
      - '.github/workflows/contracts_lovelace_grid.yml'
      - '00_documentation_arsenal/ui/pattern_dashboard.md'
  pull_request:
    paths:
      - '18_lovelace/**'
      - 'scripts/arsenal_contracts/check_lovelace_grid_contracts.py'
      - '.github/workflows/contracts_lovelace_grid.yml'
      - '00_documentation_arsenal/ui/pattern_dashboard.md'

jobs:
  validate-lovelace-grid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Lovelace grid completeness contract (R-LL-GRID-1)
        run: |
          python3 scripts/arsenal_contracts/check_lovelace_grid_contracts.py
