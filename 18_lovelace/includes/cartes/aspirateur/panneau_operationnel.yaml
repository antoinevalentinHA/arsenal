# ==========================================================
# 🧠 ARSENAL — CARTE UI
#     Aspirateur — panneau opérationnel du domaine
#
# 🗂️ COUCHE : includes/cartes/aspirateur
# 🧱 TYPE UI : carte de domaine (état · composition · action)
# ==========================================================
#
# 🎯 RÔLE
#   Porter l'intégralité de l'interface opérationnelle du domaine :
#   lecture d'état, composition d'une intention, raccourcis, lancement
#   confirmé, conduite d'une mission ouverte et lecture de l'entretien.
#   Cadrage ratifié (D-44) : 09_UI.md §4 (contenu de la carte),
#   lots U0 et U2.
#
# 🧭 OÙ CETTE CARTE VIT, ET POURQUOI
#   Dans le PREMIER des deux écrans du domaine, `/aspirateur-dashboard`.
#   Le second, `/aspirateur-carte-dashboard`, porte la carte du robot et
#   rien d'autre ; les deux se rejoignent par le bandeau de navigation
#   `includes/navigation/aspirateur.yaml`, patron du domaine Voiture.
#   Le dashboard Navigation, lui, n'en porte que le RACCOURCI : une petite
#   tuile, ligne 4, colonne 4, colorée par `sensor.etat_aspirateur_dashboard`.
#
# 🧱 FRONTIÈRE BACKEND / UI (contrat 11)
#   Le backend décide, l'UI rend et sollicite. Concrètement :
#     - AUCUNE commande brute vers l'appareil. Les seuls objets
#       appelés sont des scripts du domaine (ASP-INV-31).
#     - AUCUNE entité native d'action Roborock n'est exposée.
#     - AUCUNE revalidation : le moteur revalide intégralement, et
#       l'intégrité mono-carte s'applique sans réserve (ASP-IMC-1).
#       Le filtrage des pièces par carte n'est pas une validation :
#       c'est le sens physique — on ne présente pas une case qui n'a
#       pas cours.
#     - AUCUN motif reformulé : le motif lisible est restitué tel
#       qu'il est produit, et NON TRONQUÉ (ASP-INV-50).
#     - AUCUN libellé issu de l'appareil, AUCUN index de segment nu.
#     - Le verdict de mission n'est ni lu ni cité ici : `ASP-CI-11`
#       en réserve la mention aux fichiers nommés du domaine.
#
# 🎨 COULEUR — CE QUE CHAQUE TEINTE DIT, ET ELLE SEULE
#   🔵 bleu   : le choix ACTIF d'un sélecteur de composition
#   🟢 vert   : une pièce EFFECTIVEMENT sélectionnée
#   🟠 orange : les deux gestes qui interrompent une mission en cours —
#               Pause et Arrêt —, et seulement quand ils sont offerts
#   🔴 rouge  : une anomalie — erreur du robot, entretien dû
#   ⚪ gris   : tout le reste, LANCEMENT COMPRIS. Une action attendue
#               n'est pas une alerte : le lancement se signale par sa
#               largeur, sa hauteur et sa confirmation, pas par une
#               couleur de vigilance.
#               LES OBSERVATIONS DE CHARGE AUSSI, et pour la même
#               raison inversée : elles ne jugent rien. Un niveau de
#               batterie peint en rouge serait un SEUIL, qu'ASP-INV-41
#               refuse explicitement au motif que l'opérateur décide
#               (chantier C50, décision D-3).
#   Palette bornée aux valeurs de `ui/couleurs/02_palette.md`.
#   La coloration de la tuile Navigation vient exclusivement de
#   `sensor.etat_aspirateur_dashboard` : cette carte n'en produit aucune.
#
# 🧩 HIÉRARCHIE — QUATRE SECTIONS, QUATRE SOUS-SECTIONS
#   Sections (`section_header`)      : Composition · Lancement ·
#                                      Conduite · Entretien
#   Sous-sections (`sub_section_header`) : Pièces · Profil de nettoyage ·
#                                      Passages · Raccourcis, toutes
#                                      quatre DANS la composition
#   Profil et Passages écrivent DEUX sélecteurs distincts : ils ont donc
#   deux en-têtes, et non un titre commun qui les ferait lire comme un
#   seul réglage.
#   Le bloc d'état ouvre la page sans en-tête : il n'est pas une section,
#   c'est la lecture d'entrée. Aucun en-tête ne répète le titre du
#   dashboard, que la barre porte déjà.
#
# 🙈 CE QUI DISPARAÎT PLUTÔT QUE DE S'AFFICHER VIDE
#   - Pièces, EN-TÊTE COMPRIS, quand aucune carte lisible n'est désignée :
#     un titre sans case dessous n'apprend rien.
#   - Conduite, EN-TÊTE COMPRIS, quand aucun geste n'a de sens physique.
#   Le backend REVALIDE chaque geste : masquer ici est une commodité de
#   lecture, jamais une autorisation.
#
# 🧩 PATRONS RÉUTILISÉS — AUCUNE FORME NATIVE MASSIVE
#   `section_header` · `sub_section_header` · `carte_etat_interprete` ·
#   `carte_attribut_categoriel_interprete` · `carte_mode_binaire_interprete` ·
#   `carte_aspirateur_batterie` (satellite de `socle_status`, comme ses
#   trois voisines de bloc : même hauteur, même typographie) ·
#   `socle_status_label_72` ·
#   `socle_toggle_compact_68` · `carte_action_standard` ·
#   `carte_action_standard_warning` ·
#   `carte_action_aspirateur_option` (segment de sélecteur, patron de
#   `carte_action_deshum_autorite` généralisé aux trois sélecteurs).
#   Aucune carte `entities` native, aucun interrupteur natif.
#
# 📱 MOBILE D'ABORD
#   Grilles à une, deux ou trois colonnes, hauteurs 52 à 72 px. Les
#   libellés ne sont jamais tronqués : un raccourci long occupe seul sa
#   ligne, deux raccourcis courts la partagent.
#
# 🔗 SCRIPTS APPELÉS — QUATRE, ET QUATRE SEULEMENT
#   script.aspirateur_appliquer_raccourci
#   script.aspirateur_composer_intention
#   script.aspirateur_reinitialiser_composition
#   script.aspirateur_conduire_mission     (mission déjà ouverte)
#
# 🏷️ STATUT
#   Interface — domaine aspirateur, lots U0 et U2, corrigée UX
# ==========================================================

type: vertical-stack
cards:

  # ==================================================
  # 1️⃣ ÉTAT — machine, mission Arsenal, session robot et charge
  # --------------------------------------------------
  # Les dix états canoniques et la « session robot active » sont rendus
  # SÉPARÉMENT : le dixième se superpose aux neuf autres au lieu de
  # les exclure (ASP-INV-68), et aucune agrégation de confort n'est
  # faite (ASP-INV-44). L'indisponibilité tombe au gris atténué,
  # jamais sur un état nominal (ASP-INV-45).
  #
  # DEUX LIGNES, DEUX ALTITUDES DE LECTURE. Ligne 1 : les deux lectures
  # de tête — ce que fait la machine, et ce dont Arsenal répond.
  # Ligne 2 : les deux observations qui les nuancent — une session peut
  # rester ouverte sans que le robot bouge, et la charge dit s'il peut
  # repartir. Quatre cellules pour deux colonnes : grille complète
  # (R-LL-GRID-1).
  #
  # LA QUATRIÈME TUILE N'EST PAS UN REMPLISSAGE, et c'est la différence
  # avec la version écartée de C50 : « Session robot » et « Mission »
  # sont DEUX NOTIONS distinctes, d'autorités exclusives et non
  # substituables, dont la divergence est LÉGITIME (Q1). Les rendre
  # séparément est une obligation contractuelle, pas un choix de mise
  # en page.
  #
  # Aucun en-tête : la barre du dashboard porte déjà « Aspirateur ».
  # ==================================================
  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:button-card
        template: carte_etat_interprete
        entity: sensor.aspirateur_etat_canonique
        name: État
        icon: mdi:robot-vacuum
        variables:
          libelles:
            repos_hors_base: Hors base
            charge: En charge
            nettoyage_reel: Nettoyage
            pause: En pause
            retour_base: Retour base
            amarrage: Amarrage
            erreur: Erreur
            indisponibilite: Indisponible
            etat_non_qualifie: Non qualifié
          couleurs:
            repos_hors_base: rgba(158, 158, 158, 0.2)
            charge: rgba(76, 175, 80, 0.2)
            nettoyage_reel: rgba(33, 150, 243, 0.2)
            pause: rgba(255, 152, 0, 0.2)
            retour_base: rgba(33, 150, 243, 0.2)
            amarrage: rgba(33, 150, 243, 0.2)
            erreur: rgba(244, 67, 54, 0.2)
            indisponibilite: rgba(158, 158, 158, 0.1)
            etat_non_qualifie: rgba(158, 158, 158, 0.2)

      # ── MISSION ARSENAL OUVERTE — sur la PROJECTION MÉTIER ───────
      # L'autorité est le VERDICT, jamais un témoin natif (ASP-INV-87).
      # L'interface ne le lit pas directement : elle CONSOMME la
      # projection, qui en dérive la seule classe O (ASP-INV-96,
      # contrat 11 §2). L'indisponibilité de la projection tombe au gris
      # atténué et rend « — » : elle ne vaut PAS « aucune mission »
      # (ASP-INV-45).
      - type: custom:button-card
        template: carte_mode_binaire_interprete
        entity: binary_sensor.aspirateur_mission_arsenal_ouverte
        name: Mission
        icon: mdi:play-circle-outline
        variables:
          label_on: Ouverte
          label_off: Aucune
          color_on: 'rgba(33, 150, 243, 0.2)'
          color_off: 'rgba(158, 158, 158, 0.2)'

      # ── SESSION ROBOT ACTIVE — l'autre notion, l'autre autorité ───
      # DEUX NOTIONS, DEUX RENDUS, DEUX LIBELLÉS. La mission ci-dessus
      # dit ce dont ARSENAL RÉPOND ; celle-ci dit ce que L'APPAREIL
      # FAIT, sur le seul témoin natif de session. Elles peuvent
      # LÉGITIMEMENT DIVERGER — mission externe, ou retour au dock — et
      # l'interface REND cette divergence au lieu de la résorber
      # (Q1 §6.1, contrat 11 §3 items 7 et 8).
      #
      # GRISE, ET C'EST UNE DÉCISION. Elle n'engage aucune
      # responsabilité Arsenal et ne conditionne plus aucun geste : elle
      # observe. Lui prêter le bleu de la Mission ferait lire deux fois
      # le même fait, ce que Q1 proscrit précisément.
      - type: custom:button-card
        template: carte_attribut_categoriel_interprete
        entity: sensor.aspirateur_etat_canonique
        name: Session robot
        icon: mdi:robot-outline
        variables:
          attribut: session_robot_active
          libelles:
            oui: Active
            non: Inactive
            indisponible: Indisponible
          couleurs:
            oui: rgba(158, 158, 158, 0.2)
            non: rgba(158, 158, 158, 0.2)
            indisponible: rgba(158, 158, 158, 0.1)

      # ── L'OBSERVATION DE CHARGE — seconde ligne, avec la session ─
      # Ligne 1 : les deux lectures de tête — ce que fait la machine,
      # ce dont Arsenal répond. Ligne 2 : les deux observations qui
      # les nuancent — une session peut rester ouverte sans que le
      # robot bouge, et la charge dit s'il peut repartir.
      #
      # AUCUN SEUIL, DONC AUCUNE COULEUR D'ALERTE. ASP-INV-41 ne
      # conditionne le lancement à aucun seuil de batterie PARCE QUE
      # l'opérateur décide : une teinte de vigilance sous un certain
      # niveau serait ce seuil, appliqué sans être écrit. Contrat 11
      # §3 item 9, et ASP-CI-46 le vérifie.
      #
      # LE NIVEAU SEUL. L'ALIMENTATION EST DÉJÀ LÀ. « En charge » est
      # l'un des dix états canoniques, rendu par la tuile de gauche :
      # une seconde tuile qui le redirait n'ajouterait pas une
      # information, elle diviserait la même en deux endroits.
      # Arbitrage opérateur du 2026-09-07 (chantier C50, D-2 révisée) ;
      # ASP-CI-46 refuse désormais cette duplication.
      - type: custom:button-card
        template: carte_aspirateur_batterie
        entity: sensor.roborock_q7_max_batterie
        name: Batterie

  # Motif lisible — restitué NON TRONQUÉ, tel que le backend le produit.
  # CHROME RÉDUIT : plus de hauteur minimale imposée, la carte prend la
  # hauteur de son texte et pas un pixel de plus ; libellé à 12 px, parce
  # qu'un motif long est une phrase à lire, pas un chiffre à repérer.
  - type: custom:button-card
    template: socle_status_label_72
    entity: sensor.aspirateur_motif_lisible
    name: Dernier motif
    icon: mdi:message-text-outline
    label: |
      [[[
        const s = entity ? entity.state : null;
        if (!s || s === 'unknown' || s === 'unavailable') return '—';
        return s;
      ]]]
    styles:
      card:
        - height: auto
        - background-color: rgba(158, 158, 158, 0.2)
      label:
        - font-size: 12px
        - white-space: normal
        - line-height: 1.3

  # ==================================================
  # 2️⃣ COMPOSITION — carte, pièces, profil, passages
  # --------------------------------------------------
  # Trois sélecteurs segmentés. Un tap écrit l'option ; le segment
  # actif est bleu et gras. Aucune confirmation : composer est
  # réversible et ne touche pas l'appareil.
  #
  # ORDRE : la carte d'abord, ses pièces IMMÉDIATEMENT après — le
  # choix de la carte n'a d'effet visible que sur elles —, puis le
  # profil et les passages, qui ne dépendent d'aucune carte.
  # ==================================================
  - type: custom:button-card
    template: section_header
    name: 🧭 Composition

  - type: grid
    square: false
    columns: 3
    cards:
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Rez-de-chaussée
        icon: mdi:home-floor-g
        variables:
          selecteur: input_select.aspirateur_intention_carte
          option: Rez-de-chaussée
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Étage
        icon: mdi:stairs-up
        variables:
          selecteur: input_select.aspirateur_intention_carte
          option: Étage
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Annexe
        icon: mdi:home-outline
        variables:
          selecteur: input_select.aspirateur_intention_carte
          option: Annexe

  # ==================================================
  # 🧹 PIÈCES — les SEULES de la carte désignée
  # --------------------------------------------------
  # Deux à huit boutons, jamais quatorze : on ne présente pas une
  # case qui n'a pas cours. Coché = vert, décoché = gris.
  #
  # L'EN-TÊTE VIT DANS LA CONDITION, et non au-dessus d'elle : carte
  # illisible — sélecteur `unknown`, `unavailable`, ou valeur hors des
  # trois — et la sous-section disparaît ENTIÈREMENT, titre compris.
  # Trois conditions mutuellement exclusives : l'en-tête ne peut donc
  # jamais s'afficher deux fois.
  # ==================================================
  - type: conditional
    conditions:
      - condition: state
        entity: input_select.aspirateur_intention_carte
        state: Rez-de-chaussée
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: sub_section_header
          name: 🧹 Pièces
        - type: grid
          square: false
          columns: 2
          cards:
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_0_16
              name: Séjour
              icon: mdi:sofa
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_0_18
              name: Entrée
              icon: mdi:door-open
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_0_20
              name: WC RDC
              icon: mdi:toilet
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_0_21
              name: Cage d'escaliers
              icon: mdi:stairs

  - type: conditional
    conditions:
      - condition: state
        entity: input_select.aspirateur_intention_carte
        state: Étage
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: sub_section_header
          name: 🧹 Pièces
        - type: grid
          square: false
          columns: 2
          cards:
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_16
              name: Palier
              icon: mdi:stairs-up
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_17
              name: Chambre Parents
              icon: mdi:bed-king-outline
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_18
              name: Chambre Enfants
              icon: mdi:bed-outline
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_19
              name: Salle de Jeux
              icon: mdi:teddy-bear
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_20
              name: Dressing
              icon: mdi:wardrobe-outline
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_21
              name: SDB Parents
              icon: mdi:shower
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_22
              name: WC Étage
              icon: mdi:toilet
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_1_23
              name: SDB Enfants
              icon: mdi:shower-head

  - type: conditional
    conditions:
      - condition: state
        entity: input_select.aspirateur_intention_carte
        state: Annexe
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: sub_section_header
          name: 🧹 Pièces
        - type: grid
          square: false
          columns: 2
          cards:
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_2_16
              name: Salle de bain
              icon: mdi:shower
            - type: custom:button-card
              template: socle_toggle_compact_68
              entity: input_boolean.aspirateur_segment_2_19
              name: Chambre
              icon: mdi:bed-outline

  # ==================================================
  # ⚙️ PROFIL DE NETTOYAGE — un choix parmi six
  # --------------------------------------------------
  # Sous-section SŒUR de Pièces : les pièces disent OÙ, le profil dit
  # COMMENT. Elle ne se masque JAMAIS — le profil ne dépend d'aucune
  # carte.
  #
  # ▸ UNE SEULE GRILLE, ET C'EST TOUT LE PROPOS. Les six profils du
  #   chapitre 03 sont six SEGMENTS D'UN MÊME SÉLECTEUR
  #   (`input_select.aspirateur_intention_profil`) : un seul peut être
  #   actif à la fois. Les répartir sur deux grilles — les quatre
  #   puissances d'un côté, les deux profils avec eau de l'autre — les
  #   faisait lire comme DEUX réglages indépendants. Un profil
  #   « Serpillière » actif laissait alors les quatre ventilateurs
  #   éteints, et donnait à voir une aspiration non choisie. Elle
  #   l'est pourtant : le chapitre 03 fixe `quiet` pour les deux
  #   profils avec eau, et c'est le profil qui la porte. Une liste
  #   unique montre ce que le contrat dit déjà.
  #
  # ▸ ORDRE DU CHAPITRE 03, À L'IDENTIQUE — de gauche à droite puis de
  #   haut en bas. Les deux profils avec eau ferment la liste, comme
  #   dans le tableau du contrat.
  #
  # ▸ DEUX COLONNES, LIBELLÉS VISIBLES. À quatre colonnes un libellé
  #   comme « Aspiration maximale » ne tenait pas : il fallait le
  #   masquer, et l'icône restait alors SEULE à porter le sens —
  #   button-card ne substitue aucun `aria-label` à un nom masqué. À
  #   deux colonnes une cellule offre ~152px utiles quand le plus long
  #   des six libellés en demande ~130 à 12px : tous tiennent sur une
  #   ligne. Ce n'est pas une prédiction : les deux profils avec eau
  #   étaient DÉJÀ rendus dans cette géométrie exacte et s'y
  #   affichaient en entier. Les quatre autres les rejoignent.
  #
  # ▸ ICÔNES — INCHANGÉES ET NON RENUMÉROTÉES. `fan-chevron-down` ·
  #   `fan-speed-1` · `-2` · `-3` pour la progression d'aspiration,
  #   `water-outline` · `water` pour l'eau. Le libellé redevient
  #   simplement lisible à côté.
  #
  # ▸ ÉTAT SÉLECTIONNÉ. Double, comme toujours : fond bleu ET graisse
  #   du nom (gabarit `carte_action_aspirateur_option`). Le nom
  #   redevenant visible, les DEUX signaux jouent de nouveau — la
  #   couleur ne porte plus seule l'information.
  # ==================================================
  - type: custom:button-card
    template: sub_section_header
    name: ⚙️ Profil de nettoyage

  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Aspiration minimale
        icon: mdi:fan-chevron-down
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Aspiration minimale
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Aspiration normale
        icon: mdi:fan-speed-1
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Aspiration normale
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Aspiration turbo
        icon: mdi:fan-speed-2
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Aspiration turbo
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Aspiration maximale
        icon: mdi:fan-speed-3
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Aspiration maximale
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Serpillière moyenne
        icon: mdi:water-outline
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Serpillière moyenne
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: Serpillière intensive
        icon: mdi:water
        variables:
          selecteur: input_select.aspirateur_intention_profil
          option: Serpillière intensive

  # ==================================================
  # 🔁 PASSAGES — l'autre réglage, et il est séparé
  # --------------------------------------------------
  # Son propre en-tête, parce que ce n'est pas le même choix : le
  # profil dit COMMENT on nettoie, les passages COMBIEN DE FOIS on
  # repasse. Sous un titre commun, les trois passages s'alignaient à la
  # suite des profils et pouvaient se lire comme la fin de la même
  # liste, alors qu'ils écrivent un AUTRE sélecteur
  # (`input_select.aspirateur_intention_passages`) et se combinent
  # librement avec n'importe quel profil.
  #
  # Elle ne se masque JAMAIS non plus : les passages ne dépendent
  # d'aucune carte.
  # ==================================================
  - type: custom:button-card
    template: sub_section_header
    name: 🔁 Passages

  - type: grid
    square: false
    columns: 3
    cards:
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: 1 passage
        icon: mdi:numeric-1-box-outline
        variables:
          selecteur: input_select.aspirateur_intention_passages
          option: 1 passage
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: 2 passages
        icon: mdi:numeric-2-box-outline
        variables:
          selecteur: input_select.aspirateur_intention_passages
          option: 2 passages
      - type: custom:button-card
        template: carte_action_aspirateur_option
        name: 3 passages
        icon: mdi:numeric-3-box-outline
        variables:
          selecteur: input_select.aspirateur_intention_passages
          option: 3 passages

  # ==================================================
  # ⚡ RACCOURCIS — les TROIS du chapitre 10 §3
  # --------------------------------------------------
  # Sous-section de la composition : un raccourci PRÉREMPLIT la
  # composition — carte, pièces, profil, passages — et s'arrête là.
  # IL NE LANCE RIEN : le script appelé n'écrit que des helpers
  # d'intention, et le bouton de lancement ci-dessous reste l'unique
  # autorité de lancement (10 §3.1, 11 §3.6).
  #
  # Les réglages proposés sont VISIBLES immédiatement dans les grilles
  # ci-dessus — les segments bleus s'y déplacent — et MODIFIABLES d'un
  # geste avant tout lancement. C'est la condition exacte à laquelle le
  # second alinéa d'ASP-INV-56 ouvre cette faculté.
  #
  # GÉOMÉTRIE — DEUX RANGÉES, ET POURQUOI CELLE-LÀ.
  #   Rangée 1, DEUX colonnes : les deux raccourcis du RDC. Ils
  #   partagent le MÊME périmètre et ne diffèrent que par la nature du
  #   nettoyage — les apparier est la lecture juste, pas un choix
  #   décoratif.
  #   Rangée 2, PLEINE LARGEUR : l'Étage, qui est un autre périmètre.
  #
  #   HAUTEUR NATIVE, ET C'EST LA CLÉ. Ces cartes ne forcent AUCUNE
  #   hauteur : elles gardent les 72px de `carte_base_v2`. À deux
  #   colonnes sur un téléphone, une cellule offre ~152px de texte utile
  #   quand « RDC — serpillière complète » en demande ~176 : le libellé
  #   passe donc sur DEUX lignes, et deux lignes de 13px ne tiennent pas
  #   sous une icône de 26px dans une carte de 52px. C'est exactement ce
  #   qu'une hauteur forcée à 52px produirait — un texte tronqué ou
  #   débordant. La hauteur du socle, elle, les accueille.
  #
  #   Le compte y est aussi : deux rangées de 72px font 152px là où
  #   trois rangées de 52px en faisaient 172. Moins haut, et deux fois
  #   moins de lignes à parcourir.
  # ==================================================
  - type: custom:button-card
    template: sub_section_header
    name: ⚡ Raccourcis

  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:button-card
        template: carte_action_standard
        entity: script.aspirateur_appliquer_raccourci
        name: RDC — aspiration complète
        icon: mdi:home-floor-g
        variables:
          confirmation: >-
            Préremplir la composition avec « RDC — aspiration
            complète » ? Aucune mission ne sera lancée.
          service: script.aspirateur_appliquer_raccourci
          data:
            raccourci: rdc_aspiration

      - type: custom:button-card
        template: carte_action_standard
        entity: script.aspirateur_appliquer_raccourci
        name: RDC — serpillière complète
        icon: mdi:water-outline
        variables:
          confirmation: >-
            Préremplir la composition avec « RDC — serpillière
            complète » ? Aucune mission ne sera lancée.
          service: script.aspirateur_appliquer_raccourci
          data:
            raccourci: rdc_serpilliere

  - type: grid
    square: false
    columns: 1
    cards:
      - type: custom:button-card
        template: carte_action_standard
        entity: script.aspirateur_appliquer_raccourci
        name: Étage — aspiration complète
        icon: mdi:stairs-up
        variables:
          confirmation: >-
            Préremplir la composition avec « Étage — aspiration
            complète » ? Aucune mission ne sera lancée.
          service: script.aspirateur_appliquer_raccourci
          data:
            raccourci: etage_aspiration

  # ==================================================
  # 3️⃣ LANCEMENT — action principale, confirmée
  # --------------------------------------------------
  # Une mission est une action physique sur un équipement mobile :
  # jamais un basculement d'un clic (contrat 11 §3.6). Elle reste donc
  # CONFIRMÉE, pleine largeur et plus haute que tout le reste.
  #
  # Elle n'est PAS orange. L'orange du dépôt signale ce qui interrompt
  # ou contrarie — Pause et Arrêt ci-dessous. Lancer est le geste
  # attendu de cette page : le peindre en vigilance banaliserait la
  # vigilance là où elle compte.
  # ==================================================
  - type: custom:button-card
    template: section_header
    name: 🚀 Lancement

  - type: grid
    square: false
    columns: 1
    cards:
      - type: custom:button-card
        template: carte_action_standard
        entity: script.aspirateur_composer_intention
        name: Lancer la mission
        icon: mdi:robot-vacuum
        styles:
          card:
            - height: 72px
        variables:
          confirmation: >-
            ⚠️ Lancer une mission avec la composition affichée ? Le robot
            va se mettre en marche.
          service: script.aspirateur_composer_intention

      - type: custom:button-card
        template: carte_action_standard
        entity: script.aspirateur_reinitialiser_composition
        name: Réinitialiser la composition
        icon: mdi:backup-restore
        styles:
          card:
            - height: 52px
        variables:
          confirmation: "Remettre la composition à son état de départ ?"
          service: script.aspirateur_reinitialiser_composition

  # ==================================================
  # 4️⃣ CONDUITE — quatre gestes, masqués hors sens physique
  # --------------------------------------------------
  # L'AUTORITÉ DE L'OFFRE EST LA MISSION ARSENAL OUVERTE, et elle seule
  # (ASP-INV-97). L'interface la reçoit par la PROJECTION MÉTIER — elle
  # ne lit jamais le verdict, ce que le contrat 11 §2 interdit — et
  # jamais par une combinaison de témoins natifs :
  #   pause       ← mission Arsenal ouverte, ET nettoyage réel en cours
  #   reprise     ← mission Arsenal ouverte, ET mission en pause
  #   arrêt       ← mission Arsenal ouverte, SANS AUTRE GARDE : l'arrêt
  #                 n'est jamais plus contraint que le lancement
  #                 (ASP-INV-43), et il ne dépend plus du témoin natif
  #   retour base ← mission Arsenal ouverte, et le robot ne rentre pas
  #                 déjà — les trois exclusions sont de SENS PHYSIQUE,
  #                 conservées telles quelles (ASP-INV-48)
  # Le backend REVALIDE chacune : masquer ici est une commodité, pas
  # une autorisation.
  #
  # C'EST LA LEVÉE DE RC-02, ET ELLE PORTE SUR LES QUATRE GESTES.
  # L'affichage et la garde du backend lisent LE MÊME PRÉDICAT
  # D'AUTORITÉ : aucun bouton n'est présenté puis refusé, et aucun geste
  # possible n'est masqué. Une mission externe — robot actif qu'Arsenal
  # n'a pas ouvert — n'expose donc AUCUN geste de conduite Arsenal.
  #
  # LES DEUX CONDITIONS SE CUMULENT, ET NE SE CONFONDENT PAS :
  # l'AUTORITÉ ouvre l'offre — la mission Arsenal, reçue par la
  # projection —, le SENS PHYSIQUE la restreint. C'est la lettre du
  # contrat 15 §3.1, dont la garde de Pause est « mission Arsenal
  # ouverte ET activité en cours », et celle de Reprise « ASP-INV-62,
  # PLUS mission Arsenal ouverte » (D-07). L'interface n'appliquait que
  # la moitié physique de ces deux gardes : le lot 8 pose la moitié
  # d'autorité qui manquait.
  #
  # LA SECTION ENTIÈRE, EN-TÊTE COMPRIS, tient dans une condition : la
  # disjonction EXACTE des quatre gardes ci-dessus. Depuis que les quatre
  # exigent l'autorité, cette disjonction se réduit à UN SEUL TERME —
  # « mission Arsenal ouverte » —, et ce n'est pas un raccourci : la
  # garde d'Arrêt est ce terme NU, et les trois autres le contiennent.
  # Une disjonction plus large ferait paraître l'en-tête au-dessus de
  # ZÉRO bouton sur une mission externe, exactement ce que la règle
  # ci-dessous proscrit.
  #
  # Aucun sur-ensemble, aucune approximation : si un seul geste a du
  # sens, l'en-tête paraît ; si aucun n'en a, rien ne paraît.
  #
  # L'INDISPONIBILITÉ DE LA PROJECTION NE VAUT PAS « PAS DE MISSION ».
  # Elle est rendue comme telle par la projection (ASP-INV-96), et une
  # condition d'état sur `on` ne la confond donc avec rien : aucun geste
  # n'est offert quand la responsabilité est inconnaissable. C'est le
  # sens sûr, et c'est celui du backend.
  # ==================================================
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.aspirateur_mission_arsenal_ouverte
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          template: section_header
          name: 🎛️ Conduite

        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.aspirateur_mission_arsenal_ouverte
              state: "on"
            - condition: state
              entity: sensor.aspirateur_etat_canonique
              state: nettoyage_reel
          card:
            type: custom:button-card
            template: carte_action_standard_warning
            entity: script.aspirateur_conduire_mission
            name: Mettre en pause
            icon: mdi:pause-circle
            styles:
              card:
                - height: 52px
            variables:
              confirmation: "Mettre la mission en pause ?"
              service: script.aspirateur_conduire_mission
              data:
                geste: pause

        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.aspirateur_mission_arsenal_ouverte
              state: "on"
            - condition: state
              entity: sensor.aspirateur_etat_canonique
              state: pause
          card:
            type: custom:button-card
            template: carte_action_standard
            entity: script.aspirateur_conduire_mission
            name: Reprendre la mission
            icon: mdi:play-circle
            styles:
              card:
                - height: 52px
            variables:
              confirmation: "Reprendre la mission ?"
              service: script.aspirateur_conduire_mission
              data:
                geste: reprise

        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.aspirateur_mission_arsenal_ouverte
              state: "on"
            - condition: state
              entity: sensor.aspirateur_etat_canonique
              state_not: retour_base
            - condition: state
              entity: sensor.aspirateur_etat_canonique
              state_not: amarrage
            - condition: state
              entity: sensor.aspirateur_etat_canonique
              state_not: charge
          card:
            type: custom:button-card
            template: carte_action_standard
            entity: script.aspirateur_conduire_mission
            name: Renvoyer à la base
            icon: mdi:home-import-outline
            styles:
              card:
                - height: 52px
            variables:
              confirmation: "Renvoyer le robot à sa base ?"
              service: script.aspirateur_conduire_mission
              data:
                geste: retour_base

        - type: conditional
          conditions:
            - condition: state
              entity: binary_sensor.aspirateur_mission_arsenal_ouverte
              state: "on"
          card:
            type: custom:button-card
            template: carte_action_standard_warning
            entity: script.aspirateur_conduire_mission
            name: Arrêter la mission
            icon: mdi:stop-circle
            styles:
              card:
                - height: 52px
            variables:
              confirmation: "⚠️ Arrêter la mission en cours ?"
              service: script.aspirateur_conduire_mission
              data:
                geste: arret

  # ==================================================
  # 5️⃣ ENTRETIEN — synthèse compacte, LECTURE SEULE
  # --------------------------------------------------
  # Le geste de déclaration vit dans une carte d'action SÉPARÉE :
  # l'action est physiquement séparée de la lecture, et ce lot ne la
  # pose pas. Aucun bouton natif n'est exposé ici.
  #
  # AUCUN `ON` / `OFF`, ET AUCUN VERT. Un entretien dû est une anomalie
  # à traiter : rouge. Un entretien non dû n'est pas une réussite à
  # célébrer : gris neutre. Une question non tranchable n'est ni l'un
  # ni l'autre : gris atténué d'indisponibilité, jamais rabattue sur un
  # nominal (ASP-INV-45).
  # ==================================================
  - type: custom:button-card
    template: section_header
    name: 🧰 Entretien

  - type: grid
    square: false
    columns: 2
    cards:
      - type: custom:button-card
        template: socle_status_label_72
        entity: binary_sensor.aspirateur_entretien_requis
        name: Entretien
        icon: mdi:broom
        label: |
          [[[
            const s = entity ? entity.state : null;
            if (!s || s === 'unknown' || s === 'unavailable') return '—';
            return s === 'on' ? 'Requis' : 'Non requis';
          ]]]
        styles:
          card:
            - background-color: |
                [[[
                  const s = entity ? entity.state : null;
                  if (!s || s === 'unknown' || s === 'unavailable')
                    return 'rgba(158, 158, 158, 0.1)';
                  if (s === 'on') return 'rgba(244, 67, 54, 0.2)';
                  return 'rgba(158, 158, 158, 0.2)';
                ]]]

      - type: custom:button-card
        template: socle_status_label_72
        entity: sensor.aspirateur_entretien_du
        name: Éléments dus
        icon: mdi:format-list-bulleted
        label: |
          [[[
            const s = entity ? entity.state : null;
            if (!s || s === 'unknown' || s === 'unavailable') return '—';
            if (s === 'aucun') return 'Aucun';
            if (s === 'non_evaluable') return 'Non évaluable';
            return s;
          ]]]
        styles:
          card:
            - background-color: |
                [[[
                  const s = entity ? entity.state : null;
                  if (!s || s === 'unknown' || s === 'unavailable')
                    return 'rgba(158, 158, 158, 0.1)';
                  if (s === 'aucun') return 'rgba(158, 158, 158, 0.2)';
                  if (s === 'non_evaluable')
                    return 'rgba(158, 158, 158, 0.1)';
                  return 'rgba(244, 67, 54, 0.2)';
                ]]]
          label:
            - white-space: normal
            - line-height: 1.25
