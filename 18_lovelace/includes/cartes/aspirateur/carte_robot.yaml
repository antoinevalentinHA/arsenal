# ==========================================================
# 🧠 ARSENAL — CARTE MÉTIER (INCLUDE)
#     Aspirateur — la carte courante du robot, en lecture seule
# ----------------------------------------------------------
# 🎯 RÔLE
#   Montrer UNE carte : celle que le robot a effectivement chargée.
#   Pas les trois — une page de trois plans est une page qu'on ne lit
#   pas, et afficher un plan inactif laisserait croire qu'il l'est.
#
# 🧭 QUI DÉSIGNE LA CARTE — LE BACKEND, JAMAIS CETTE CARTE
#   `sensor.aspirateur_carte_courante` (`12_template_sensors/aspirateur/
#   carte_courante.yaml`), dérivation pure du contexte cartographique du
#   robot. L'UI ne devine rien et ne compare aucun libellé d'appareil :
#   elle lit un jeton — `rdc`, `etage`, `annexe`, `hors_perimetre`,
#   `indisponible` — et rend le plan correspondant.
#   Contrat : `02` §2.1 (`ASP-INV-66`, troisième geste) et §5.
#
# 📡 SOURCE DES PLANS — ENTITÉS `image`, ATTESTÉES PAR L'AUDIT §4
#     image.roborock_q7_max_rdc      → Rez-de-chaussée
#     image.roborock_q7_max_etage    → Étage
#     image.roborock_q7_max_annexe   → Annexe
#   La quatrième carte du robot, `Garage`, n'a **aucune pièce nommée** et
#   n'est aucun des trois périmètres métier : elle n'a pas de plan ici, et
#   la sélectionner tombe sur `hors_perimetre`.
#
# 🕳️ QUAND IL N'Y A RIEN À MONTRER, RIEN N'EST MONTRÉ
#   `indisponible` — contexte cartographique illisible — et
#   `hors_perimetre` — carte hors des trois périmètres — n'affichent
#   AUCUN plan. La carte d'état, elle, reste toujours visible et DIT
#   lequel des deux cas s'applique : un écran vide sans explication
#   serait une panne muette.
#
# 🔒 LECTURE SEULE — ET LE MOT EST PRIS AU SÉRIEUX
#   - `tap_action`, `hold_action`, `double_tap_action` à `none`.
#   - AUCUN `select.roborock_q7_max_carte_selectionnee` : l'écrire
#     basculerait le contexte cartographique du robot — c'est une
#     commande, réservée au moteur et au script de conduite
#     (`ASP-INV-31`, `ASP-CI-7`).
#   - AUCUN libellé d'appareil : les trois libellés affichés sont les
#     libellés canoniques Arsenal du `02` §2 (`ASP-INV-7`).
#
# ⚠️ CE QUE CET ÉCRAN N'AFFIRME PAS
#   Ni où se trouve le robot, ni ce qu'il a nettoyé : le contexte
#   cartographique est une SÉLECTION, pas une localisation, et il ne se
#   recale pas après un déplacement physique (audit §4). Cet écran montre
#   le plan chargé, et s'arrête là.
#
# 🏷️ STATUT
#   Interface — domaine aspirateur, second écran (carte)
# ==========================================================

type: vertical-stack
cards:

  - type: custom:button-card
    template: section_header
    name: 🗺️ Carte du robot

  # État de la désignation — TOUJOURS visible, y compris quand aucun plan
  # ne peut être rendu. Libellés canoniques Arsenal, jamais d'appareil.
  - type: custom:button-card
    template: socle_status_label_72
    entity: sensor.aspirateur_carte_courante
    name: Carte chargée
    icon: |
      [[[
        const s = entity ? entity.state : null;
        if (s === 'rdc') return 'mdi:home-floor-g';
        if (s === 'etage') return 'mdi:stairs-up';
        if (s === 'annexe') return 'mdi:home-outline';
        return 'mdi:map-marker-off';
      ]]]
    label: |
      [[[
        const s = entity ? entity.state : null;
        if (s === 'rdc') return 'Rez-de-chaussée';
        if (s === 'etage') return 'Étage';
        if (s === 'annexe') return 'Annexe';
        if (s === 'hors_perimetre')
          return 'Hors des trois périmètres — aucun plan à afficher';
        return 'Contexte cartographique illisible';
      ]]]
    styles:
      card:
        - background-color: |
            [[[
              const s = entity ? entity.state : null;
              if (s === 'rdc' || s === 'etage' || s === 'annexe')
                return 'rgba(33, 150, 243, 0.2)';
              if (s === 'hors_perimetre')
                return 'rgba(158, 158, 158, 0.2)';
              return 'rgba(158, 158, 158, 0.1)';
            ]]]
      label:
        - white-space: normal
        - line-height: 1.25

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.aspirateur_carte_courante
        state: rdc
    card:
      type: picture-entity
      entity: image.roborock_q7_max_rdc
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.aspirateur_carte_courante
        state: etage
    card:
      type: picture-entity
      entity: image.roborock_q7_max_etage
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none

  - type: conditional
    conditions:
      - condition: state
        entity: sensor.aspirateur_carte_courante
        state: annexe
    card:
      type: picture-entity
      entity: image.roborock_q7_max_annexe
      show_name: false
      show_state: false
      tap_action:
        action: none
      hold_action:
        action: none
      double_tap_action:
        action: none
