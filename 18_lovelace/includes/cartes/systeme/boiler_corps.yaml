# ==========================================================
# 🧠 ARSENAL — CORPS PARTAGÉ : Dashboard Boiler (Boiler Pi / Bridge)
# ----------------------------------------------------------
# Corps unique (santé bridge, activité, combustion, transactions,
# dernière erreur, supervision) partagé par les 3 dashboards frères
# Boiler, qui ne diffèrent QUE par la destination du bouton Retour :
#   • systeme/boiler.yaml            -> retour /system-dashboard
#   • systeme/boiler_chauffage.yaml  -> retour /diagnostics-chauffage-dashboard
#   • systeme/boiler_ecs.yaml        -> retour /diagnostics-ecs-dashboard
# Objectif : retour contextuel vers le parent logique (cf. ui/navigation.md)
# sans dupliquer le contenu. Éditer le boiler ? Éditer ICI, une fois.
# ==========================================================

type: vertical-stack
cards:
  # ==========================================================
  # 🧠 SECTION — SANTE BRIDGE
  # ==========================================================
  - type: custom:button-card
    template: section_header
    name: 🔗 Bridge

  # La surface amont ne distingue plus « démon » et « liaison optique » :
  # elle qualifie LA CHAÎNE de lecture par `chain.status`, projeté en state
  # de sensor.boiler_telemetry_status (ok | degraded | unavailable).
  # Une seule carte remplace donc Optolink et vcontrold — pas deux.
  # Réf : 12_template_sensors/boiler/sante.yaml § note architecturale
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_status_infra_positive
        entity: binary_sensor.boiler_bridge_online
        name: MQTT

      - type: custom:button-card
        template: boiler_status_degraded_flag
        entity: binary_sensor.boiler_bridge_degraded
        name: Degraded

      - type: custom:button-card
        template: boiler_status_infra_positive
        entity: sensor.boiler_telemetry_status
        name: Chaîne

  # La cause n'est publiée QUE lorsque la chaîne n'est pas saine :
  # `chain.cause` vaut null si et seulement si `chain.status` vaut `ok`,
  # projeté ici en `none`. Afficher en permanence une carte vide, ou une
  # carte redondante avec le statut ci-dessus, n'apporterait rien : le bloc
  # n'apparaît donc que porteur d'une cause exploitable.
  # Vocabulaire public : daemon_unreachable | unsupported_command | timeout
  #                      | unusable_output | transport_error
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.boiler_chain_cause
        state_not: "none"
      - condition: state
        entity: sensor.boiler_chain_cause
        state_not: unknown
      - condition: state
        entity: sensor.boiler_chain_cause
        state_not: unavailable
    card:
      type: custom:button-card
      template: boiler_diagnostic_error
      entity: sensor.boiler_chain_cause
      name: Cause chaîne

  # ==========================================================
  # 🧠 SECTION — ACTIVITE SYSTEME
  # ==========================================================
  - type: custom:button-card
    template: section_header
    name: 📡 Activité

  # Aucune version n'est exposée par Boilerack : la carte Version du bridge
  # a été retirée faute de source. Celle du guard, plus bas, est produite
  # localement et demeure.
  - type: custom:button-card
    template: boiler_info_timestamp
    entity: sensor.boiler_bridge_heartbeat_timestamp
    name: Heartbeat

  # ==========================================================
  # 🧠 SECTION — COMBUSTION
  # ==========================================================
  - type: custom:button-card
    template: section_header
    name: 🔥 Combustion

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_status_burner
        entity: binary_sensor.boiler_burner_on
        name: Brûleur

      - type: custom:button-card
        template: boiler_kpi_burner_modulation
        entity: sensor.boiler_burner_modulation
        name: Modulation

      - type: custom:button-card
        template: boiler_kpi_temperature
        entity: sensor.boiler_supply_temperature
        name: T° de départ

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_kpi_consigne
        entity: sensor.boiler_dhw_setpoint
        name: Consigne ECS

      - type: custom:button-card
        template: boiler_kpi_consigne
        entity: sensor.boiler_heating_setpoint
        name: Consigne Chauffage

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_kpi_courbe
        entity: sensor.boiler_heating_curve_slope
        name: Pente

      - type: custom:button-card
        template: boiler_kpi_courbe
        entity: sensor.boiler_heating_curve_shift
        name: Décalage

  # ==========================================================
  # 🧠 SECTION — TRANSACTIONS
  # ==========================================================
  - type: custom:button-card
    template: section_header
    name: 🔁 Transactions

  # ECS
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_decision_ack
        entity: sensor.boiler_ack_dhw_set_setpoint_status
        name: ECS

      - type: custom:button-card
        template: boiler_info_timestamp
        entity: sensor.boiler_ack_dhw_set_setpoint_ts
        name: Timestamp

  # Chauffage temperature
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_decision_ack
        entity: sensor.boiler_ack_heating_set_temperature_status
        name: Chauffage

      - type: custom:button-card
        template: boiler_info_timestamp
        entity: sensor.boiler_ack_heating_set_temperature_ts
        name: Timestamp

  # Pente
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_decision_ack
        entity: sensor.boiler_ack_heating_set_curve_slope_status
        name: Pente

      - type: custom:button-card
        template: boiler_info_timestamp
        entity: sensor.boiler_ack_heating_set_curve_slope_ts
        name: Timestamp

  # Decalage
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_decision_ack
        entity: sensor.boiler_ack_heating_set_curve_shift_status
        name: Décalage

      - type: custom:button-card
        template: boiler_info_timestamp
        entity: sensor.boiler_ack_heating_set_curve_shift_ts
        name: Timestamp

  # ==========================================================
  # 🧠 SECTION — DERNIERE ERREUR
  # ==========================================================
  - !include boiler_bloc_erreur_recente.yaml

  # ==========================================================
  # 🧠 SECTION — SUPERVISION
  # ==========================================================
  - type: custom:button-card
    template: section_header
    name: 🛡 Supervision

  # Synthèse
  - type: custom:button-card
    template: boiler_guard_synthese_72
    entity: binary_sensor.boiler_guard_stale
    name: Guard
    icon: mdi:shield-check

  # Capteurs exposés
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_guard_stale_72
        entity: binary_sensor.boiler_guard_stale
        name: Stale
        icon: mdi:alert-octagon

      - type: custom:button-card
        template: boiler_guard_status_72
        entity: sensor.boiler_guard_status
        name: Statut
        icon: mdi:shield-check

  - type: horizontal-stack
    cards:
      - type: custom:button-card
        template: boiler_guard_action_72
        entity: sensor.boiler_guard_last_action
        name: Action
        icon: mdi:history

      - type: custom:button-card
        template: socle_info_72
        entity: sensor.boiler_guard_version
        name: Version
        icon: mdi:tag
