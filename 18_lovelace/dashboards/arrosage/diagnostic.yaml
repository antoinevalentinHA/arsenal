button_card_templates: !include_dir_merge_named /config/19_button_card_templates

# ==========================================================
# 🩺 ARROSAGE — DIAGNOSTIC (explication du raisonnement du domaine)
# ----------------------------------------------------------
# Vue 100 % LECTURE. Répond à « pourquoi le domaine Arrosage
# arrive-t-il à ce verdict ? ». Lecture par DOMAINE (précipitations,
# sol, climat, exécution) ; à l'intérieur de chaque domaine la
# micro-causalité est conservée : faits observés → conclusion métier.
# Le canal climatique (ET₀/VPD) est en OBSERVATION À BLANC :
# il ne participe pas encore à la décision (entrera via C11).
#
# Cadrage : audits/02_conception/arrosage/cadrage_dashboard_diagnostic_arrosage.md
# Réutilisation exclusive des socles/templates/cartes existants ;
# aucune logique métier/graphique ici (le runtime décide, l'UI
# explique) ; seul lien de navigation : santé du pont (Système).
# ==========================================================

views:
  - badges:
      - type: custom:button-card
        template: bouton_accueil_badge_carre

      - type: custom:button-card
        template: bouton_navigation_badge_carre

      - type: custom:button-card
        template: bouton_retour_badge_carre
        tap_action:
          action: navigate
          navigation_path: /arrosage-dashboard

    cards:
      - type: vertical-stack
        cards:
          # =========================================================
          # Le VERDICT (intention + raison) vit sur le cockpit
          # /arrosage-dashboard. Ce Diagnostic explique le POURQUOI,
          # rangé PAR DOMAINE ; dans chaque domaine : faits → conclusion.
          # =========================================================
          # 🌧️ Précipitations — faits pluie → conclusion (suspension)
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🌧️ Précipitations

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_24h
                name: Cumul 24 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_48h
                name: Cumul 48 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_72h
                name: Cumul 72 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_prevue
                name: Pluie prévue
                icon: mdi:weather-pouring

          # Conclusion métier du domaine précipitations.
          - type: custom:button-card
            template: carte_arrosage_pluie_raison
            entity: binary_sensor.arrosage_suspension_pluie

          # =========================================================
          # 🌱 Sol — faits réservoir lent → conclusion (besoin sol)
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🌱 Sol

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: carte_etat_interprete
                entity: sensor.jardin_reservoir_sol_etat
                name: État réservoir sol
                icon: mdi:cup-water
                variables:
                  couleurs:
                    complet: 'rgba(76, 175, 80, 0.2)'
                    degrade: 'rgba(255, 235, 59, 0.2)'
                    insuffisant: 'rgba(255, 152, 0, 0.2)'
                    indisponible: 'rgba(158, 158, 158, 0.1)'

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.jardin_humidite_sol_points_frais
                name: Points frais
                icon: mdi:check-decagram

              # Faits de dispersion — grandeurs d'observation déjà calculées par le
              # runtime (réservoir_sol.yaml), rendues visibles ici (P0 observabilité,
              # audit_humidite_sol_mediane_dispersion.md). Lecture seule : ni seuil,
              # ni jugement automatique. Minimum = point le plus sec ; Écart =
              # hétérogénéité (max − min). La médiane reste portée par le cockpit
              # (tendance) et le verdict « Besoin sol » ci-dessous. Pas de capteur
              # « maximum » en backend : non affiché (aucun entity_id créé).
              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.jardin_humidite_sol_minimum
                name: Minimum
                icon: mdi:water-alert-outline

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.jardin_humidite_sol_heterogeneite
                name: Écart
                icon: mdi:arrow-expand-vertical

          # Conclusion métier du domaine sol.
          # Lit le sous-verdict `motif` (attribut backend) plutôt que le
          # simple on/off : distingue le besoin FRANC (sol sous seuil) du
          # besoin MAINTENU par l'hystérésis (médiane déjà remontée dans la
          # bande [seuil ; seuil+hyst[). Sans ça, la carte affichait « Sol
          # sous seuil » même quand la médiane repassait au-dessus du seuil.
          - type: custom:button-card
            template: carte_attribut_categoriel_interprete
            entity: binary_sensor.arrosage_besoin_sol
            name: Besoin sol
            icon: mdi:sprout
            variables:
              attribut: motif
              libelles:
                sous_seuil: Sol sous seuil
                maintenu_hysteresis: Maintenu (hystérésis)
                suffisant: Sol suffisant
                indisponible: Indisponible
              couleurs:
                sous_seuil: 'rgba(255, 152, 0, 0.2)'
                maintenu_hysteresis: 'rgba(255, 235, 59, 0.2)'
                suffisant: 'rgba(76, 175, 80, 0.2)'
                indisponible: 'rgba(158, 158, 158, 0.1)'

          # =========================================================
          # 🌡️ Climat (observation à blanc, hors décision V1)
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🌡️ Climat

          - type: markdown
            content: >-
              **Observation à blanc.** Ce canal (ET₀ / VPD) est observé mais **ne
              participe pas encore à la décision d'arrosage**. Il entrera dans le
              raisonnement avec **C11** (modulation de durée).

          # Tendances d'observation — mêmes réglages que « Humidité du sol »
          # du cockpit principal. ET₀ et VPD tracés SÉPARÉMENT : unités et
          # dynamiques distinctes (mm/j lente vs kPa instantané), jamais
          # fondus en un axe partagé (contrat 16 §5).
          - type: custom:mini-graph-card
            name: 🌞 ET₀ journalière
            icon: mdi:sun-thermometer-outline
            entities:
              - entity: sensor.arrosage_demande_climatique_et0
                name: ET₀
            hours_to_show: 72
            points_per_hour: 4
            line_width: 3
            animate: true
            smoothing: true
            show:
              labels: true
              legend: false
              extrema: true
              fill: fade
              icon: false
            font_size: 75
            height: 160
            align_state: center
            decimals: 2
            tap_action:
              action: more-info

          - type: custom:mini-graph-card
            name: 💧 VPD courant
            icon: mdi:water-opacity
            entities:
              - entity: sensor.arrosage_demande_climatique_vpd
                name: VPD
            hours_to_show: 72
            points_per_hour: 4
            line_width: 3
            animate: true
            smoothing: true
            show:
              labels: true
              legend: false
              extrema: true
              fill: fade
              icon: false
            font_size: 75
            height: 160
            align_state: center
            decimals: 2
            tap_action:
              action: more-info

          - type: custom:button-card
            template: carte_etat_interprete
            entity: sensor.arrosage_demande_climatique_etat
            name: État du canal climatique
            icon: mdi:weather-partly-cloudy
            variables:
              couleurs:
                complet: 'rgba(76, 175, 80, 0.2)'
                degrade: 'rgba(255, 235, 59, 0.2)'
                indisponible: 'rgba(158, 158, 158, 0.1)'

          # =========================================================
          # 🛠️ Exécution — l'acte et sa preuve
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🛠️ Exécution

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: status_72_on_off
                entity: switch.rain_bird_bat_bt_2_e9a3_station_1
                name: Station 1 active
                icon: mdi:sprinkler-variant

              - type: custom:button-card
                template: socle_info_72
                entity: sensor.arrosage_dernier_effectif
                name: Dernier arrosage prouvé
                icon: mdi:history

          # =========================================================
          # 🎛️ Modulation de durée — décision backend (contrat 19, C11 P4)
          # =========================================================
          # Lecture seule : restitue la décision backend
          # sensor.arrosage_modulation_duree_applicable (état + attributs) et son
          # interrupteur d'activation. AUCUN calcul UI, AUCUNE décision ici : le
          # backend décide, l'UI traduit (statuts/motifs = attributs backend). La
          # durée figée de la session est portée par la section « 🧾 Session ».
          # Facteurs et durées intermédiaires (attributs numériques) non affichés
          # en tuiles (aucune carte compatible sans détournement) : la direction
          # est portée par les statuts/motifs et la comparaison nominale↔applicable.
          - type: custom:button-card
            template: section_header
            name: 🎛️ Modulation de durée

          # Contrôle : attribut normalisé on / off / indisponible (backend).
          - type: custom:button-card
            template: carte_attribut_categoriel_interprete
            entity: sensor.arrosage_modulation_duree_applicable
            name: Contrôle modulation
            icon: mdi:tune-variant
            variables:
              attribut: modulation_controle
              libelles:
                'on': Active
                'off': Désactivée
                indisponible: Indisponible
              couleurs:
                'on': 'rgba(33, 150, 243, 0.2)'
                'off': 'rgba(158, 158, 158, 0.2)'
                indisponible: 'rgba(158, 158, 158, 0.1)'

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: carte_attribut_categoriel_interprete
                entity: sensor.arrosage_modulation_duree_applicable
                name: Sol — statut
                icon: mdi:water-percent
                variables:
                  attribut: sol_statut
                  libelles:
                    reduction: Réduction
                    neutre: Neutre
                    abstention: Abstention
                  couleurs:
                    reduction: 'rgba(76, 175, 80, 0.2)'
                    neutre: 'rgba(158, 158, 158, 0.2)'
                    abstention: 'rgba(158, 158, 158, 0.1)'

              - type: custom:button-card
                template: carte_attribut_categoriel_interprete
                entity: sensor.arrosage_modulation_duree_applicable
                name: Climat — statut
                icon: mdi:sun-thermometer-outline
                variables:
                  attribut: climat_statut
                  libelles:
                    neutre: Neutre
                    abstention: Abstention
                  couleurs:
                    neutre: 'rgba(158, 158, 158, 0.2)'
                    abstention: 'rgba(158, 158, 158, 0.1)'

              - type: custom:button-card
                template: carte_attribut_categoriel_interprete
                entity: sensor.arrosage_modulation_duree_applicable
                name: Sol — motif
                icon: mdi:information-outline
                variables:
                  attribut: sol_motif
                  couleurs:
                    sol_complet_mediane_ge_seuil: 'rgba(76, 175, 80, 0.2)'
                    sol_complet_mediane_sous_seuil_allongement_differe: 'rgba(158, 158, 158, 0.2)'
                    sol_degrade_confiance_insuffisante_pour_reduire: 'rgba(255, 235, 59, 0.2)'
                    sol_non_qualifie: 'rgba(158, 158, 158, 0.1)'

              - type: custom:button-card
                template: carte_attribut_categoriel_interprete
                entity: sensor.arrosage_modulation_duree_applicable
                name: Climat — motif
                icon: mdi:information-outline
                variables:
                  attribut: climat_motif
                  couleurs:
                    allongement_climatique_non_calibre: 'rgba(158, 158, 158, 0.2)'
                    climat_indisponible: 'rgba(158, 158, 158, 0.1)'
                    climat_etat_indetermine: 'rgba(158, 158, 158, 0.1)'

          # Décision : durées clés en STATE (indispo-safe) + motif global (attribut).
          # « Applicable » (décision live) vs « Nominale » (base) rend une réduction
          # immédiatement visible ; la durée FIGÉE est en section Session.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: carte_kpi_bleu
                entity: input_number.arrosage_rainbird_station_1_duree_minutes
                name: Durée nominale (base)
                icon: mdi:timer-outline

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.arrosage_modulation_duree_applicable
                name: Durée applicable (décision)
                icon: mdi:timer-cog-outline

          - type: custom:button-card
            template: carte_attribut_categoriel_interprete
            entity: sensor.arrosage_modulation_duree_applicable
            name: Motif global (décision)
            icon: mdi:label-outline
            variables:
              attribut: motif_global
              libelles:
                reduction_sol: Réduction (sol)
                neutre: Neutre
                abstention_sol: Abstention sol
                abstention_climat: Abstention climat
                abstention_double: Double abstention
                modulation_desactivee: Modulation désactivée
                controle_modulation_indisponible: Contrôle indisponible
              couleurs:
                reduction_sol: 'rgba(76, 175, 80, 0.2)'
                neutre: 'rgba(158, 158, 158, 0.2)'
                abstention_sol: 'rgba(255, 235, 59, 0.2)'
                abstention_climat: 'rgba(255, 235, 59, 0.2)'
                abstention_double: 'rgba(255, 152, 0, 0.2)'
                modulation_desactivee: 'rgba(158, 158, 158, 0.2)'
                controle_modulation_indisponible: 'rgba(158, 158, 158, 0.1)'

          # =========================================================
          # 🧾 Session — l'arrosage courant et sa clôture (Lots B/D)
          # =========================================================
          # Lecture seule : états de session persistés (helpers Lot B) et
          # lectures dérivées. La fin est orchestrée par l'automation
          # 10270000000006 ; aucune commande native ici (contrat 11 §2).
          - type: custom:button-card
            template: section_header
            name: 🧾 Session

          - type: custom:button-card
            template: carte_mode_binaire_interprete
            entity: binary_sensor.arrosage_session_en_cours
            name: Session en cours
            icon: mdi:progress-clock
            variables:
              label_on: Session ouverte
              label_off: Aucune session ouverte
              color_on: 'rgba(33, 150, 243, 0.2)'
              color_off: 'rgba(158, 158, 158, 0.1)'

          - type: custom:button-card
            template: carte_etat_interprete
            entity: sensor.arrosage_session_etat
            name: État de session
            icon: mdi:clipboard-text-clock
            variables:
              couleurs:
                aucune: 'rgba(158, 158, 158, 0.1)'
                ouverte: 'rgba(33, 150, 243, 0.2)'
                fin_observee: 'rgba(255, 235, 59, 0.2)'
                close_nominale: 'rgba(76, 175, 80, 0.2)'
                close_reprise: 'rgba(255, 235, 59, 0.2)'
                close_watchdog: 'rgba(255, 152, 0, 0.2)'
                close_anomalie: 'rgba(255, 152, 0, 0.2)'
                stop_incertain: 'rgba(244, 67, 54, 0.2)'
                depassement: 'rgba(244, 67, 54, 0.2)'

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: socle_info_72
                entity: input_datetime.arrosage_session_debut
                name: Début de session
                icon: mdi:ray-start-arrow

              - type: custom:button-card
                template: socle_info_72
                entity: input_number.arrosage_session_duree_minutes
                name: Durée demandée
                icon: mdi:timer-sand-paused

              - type: custom:button-card
                template: socle_info_72
                entity: input_datetime.arrosage_session_fin_prevue
                name: Fin prévue (échéance)
                icon: mdi:clock-alert-outline

              - type: custom:button-card
                template: socle_info_72
                entity: input_datetime.arrosage_session_fin_observee
                name: Fin observée
                icon: mdi:ray-end

          - type: custom:button-card
            template: socle_info_72
            entity: input_text.arrosage_session_verdict
            name: Verdict de session (code interne)
            icon: mdi:clipboard-text-clock

          # Motif de modulation FIGÉ à l'ouverture de la session (snapshot Run).
          # À comparer avec « Durée demandée » ci-dessus : rend visible le retour
          # exact à la base (modulation_desactivee) et une réduction réelle.
          - type: custom:button-card
            template: carte_etat_interprete
            entity: input_text.arrosage_session_modulation_motif
            name: Motif modulation (figé)
            icon: mdi:tune-variant
            variables:
              couleurs:
                reduction_sol: 'rgba(76, 175, 80, 0.2)'
                neutre: 'rgba(158, 158, 158, 0.2)'
                abstention_sol: 'rgba(255, 235, 59, 0.2)'
                abstention_climat: 'rgba(255, 235, 59, 0.2)'
                abstention_double: 'rgba(255, 152, 0, 0.2)'
                modulation_desactivee: 'rgba(158, 158, 158, 0.2)'
                controle_modulation_indisponible: 'rgba(158, 158, 158, 0.1)'
                decision_motif_indisponible: 'rgba(255, 152, 0, 0.2)'
                decision_indisponible: 'rgba(158, 158, 158, 0.1)'
                decision_invalide: 'rgba(244, 67, 54, 0.2)'
                base_invalide: 'rgba(244, 67, 54, 0.2)'
                base_indisponible: 'rgba(158, 158, 158, 0.1)'
