button_card_templates: !include_dir_merge_named /config/19_button_card_templates

# ==========================================================
# 🩺 ARROSAGE — DIAGNOSTIC (explication du raisonnement du domaine)
# ----------------------------------------------------------
# Vue 100 % LECTURE. Répond à « pourquoi le domaine Arrosage arrive-t-il
# à ce verdict ? ». Structurée en SECTIONS distinctes, chacune portée par
# UNE carte XL de synthèse lisible :
#   🌧️ Précipitations · 💧 Diagnostic hydrique · 🌡️ Demande climatique ·
#   🎛️ Décision de durée · 🧾 Session · 🛠️ Exécution (dernier arrosage).
# Chaque carte XL est placée sous SON PROPRE section header.
# Le canal climatique (ET₀/VPD) PARTICIPE désormais à la décision via la
# modulation de durée (C11 P4 : allongement 1,05 sous forte demande) ; ses
# grandeurs sont restituées dans la synthèse climatique XL (plus de graphe).
#
# Réutilisation exclusive des socles/templates existants ; aucune logique
# métier/décisionnelle ici (le runtime décide, l'UI restitue/assemble).
# ==========================================================

views:
  - badges:
      - type: custom:button-card
        template: bouton_accueil_badge_carre

      - type: custom:button-card
        template: bouton_navigation_badge_carre

      - type: custom:button-card
        template: bouton_retour_badge_carre
        tap_action:
          action: navigate
          navigation_path: /arrosage-dashboard

    cards:
      - type: vertical-stack
        cards:
          # =========================================================
          # 🌧️ Précipitations — faits pluie → conclusion (suspension)
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🌧️ Précipitations

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_24h
                name: Cumul 24 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_48h
                name: Cumul 48 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_cumul_72h
                name: Cumul 72 h
                icon: mdi:weather-rainy

              - type: custom:button-card
                template: carte_kpi_bleu
                entity: sensor.pluie_prevue
                name: Pluie prévue
                icon: mdi:weather-pouring

          - type: custom:button-card
            template: carte_arrosage_pluie_raison
            entity: binary_sensor.arrosage_suspension_pluie

          # =========================================================
          # 💧 Diagnostic hydrique — besoin sol + confiance réservoir
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 💧 Diagnostic hydrique

          - type: custom:button-card
            template: carte_arrosage_sol_synthese_xl
            entity: binary_sensor.arrosage_besoin_sol

          # =========================================================
          # 🌡️ Demande climatique — ET₀/VPD → statut
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🌡️ Demande climatique

          - type: custom:button-card
            template: carte_arrosage_climat_synthese_xl
            entity: sensor.arrosage_modulation_reco_climat

          # =========================================================
          # 🎛️ Décision de durée — « nominale → applicable » + motif global
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🎛️ Décision de durée

          - type: custom:button-card
            template: carte_arrosage_modulation_synthese_xl
            entity: sensor.arrosage_modulation_duree_applicable

          # =========================================================
          # 🧾 Session — état courant + autorité de fin
          #    Visible UNIQUEMENT quand une session est EN COURS. Une session
          #    close appartient à l'historique du dernier arrosage (bloc
          #    🛠️ Exécution ci-dessous) : on ne la restitue pas ici en double.
          #    Header + carte dans le MÊME vertical-stack du conditional ⇒
          #    masqués ensemble (jamais de header orphelin). `state: "on"`
          #    exact ⇒ off / unknown / unavailable masquent toute la section
          #    (indisponibilité JAMAIS assimilée à une session active).
          # =========================================================
          - type: conditional
            conditions:
              - entity: binary_sensor.arrosage_session_en_cours
                state: "on"
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: section_header
                  name: 🧾 Session

                - type: custom:button-card
                  template: carte_arrosage_session_synthese_xl
                  entity: sensor.arrosage_session_etat

          # =========================================================
          # 🛠️ Exécution — l'acte, sa preuve et la trace du dernier cycle
          # =========================================================
          - type: custom:button-card
            template: section_header
            name: 🛠️ Exécution

          - type: custom:button-card
            template: status_72_on_off
            entity: switch.rain_bird_bat_bt_2_e9a3_station_1
            name: Station 1 active
            icon: mdi:sprinkler-variant

          - type: custom:button-card
            template: carte_arrosage_dernier_arrosage_synthese_xl
            entity: sensor.arrosage_dernier_effectif
