button_card_templates: !include_dir_merge_named /config/19_button_card_templates

views:
  - badges:
      - type: custom:button-card
        template: bouton_accueil_badge_carre

      - type: custom:button-card
        template: bouton_navigation_badge_carre

      - type: custom:button-card
        template: bouton_navigation_badge_carre
        name: Téléphones
        icon: mdi:cellphone-cog
        tap_action:
          action: navigate
          navigation_path: /reglages-telephones-dashboard

      - type: custom:button-card
        template: bouton_navigation_badge_carre
        name: ID
        icon: mdi:numeric
        tap_action:
          action: navigate
          navigation_path: /id-automatisations-dashboard

    ########################################################
    # 🧱 VERTICAL STACK PRINCIPAL
    ########################################################
    cards:
      - type: vertical-stack
        cards:
          - !include ../../includes/cartes/systeme/systeme_stable.yaml

          ####################################################
          # 🍓 RASPBERRY PI
          ####################################################
          - type: custom:button-card
            template: section_header
            name: 🍓 Raspberry Pi

          # --- Sous-titre Raspberry Pi ---
          - type: grid
            columns: 2
            square: false
            cards:
              # Uptime
              - type: custom:button-card
                template: socle_kpi
                entity: sensor.uptime_jours
                name: Uptime
                icon: mdi:clock-outline

              # Internet
              - type: custom:button-card
                template: carte_etat_internet
                entity: binary_sensor.internet_disponible
                name: Internet
                icon: mdi:web

          - type: grid
            columns: 4
            square: false
            cards:
              # Supervisor CPU (météo interne)# Supervisor CPU (KPI lissé / courbe brute)
              - type: custom:button-card
                template: socle_kpi
                entity: sensor.cpu_moyenne_10_min_supervisor
                name: Supervisor CPU
                icon: mdi:chip
                tap_action:
                  action: more-info
                  entity: sensor.home_assistant_supervisor_cpu_percent

              # Supervisor RAM (KPI lissé / courbe brute)
              - type: custom:button-card
                template: socle_kpi
                entity: sensor.memoire_moyenne_10_min_supervisor
                name: Supervisor RAM
                icon: mdi:memory
                tap_action:
                  action: more-info
                  entity: sensor.home_assistant_supervisor_memory_percent

              # Core CPU (KPI lissé / courbe brute)
              - type: custom:button-card
                template: socle_kpi
                entity: sensor.cpu_moyenne_10_min_core
                name: Core CPU
                icon: mdi:chip
                tap_action:
                  action: more-info
                  entity: sensor.home_assistant_core_cpu_percent

              # Core RAM (KPI lissé / courbe brute)
              - type: custom:button-card
                template: socle_kpi
                entity: sensor.memoire_moyenne_10_min_core
                name: Core RAM
                icon: mdi:memory
                tap_action:
                  action: more-info
                  entity: sensor.home_assistant_core_memory_percent

          # 🧠 Arsenal Self Audit — Statut synthétique
          - type: custom:button-card
            template: arsenal_self_audit_status_card

          ####################################################
          # 🩺 SYSTÈMES CRITIQUES
          ####################################################
          - type: custom:button-card
            template: section_header
            name: 🩺 Systèmes critiques

          - type: grid
            columns: 4
            square: false
            cards:
              # État secteur
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.coupure_secteur
                name: Secteur
                icon: mdi:power-plug

              # UPS
              - type: custom:button-card
                template: ups_status_72
                entity: binary_sensor.critere_ups_sur_batterie
                name: UPS
                tap_action:
                  action: navigate
                  navigation_path: /ups-dashboard

              # Bluetti – Energie chaudière
              - type: custom:button-card
                template: carte_bluetti_energie_chaudiere
                tap_action:
                  action: navigate
                  navigation_path: /bluetti-dashboard

              # Batteries
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.batterie_a_remplacer
                name: Batteries
                icon: mdi:battery-alert
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-batteries-dashboard
                hold_action:
                  action: more-info

          # Boiler Bridge & Rain Bird – Santé (côte à côte)
          - type: grid
            columns: 2
            square: false
            cards:
              # Boiler Bridge – Santé
              - type: custom:button-card
                template: boiler_status_health
                entity: sensor.boiler_bridge_sante
                name: Boiler Bridge
                icon: mdi:lan-connect
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-boiler-dashboard

              # Rain Bird – Santé du pont
              - type: custom:button-card
                template: rain_bird_status_health
                entity: sensor.rain_bird_pont_sante
                name: Rain Bird
                icon: mdi:lan-connect
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-rain-bird-dashboard

          ####################################################
          # ⚠️ AUTOMATISATIONS DÉSACTIVÉES
          ####################################################

          - !include ../../includes/cartes/systeme/automatisations_desactivees.yaml

          ####################################################
          # 📡 CONNECTIVITÉ
          ####################################################
          - type: custom:button-card
            template: section_header
            name: 📡 Connectivité

          - type: grid
            columns: 4
            square: false
            cards:
              # Zigbee
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.zigbee_qualite_radio_degradee
                name: Zigbee
                icon: mdi:zigbee
                state_display: >
                  [[[
                    return entity.state === "on" ? "Dégradé" : "Normal";
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-zigbee-dashboard
                hold_action:
                  action: more-info

              # Bluetooth
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.bluetooth_qualite_radio_degradee
                name: Bluetooth
                icon: mdi:bluetooth
                state_display: >
                  [[[
                    return entity.state === "on" ? "Dégradé" : "Normal";
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-bluetooth-dashboard
                hold_action:
                  action: more-info

              # WiFi
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.netatmo_wifi_degrade
                name: WiFi
                icon: mdi:wifi
                state_display: >
                  [[[
                    return entity.state === "on" ? "Dégradé" : "Normal";
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-netatmo-wifi-dashboard

              # RF
              - type: custom:button-card
                template: carte_alerte_binaire_critique
                entity: binary_sensor.netatmo_rf_degrade
                name: RF
                icon: mdi:radio-tower
                state_display: >
                  [[[
                    return entity.state === "on" ? "Dégradé" : "Normal";
                  ]]]
                tap_action:
                  action: navigate
                  navigation_path: /diagnostics-netatmo-dashboard

          - type: custom:button-card
            template: ping_lan_synthese

          ####################################################
          # 🌐 INTÉGRATIONS CRITIQUES
          ####################################################
          - type: custom:button-card
            template: section_header
            name: 🌐 Intégrations

          # ⚠️ Contrat resilience_integrations.md v2.4 §12.5 (R-UI-1).
          # Le domaine `homekit_controller` porte TROIS entrées : une
          # carte par entrée, aucune ne prétendant couvrir l'ensemble.
          # C'est ce qui satisfait R-UI-1 — pas un intitulé de section.
          #
          # 🚫 PAS DE SOUS-EN-TÊTE ICI. Un second `section_header` sous
          # celui d'« Intégrations » aurait le même poids visuel que
          # lui : il n'exprimerait aucune subordination et suggérerait
          # une hiérarchie fausse entre deux niveaux de même rang.
          # Le regroupement des trois entrées est porté par la grille
          # dédiée et par les icônes, pas par un titre.
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.homekit_station_enfants_age_donnees
                name: Enfants
                icon: mdi:home-thermometer-outline
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_homekit_station_enfants
                triggers_update:
                  - sensor.couleur_age_homekit_station_enfants

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.homekit_station_salle_de_jeux_age_donnees
                name: Salle Jeux
                icon: mdi:home-thermometer-outline
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_homekit_station_salle_de_jeux
                triggers_update:
                  - sensor.couleur_age_homekit_station_salle_de_jeux

              # Entrée « Prise Control » (pont volets) — couleur TROIS AXES
              # (fraîcheur inapplicable ici : disponibilité + échec de config).
              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.homekit_prise_control_age_donnees
                name: Volets
                icon: mdi:window-shutter
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_sante_homekit_prise_control
                triggers_update:
                  - sensor.couleur_sante_homekit_prise_control

          # Les deux périmètres SwitchBot, en grille de 2 colonnes : ce
          # sont les libellés les plus longs de la section, et une demi-
          # largeur garantit qu'ils tiennent. Scission du 2026-08-24 —
          # deux intégrations, deux modes de défaillance, deux jeux d'axes.
          - type: grid
            columns: 2
            square: false
            cards:
              # Pas de couleur de fraîcheur ici : l'axe est inapplicable
              # (Meters en push sur changement). La couleur porte la
              # DISPONIBILITÉ, seul axe câblé de ce périmètre.
              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.switchbot_ble_age_donnees
                name: SwitchBot BLE
                icon: mdi:bluetooth-connect
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_sante_switchbot_ble
                triggers_update:
                  - sensor.couleur_sante_switchbot_ble

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.switchbot_cloud_age_donnees
                name: SwitchBot Cloud
                icon: mdi:cloud-outline
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_switchbot_cloud
                triggers_update:
                  - sensor.couleur_age_switchbot_cloud

          # Les cinq autres : libellés courts, 5 colonnes.
          - type: grid
            columns: 5
            square: false
            cards:
              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.netatmo_age_donnees
                name: Netatmo
                icon: mdi:cloud-outline
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_netatmo
                triggers_update:
                  - sensor.couleur_age_netatmo

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.fujitsu_age_donnees
                name: Fujitsu
                icon: mdi:air-conditioner
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_fujitsu
                triggers_update:
                  - sensor.couleur_age_fujitsu

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.petite_maison_cumulus_age_donnees
                name: Cumulus
                icon: mdi:water-boiler
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_cumulus
                triggers_update:
                  - sensor.couleur_age_cumulus

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.synology_age_donnees
                name: Synology
                icon: mdi:nas
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_synology
                triggers_update:
                  - sensor.couleur_age_synology

              - type: custom:button-card
                template: kpi_no_action
                entity: sensor.audi_age_donnees
                name: Audi
                icon: mdi:car
                variables:
                  ui_profile: arsenal
                  couleur: sensor.couleur_age_audi
                triggers_update:
                  - sensor.couleur_age_audi

          ####################################################
          # 🌡️ NETATMO
          ####################################################
          - type: custom:button-card
            template: section_header
            name: 🌡️ Netatmo

          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: netatmo_diagnostic
                entity: sensor.diagnostic_netatmo_enfants
                name: Netatmo – Enfants

              - type: custom:button-card
                template: netatmo_diagnostic
                entity: sensor.diagnostic_netatmo_salle_de_jeux
                name: Netatmo – Salle de Jeux
