# ==========================================================
# 🤖 ARSENAL — DASHBOARD : Aspirateur
# ----------------------------------------------------------
# 🎯 RÔLE
#   Porter l'interface opérationnelle du domaine Aspirateur :
#   état, composition d'une intention, raccourcis, lancement
#   confirmé, conduite d'une mission ouverte, entretien.
#
# 🧭 ACCÈS
#   Tuile « Aspirateur » du dashboard Navigation, ligne 4,
#   colonne 4 — un raccourci, et rien d'autre.
#   Badges de retour : Accueil et Navigation.
#
# 🗺️ DEUX ÉCRANS, UN BANDEAU
#   Le domaine porte un second écran, `/aspirateur-carte-dashboard`,
#   consacré aux cartes du robot. Les deux se rejoignent par le
#   bandeau `includes/navigation/aspirateur.yaml`, inclus en tête de
#   chacun — patron du domaine Voiture, sans variante.
#
# 🧱 SQUELETTE PUR
#   Aucun template Jinja ici : toute la logique de rendu vit dans
#   l'include de contenu, comme dans tous les dashboards Arsenal.
# ==========================================================

button_card_templates: !include_dir_merge_named /config/19_button_card_templates

views:
  - badges: !include ../../includes/badges/base.yaml

    cards:
      - type: vertical-stack
        cards:
          - !include ../../includes/navigation/aspirateur.yaml

          - !include ../../includes/cartes/aspirateur/panneau_operationnel.yaml
