button_card_templates: !include_dir_merge_named /config/19_button_card_templates

views:
  - badges:
      - type: custom:button-card
        template: bouton_accueil_badge_carre

      - type: custom:button-card
        template: bouton_navigation_badge_carre

      - type: custom:button-card
        template: bouton_parametres_badge_carre
        tap_action:
          action: navigate
          navigation_path: /reglages-vmc-dashboard

      - type: custom:button-card
        template: bouton_diagnostics_badge_carre
        tap_action:
          action: navigate
          navigation_path: /diagnostics-vmc-dashboard

    ########################################################
    # 🧩 VERTICAL STACK PRINCIPAL
    ########################################################
    cards:
      - type: vertical-stack
        cards:
          ####################################################
          # 💨 ÉTAT GÉNÉRAL
          ####################################################
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: section_header
                name: 💨 État général

              - type: custom:button-card
                template: carte_mode_binaire_interprete
                entity: input_boolean.vmc_haute_vitesse
                name: VMC
                icon: mdi:fan
                tap_action: none
                variables:
                  label_on: High
                  label_off: Normal
                  color_on: rgba(244, 67, 54, 0.2)
                  color_off: rgba(76, 175, 80, 0.2)

          ####################################################
          # 🎛️ AUTORITÉ & REPRISE EN MAIN  (pilote C36)
          # ----------------------------------------------------------
          # Squelette pur : composition de templates 15_autorite/.
          # Un SÉLECTEUR D'AUTORITÉ en tête (toujours visible) ; en
          # dessous, le contenu s'ADAPTE au titulaire réel :
          #   • manuel → vos contrôles (sélecteur de vitesse + décision
          #     exécutoire) ;
          #   • auto   → le diagnostic qui justifie la décision d'Arsenal
          #     (décision + conditions actuelles).
          # Le sélecteur écrit le porteur d'INTENTION ; une automation le
          # traduit en primitive supervisée (vmc_entrer_mode_manuel /
          # vmc_revenir_mode_automatique). Aucune commande relais, aucune
          # écriture directe du titulaire depuis l'UI.
          # La section Historique (plus bas) reste visible dans les deux
          # régimes.
          ####################################################
          - type: vertical-stack
            cards:
              - type: custom:button-card
                template: section_header
                name: 🎛️ Autorité & reprise en main

              # Sélecteur d'autorité — écrit l'INTENTION
              # (input_select.vmc_autorite_intention) ; coloré par le
              # titulaire RÉEL : bleu = Arsenal (auto), orange = vous (manuel).
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:button-card
                    template: carte_action_vmc_autorite
                    entity: input_select.vmc_autorite_intention
                    name: Automatique
                    icon: mdi:robot-outline
                    variables:
                      intention: automatique
                      confirmation: >-
                        Rendre le contrôle de la VMC à Arsenal (mode automatique) ?
                  - type: custom:button-card
                    template: carte_action_vmc_autorite
                    entity: input_select.vmc_autorite_intention
                    name: Manuel
                    icon: mdi:hand-back-right
                    variables:
                      intention: manuel
                      confirmation: >-
                        Prendre le contrôle manuel de la VMC ?

              # --------------------------------------------------
              # MANUEL → vos contrôles
              # --------------------------------------------------
              - type: conditional
                conditions:
                  - entity: input_select.vmc_titulaire_autorite
                    state: manuel
                card:
                  type: vertical-stack
                  cards:
                    # Sélecteur de vitesse — un tap change la main dans la
                    # vitesse choisie. La vitesse active est surlignée (vert
                    # canon / gras) ; la vitesse est portée par l'icône + le libellé.
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:button-card
                          template: carte_action_vmc_mode
                          entity: script.vmc_entrer_mode_manuel
                          name: Basse
                          icon: mdi:fan
                          variables:
                            consigne: basse
                            confirmation: >-
                              Passer la VMC en basse vitesse (contrôle manuel) ?
                        - type: custom:button-card
                          template: carte_action_vmc_mode
                          entity: script.vmc_entrer_mode_manuel
                          name: Haute
                          icon: mdi:fan-chevron-up
                          variables:
                            consigne: haute
                            confirmation: >-
                              Passer la VMC en haute vitesse (contrôle manuel) ?

                    # Décision exécutoire (lecture seule) — votre consigne,
                    # imposée à l'exécution (anti-fallback « Indéterminée »).
                    - type: custom:button-card
                      template: carte_vmc_decision_commandee
                      entity: binary_sensor.vmc_haute_vitesse_commandee

              # --------------------------------------------------
              # AUTO → le diagnostic qui justifie la décision d'Arsenal
              # --------------------------------------------------
              - type: conditional
                conditions:
                  - entity: input_select.vmc_titulaire_autorite
                    state: automatique
                card:
                  type: vertical-stack
                  cards:
                    # Décision d'Arsenal (en auto, requise == commandée).
                    - type: custom:button-card
                      template: carte_vmc_haute_vitesse_requise
                      entity: binary_sensor.vmc_haute_vitesse_requise
                      name: Décision d'Arsenal

                    # ==========================================
                    # ⚙️ CONDITIONS ACTUELLES (auto) — le « pourquoi »
                    # ==========================================
                    - !include ../../includes/section_headers/conditions_actuelles.yaml

                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:button-card
                          template: vmc_capteur
                          entity: sensor.humidite_relative_sdb_parents
                          name: SDB Parents
                          variables:
                            piece: sdb_parents

                        - type: custom:button-card
                          template: vmc_capteur
                          entity: sensor.humidite_relative_sdb_enfants
                          name: SDB Enfants
                          variables:
                            piece: sdb_enfants

                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:button-card
                          template: vmc_capteur
                          entity: sensor.co2_sejour
                          name: CO₂ Séjour
                          variables:
                            piece: co2

                        # §10.5 — contexte NON DECISIONNEL, presente comme tel.
                        # Ce verdict n'entre dans AUCUNE decision VMC depuis L7.2 ;
                        # le libeller « extraction utile / inutile » laissait croire
                        # l'inverse.
                        - type: custom:button-card
                          template: carte_etat_binaire_interprete_inverse
                          entity: binary_sensor.delta_ha_favorable_etage
                          name: Air extérieur
                          icon: mdi:weather-windy
                          tap_action: none
                          variables:
                            label_on: Plus humide dehors
                            label_off: Plus sec dehors

          ####################################################
          # 📝 HISTORIQUE (les deux régimes)
          ####################################################
          - type: vertical-stack
            cards:
              - !include ../../includes/section_headers/historique.yaml

              - type: history-graph
                entities:
                  - entity: input_boolean.vmc_haute_vitesse
