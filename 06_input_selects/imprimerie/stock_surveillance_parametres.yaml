# ==========================================================
# 🧠 ARSENAL — INPUT_SELECT
#     Imprimerie — Surveillance d'ambiance des stocks — Paramètres
# ----------------------------------------------------------
# 🎯 RÔLE
#   Porter les paramètres RÉGLABLES de la surveillance
#   d'ambiance des zones de stockage (Stock carton, Stock
#   produits finis) : seuils critiques communs aux deux zones,
#   durée critique hors plage, durée critique d'indisponibilité.
#
# 🧩 PÉRIMÈTRE
#   - Stockage de sélection persistante uniquement
#   - Aucune logique métier locale
#   - Aucun comportement autonome
#   - Aucune action directe sur un équipement
#
# 🔖 NATURE
#   Sélection utilisateur — paramètres réglables opérateur
#
# 📜 CONTRAT
#   00_documentation_arsenal/contrats/imprimerie/surveillance_ambiance_stock.md
#   Valeurs de référence : conditions de stockage déclarées
#   (10–35 °C ; 30–80 % HR ; 24 h ; indisponibilité 2 h).
#
# 🔒 PERSISTANCE — BOOTSTRAP DE PREMIÈRE CRÉATION
#   PAS de clé `initial:` (doctrine restauration_etat_helpers.md,
#   R01) : la valeur réglée par l'opérateur est restaurée par
#   Home Assistant à chaque redémarrage.
#
#   La PREMIÈRE option de chaque liste est la valeur de
#   référence : c'est la valeur native d'un input_select au tout
#   premier démarrage (comportement HA : options[0] quand aucun
#   état n'est restaurable, ou si l'état restauré n'appartient
#   plus aux options). Aucune fenêtre ne place donc un seuil ou
#   une durée à une valeur arbitraire au premier déploiement.
#   Même patron « bootstrap ≠ fallback » que vmc.md §16.4.
#
#   ⚠️ L'ordre des options est donc PORTEUR : la valeur de
#   référence reste en tête, les autres suivent par ordre
#   croissant. Ne pas trier la liste.
#
# 📋 OPTIONS
#   Valeurs numériques (°C, % HR, heures). Réglage par paliers :
#   une valeur absente de la liste s'ajoute par PR, avec revue
#   des consommateurs.
#   Les plages des seuils bas et hauts sont DISJOINTES : un seuil
#   bas supérieur ou égal au seuil haut est impossible par
#   construction.
#
# 🔗 CONSOMMATEURS
#   - 12_template_sensors/imprimerie/stock/surveillance.yaml
#   - 12_template_sensors/imprimerie/stock/depassement_prolonge.yaml
#   - 12_template_sensors/imprimerie/stock/mesure_indisponible.yaml
#   - 10_scripts/imprimerie/stock_surveillance_notifier.yaml
#   Valeur illisible ⇒ abstention explicite (paramètres
#   indisponibles), jamais une valeur de repli.
#
# 🚫 INTERDITS
#   - Confondre ces seuils avec les seuils statistiques
#     dynamiques (`*_seuil_bas_*` / `*_seuil_haut_*`)
#   - Trier les options (la première est la valeur de référence)
#   - Ajouter une clé `initial:`
#   - Dupliquer ces paramètres par zone sans décision contractuelle
#   - Constituer à lui seul une autorité décisionnelle
#
# 🏷️ STATUT
#   Socle — surveillance d'ambiance des stocks v1.0
# ==========================================================

