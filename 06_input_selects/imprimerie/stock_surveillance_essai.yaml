# ==========================================================
# 🧠 ARSENAL — INPUT_SELECT
#     Imprimerie — Surveillance d'ambiance des stocks — Essai
# ----------------------------------------------------------
# 🎯 RÔLE
#   Porter la phase de l'ESSAI de la chaîne d'alarme. La voie
#   d'essai (`essai_stock`) passe par les MÊMES templates de
#   décision, la MÊME automatisation et le MÊME script de
#   notification que les voies réelles, avec une valeur SIMULÉE
#   dérivée des seuils de production (lus, jamais écrits).
#
# 🧩 PÉRIMÈTRE
#   - Stockage de sélection persistante uniquement
#   - Aucune logique métier locale
#   - Aucun comportement autonome
#   - Aucune action directe sur un équipement
#
# 🔖 NATURE
#   Commutateur de service — phase d'essai
#
# 📋 OPTIONS
#   - inactif    : aucun essai ; la voie d'essai est inerte
#   - hors_plage : valeur simulée = seuil critique haut + 1 °C
#   - invalide   : valeur simulée absente (non numérique)
#   - dans_plage : valeur simulée = milieu de la plage
#
# 🔒 PERSISTANCE
#   PAS de clé `initial:`. Première valeur au tout premier
#   démarrage = `inactif` (première option). Tout état autre que
#   `inactif` est remis à `inactif` par l'automation
#   10180000000007 au démarrage de Home Assistant et dès que le
#   script d'essai s'arrête (fin normale ou interruption) :
#   aucun état d'essai ne survit à l'essai.
#
# 🔁 ÉCRITURE
#   script.imprimerie_stock_essai_alarme (déroulé) ;
#   automation 10180000000007 (remise à `inactif`).
#
# 🚫 INTERDITS
#   - Modifier un capteur source, un seuil ou la durée réelle
#   - Laisser une phase active hors d'un essai en cours
#   - Constituer à lui seul une autorité décisionnelle
#
# 🏷️ STATUT
#   Socle — surveillance d'ambiance des stocks v1.0
# ==========================================================

essai_alarme_stock:
  name: "Essai Alarme Stock"
  icon: mdi:test-tube
  options:
    - inactif
    - hors_plage
    - invalide
    - dans_plage
