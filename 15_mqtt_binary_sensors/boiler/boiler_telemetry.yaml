# ==========================================================
# 🧠 ARSENAL — MQTT BINARY_SENSOR
#     Boiler / Telemetry — Activité brûleur
# ----------------------------------------------------------
# 🎯 RÔLE
#   Exposer en transport passif l'état booléen d'activité
#   du brûleur publié par le bridge chaudière.
#
# 🧩 PÉRIMÈTRE
#   - Projection booléenne de transport passif uniquement
#   - Mapping direct topic → état
#   - Aucune transformation locale
#   - Aucune logique métier
#
# 🔖 NATURE
#   telemetrie_booleenne | etat_technique_externe
#
# 🆔 UNIQUE_ID
#   boiler_burner_on
#
# 📋 TRANSPORT
#   state_topic  : boilerack/telemetry/burner/state
#   namespace    : boilerack/telemetry/...
#   payload_on   : ON   (projete : valeur non nulle)
#   payload_off  : OFF  (projete : valeur nulle)
#   device_class : running
#
# 🔗 DÉPENDANCES
#   Lit : bridge chaudière via broker MQTT
#   Réf : 03_namespace_canonique.md §3.2
#
# 🚫 INTERDITS
#   - Introduire une logique metier dans le gabarit de projection
#   - Introduire une logique métier
#   - Recalculer ou dériver un état localement
#   - Constituer une autorité décisionnelle
#   - Remplacer un diagnostic Arsenal dédié
#   - Laisser payload_on / payload_off implicites
#
# 🏷️ STATUT
#   Transport — Arsenal v14.x
# ==========================================================

- name: "Boiler burner on"
  unique_id: boiler_burner_on
  default_entity_id: boiler_burner_on
  state_topic: "boilerack/telemetry/burner/state"
  # La surface amont publie un SCALAIRE NUMERIQUE, jamais "on" / "off" :
  # projection binaire de la modulation, 0.0 ou non nul. Sans ce gabarit, le
  # capteur ne s'apparierait JAMAIS et resterait fige sur sa derniere valeur
  # retenue -- une valeur plausible et fausse, sans aucun signal.
  # Projection stricte : 0 == off, toute valeur non nulle == on.
  value_template: "{{ 'ON' if (value | float(0)) != 0 else 'OFF' }}"
  payload_on: "ON"
  payload_off: "OFF"
  device_class: running
  icon: mdi:fire
