# ==========================================================
# 🧠 ARSENAL — INPUT_NUMBER
#     Arrosage — Seuils de suspension pluie
# ----------------------------------------------------------
# 🎯 RÔLE
#   Stocker les seuils ajustables (mm / heures) du diagnostic
#   de suspension pluie de l'arrosage, réglables sans
#   redéploiement.
#
# 🧩 PÉRIMÈTRE
#   - Stockage persistant uniquement
#   - Paramètres de prudence (suspension), pas des preuves
#   - Valeurs en millimètres (cumuls) ou heures (horizon)
#   - Aucun calcul
#   - Aucune logique métier locale
#   - Aucun comportement autonome
#
# 🏷️ NATURE
#   Paramètre métier | Seuil de prudence
#
# 🧱 VALEURS PAR DÉFAUT (candidates calibrables — cf. C41 / cadrage)
#   - 24 h           : 5 mm   ⚠️ RÔLE C41 : seuil d'APPORT OBSERVÉ qualifiant
#                      (nouvel apport monotone `pluie_total_local − ref`
#                      ⇒ une attente d'infiltration) — plus un verrou de fenêtre.
#   - 48 h           : 10 mm  ⚠️ C41 : DIAGNOSTIC / CONTEXTE UNIQUEMENT
#   - 72 h           : 12 mm  ⚠️ C41 : DIAGNOSTIC / CONTEXTE UNIQUEMENT
#                      (n'exercent plus de verrou opérationnel — arbitrage L3)
#   - pluie prévue   : 5 mm sur l'horizon (QUANTITÉ FUTURE UTILE, distincte du 24 h)
#   - horizon prévue : 24 h  (aussi : DÉLAI MAX d'un report — C41)
#   - crédibilité min pluie prévue : 60 %  (C41)
#   - attente d'infiltration       : 6 h   (C41)
#   - tolérance après échéance     : 3 h   (C41)
#
# 🚫 INTERDITS
#   - Confondre stockage et décision
#   - Traiter ces seuils comme des preuves absolues
#   - Déclencher directement une suspension ou un arrosage
#   - Écrire sans traçabilité vers l'auteur de l'écriture
#
# 🏷️ STATUT
#   Socle arrosage — Arsenal v14.x
# ==========================================================

arrosage_pluie_suspension_mm_24h:
  name: "Arrosage — Seuil suspension pluie 24h"
  icon: mdi:weather-rainy
  min: 0
  max: 50
  step: 0.5
  # ⚠️ PAS de clé `initial` : elle désactive la restauration HA et reforcerait
  #    ce seuil AJUSTABLE à sa valeur d'usine à CHAQUE redémarrage, écrasant le
  #    réglage opérateur. Sans `initial`, HA restaure la dernière valeur réglée.
  #    Défaut métier : 5 mm (cf. en-tête).
  unit_of_measurement: mm
  mode: box

arrosage_pluie_suspension_mm_48h:
  name: "Arrosage — Seuil suspension pluie 48h"
  icon: mdi:weather-pouring
  min: 0
  max: 50
  step: 0.5
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Seuil AJUSTABLE — défaut métier : 10 mm (cf. en-tête).
  unit_of_measurement: mm
  mode: box

arrosage_pluie_suspension_mm_72h:
  name: "Arrosage — Seuil suspension pluie 72h"
  icon: mdi:weather-pouring
  min: 0
  max: 50
  step: 0.5
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Seuil AJUSTABLE — défaut métier : 12 mm (cf. en-tête).
  unit_of_measurement: mm
  mode: box

arrosage_pluie_prevue_mm_seuil:
  name: "Arrosage — Seuil pluie prévue"
  icon: mdi:weather-partly-rainy
  min: 0
  max: 50
  step: 0.5
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Seuil AJUSTABLE — défaut métier : 5 mm (cf. en-tête).
  unit_of_measurement: mm
  mode: box

arrosage_pluie_prevue_horizon_heures:
  name: "Arrosage — Horizon pluie prévue"
  icon: mdi:clock-outline
  min: 1
  max: 48
  step: 1
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Horizon AJUSTABLE — défaut métier : 24 h (cf. en-tête).
  #    C41 : sert aussi de DÉLAI MAX d'un report (onset ≤ horizon).
  unit_of_measurement: h
  mode: box

# ==========================================================
# C41 — Arbitrage pluie ↔ besoin (contrat 20). Candidats calibrables.
# Aucun `initial` (restauration HA) ; valeurs de départ documentées en en-tête.
# ==========================================================
arrosage_pluie_prevue_credibilite_min_pct:
  name: "Arrosage — Crédibilité min pluie prévue"
  icon: mdi:percent-outline
  min: 0
  max: 100
  step: 5
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Crédibilité minimale (min proba du préfixe qualifiant) — candidat : 60 %.
  unit_of_measurement: "%"
  mode: box

arrosage_pluie_attente_infiltration_heures:
  name: "Arrosage — Attente d'infiltration"
  icon: mdi:timer-sand
  min: 0
  max: 48
  step: 1
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Durée bornée d'attente après un apport observé qualifiant — candidat : 6 h.
  unit_of_measurement: h
  mode: box

arrosage_pluie_prevue_tolerance_echeance_heures:
  name: "Arrosage — Tolérance après échéance"
  icon: mdi:clock-alert-outline
  min: 0
  max: 24
  step: 1
  # ⚠️ PAS de clé `initial` : voir arrosage_pluie_suspension_mm_24h.
  #    Grâce après l'échéance qualifiée avant expiration du report — candidat : 3 h.
  unit_of_measurement: h
  mode: box
