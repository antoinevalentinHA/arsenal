# ==========================================================
# 🧠 ARSENAL — TEMPLATE UI METIER
#     VMC — Sélecteur de vitesse (autorité C36)
# ==========================================================
#
# 📌 STATUT
#     TEMPLATE UI METIER
#
# 🎯 ROLE
#     Un élément du SÉLECTEUR DE VITESSE de la reprise en main. Un tap
#     prend / change la main dans la vitesse portée par variables.consigne,
#     en déléguant à la primitive supervisée script.vmc_entrer_mode_manuel
#     (contrat vmc.md §16) : valider → écrire consigne → transférer
#     l'autorité. Fonctionne dans les deux régimes (auto → prise de
#     contrôle ; manuel → changement de vitesse). Idempotent.
#
# 🧱 NATURE
#     - Template button-card, spécialisation de carte_base_v2
#     - UI uniquement : n'écrit NI helper, NI relais. Seule frontière =
#       la primitive supervisée (écrivain unique, §16).
#
# 🎨 SEMANTIQUE (palette de base, usage BINAIRE — cf. ui/couleurs/02_palette.md)
#     - vitesse ACTIVE **en régime manuel** (= la vitesse que vous avez choisie)
#         -> 🟢 vert rgba(76,175,80,0.2) (action autorisée / actif)
#     - tout le reste (l'autre vitesse, ou n'importe quelle vitesse en régime auto)
#         -> ⚪ gris neutre rgba(158,158,158,0.2)
#     Le vert n'apparaît QUE si le titulaire est manuel : en auto, aucune
#     vitesse n'est verte (vous ne décidez pas). La vitesse (basse/haute)
#     est portée par l'ICÔNE + le libellé.
#
# 🔗 DEPENDANCES
#     - entity   : script.vmc_entrer_mode_manuel (feedback d'état)
#     - service  : script.vmc_entrer_mode_manuel
#     - variables.consigne     : 'basse' | 'haute'
#     - variables.confirmation : texte de confirmation modale
#     - lecture d'état : binary_sensor.vmc_haute_vitesse_commandee (surlignage
#                        de la vitesse active — restitution d'état, aucune décision UI ;
#                        on = haute, off = basse)
#
# ⚠️ CONTRAINTES
#     - Confirmation modale OBLIGATOIRE (§16)
#     - N'expose JAMAIS de commande relais VMC
#     - La consigne est passée à la primitive, jamais écrite dans
#       le helper de consigne par l'UI
#
# 🔗 SATELLITE DE : carte_base_v2
# ==========================================================

carte_action_vmc_mode:
  template: carte_base_v2

  show_state: false
  show_icon: true
  show_name: true
  color_type: card

  tap_action:
    action: call-service
    service: script.vmc_entrer_mode_manuel
    confirmation:
      text: >
        [[[
          return variables?.confirmation
            || "Commander la VMC (contrôle manuel) ?";
        ]]]
    service_data:
      consigne: '[[[ return variables.consigne ]]]'

  styles:
    icon:
      - color: '#111'
    name:
      - color: '#111'
      - font-size: 12px
      - font-weight: >
          [[[
            const st = states['binary_sensor.vmc_haute_vitesse_commandee']
              ? states['binary_sensor.vmc_haute_vitesse_commandee'].state : null;
            const tit = states['input_select.vmc_titulaire_autorite']
              ? states['input_select.vmc_titulaire_autorite'].state : null;
            const cur = st === 'on' ? 'haute' : (st === 'off' ? 'basse' : null);
            return (tit === 'manuel' && cur === variables.consigne) ? '700' : '400';
          ]]]
    card:
      - background-color: >
          [[[
            const st = states['binary_sensor.vmc_haute_vitesse_commandee']
              ? states['binary_sensor.vmc_haute_vitesse_commandee'].state : null;
            const tit = states['input_select.vmc_titulaire_autorite']
              ? states['input_select.vmc_titulaire_autorite'].state : null;
            const cur = st === 'on' ? 'haute' : (st === 'off' ? 'basse' : null);
            // Binaire : vert = votre vitesse active EN MANUEL ; gris neutre sinon.
            if (tit === 'manuel' && cur === variables.consigne) return 'rgba(76, 175, 80, 0.2)';
            return 'rgba(158, 158, 158, 0.2)';
          ]]]
