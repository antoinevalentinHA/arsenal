# ==========================================================
# 🧠 ARSENAL — TEMPLATE UI METIER
#     Déshumidificateur — Décision exécutoire (autorité de domaine, C40)
# ==========================================================
#
# 📌 STATUT
#     TEMPLATE UI METIER
#
# 🎯 ROLE
#     Afficher la DÉCISION EXÉCUTOIRE UNIQUE du déshumidificateur
#     (sensor.deshumidificateur_etat_commande, contrat
#     deshumidificateur/autorite_de_domaine.md §2) : l'état réellement commandé,
#     tous régimes confondus (auto → décision auto publiée ; manuel → consigne).
#     Lecture seule — aucune interaction, aucune décision locale (le backend
#     décide ; l'UI traduit).
#
# 🧱 NATURE
#     - Template button-card, spécialisation de socle_decision_72
#     - UI uniquement
#
# 🎨 SEMANTIQUE (palette de base, usage BINAIRE — cf. ui/couleurs/02_palette.md ;
#     l'état est porté par le libellé + l'icône)
#     - état actif SOUS CONTRÔLE MANUEL -> 🟢 vert rgba(76,175,80,0.2) (votre consigne active)
#     - état automatique                -> ⚪ gris neutre rgba(158,158,158,0.2)
#     - indéterminée (indispo)          -> ⚪ gris indispo rgba(158,158,158,0.1) (prioritaire)
#
# 🚫 ANTI-FALLBACK (§2)
#     Une décision exécutoire indisponible s'affiche « Indéterminée » : JAMAIS
#     traduite en un état. La décision automatique théorique reste portée par
#     binary_sensor.deshumidificateur_cave_demarrage_recommande.
#
# 🔗 DEPENDANCES
#     - entity : sensor.deshumidificateur_etat_commande
#
# 🧩 USAGE
#     type: custom:button-card
#     template: carte_deshum_decision_commandee
#     entity: sensor.deshumidificateur_etat_commande
#
# 🔗 SATELLITE DE : socle_decision_72
# ==========================================================

carte_deshum_decision_commandee:
  template: socle_decision_72

  name: Décision exécutoire

  variables:
    diag: |
      [[[
        const state = entity?.state;
        const UNAV = ['unknown', 'unavailable', undefined, null, 'none', ''];

        const category = (() => {
          if (UNAV.includes(state)) return 'indispo';
          if (state === 'on') return 'on';
          if (state === 'off') return 'off';
          return 'indispo';
        })();

        const bg = (() => {
          // Palette de base, usage BINAIRE :
          //   🟢 vert = décision exécutoire SOUS CONTRÔLE MANUEL (votre consigne active)
          //   ⚪ gris neutre = état automatique (aucune reprise en main)
          //   ⚪ gris indispo = indéterminée (prioritaire)
          // L'état (marche/arrêt) est porté par le libellé.
          if (category === 'indispo') return 'rgba(158, 158, 158, 0.1)';
          const tit = states['input_select.deshumidificateur_titulaire_autorite']
            ? states['input_select.deshumidificateur_titulaire_autorite'].state : null;
          if (tit === 'manuel') return 'rgba(76, 175, 80, 0.2)';
          return 'rgba(158, 158, 158, 0.2)';
        })();

        const stateText = (() => {
          if (category === 'on') return 'Marche commandée';
          if (category === 'off') return 'Arrêt commandé';
          return 'Indéterminée';
        })();

        const labelText = (() => {
          if (category === 'indispo') return 'Décision exécutoire indisponible';
          return 'État imposé à l\'exécution';
        })();

        return { category, bg, stateText, labelText };
      ]]]

  state_display: |
    [[[
      return variables.diag.stateText;
    ]]]

  label: |
    [[[
      return variables.diag.labelText;
    ]]]

  icon: |
    [[[
      return variables.diag.category === 'off'
        ? 'mdi:air-humidifier-off' : 'mdi:air-humidifier';
    ]]]

  styles:
    card:
      - background-color: |
          [[[
            return variables.diag.bg;
          ]]]
