# ==========================================================
# 🧠 ARSENAL — TEMPLATE UI METIER
#     Chauffage — Décision exécutoire (autorité de domaine, C39)
# ==========================================================
#
# 📌 STATUT
#     TEMPLATE UI METIER
#
# 🎯 ROLE
#     Afficher la DÉCISION EXÉCUTOIRE UNIQUE du chauffage
#     (sensor.chauffage_mode_commande, contrat 85 §85.2) : le régime
#     réellement commandé, tous régimes confondus (auto → décision
#     automatique ; manuel → consigne). Lecture seule — aucune interaction,
#     aucune décision locale (le backend décide ; l'UI traduit).
#
# 🧱 NATURE
#     - Template button-card, spécialisation de socle_decision_72
#     - UI uniquement
#
# 🎨 SEMANTIQUE (palette de base, usage BINAIRE — cf. ui/couleurs/02_palette.md ;
#     le régime est porté par le libellé + l'icône)
#     - régime actif SOUS CONTRÔLE MANUEL -> 🟢 vert rgba(76,175,80,0.2) (votre consigne active)
#     - régime automatique                -> ⚪ gris neutre rgba(158,158,158,0.2)
#     - indéterminée (indispo)            -> ⚪ gris indispo rgba(158,158,158,0.1) (prioritaire)
#
# 🚫 ANTI-FALLBACK (§85.2)
#     Une décision exécutoire indisponible s'affiche « Indéterminée » :
#     JAMAIS traduite en un régime. La décision automatique théorique reste
#     portée par sensor.chauffage_mode_calcule / programme_chauffage.
#
# 🔗 DEPENDANCES
#     - entity : sensor.chauffage_mode_commande
#
# 🧩 USAGE
#     type: custom:button-card
#     template: carte_chauffage_decision_commandee
#     entity: sensor.chauffage_mode_commande
#
# 🔗 SATELLITE DE : socle_decision_72
# ==========================================================

carte_chauffage_decision_commandee:
  template: socle_decision_72

  name: Décision exécutoire
  icon: mdi:radiator

  variables:
    diag: |
      [[[
        const state = entity?.state;
        const UNAV = ['unknown', 'unavailable', undefined, null, 'none', ''];

        const category = (() => {
          if (UNAV.includes(state)) return 'indispo';
          if (state === 'confort') return 'confort';
          if (state === 'reduite') return 'reduite';
          return 'indispo';
        })();

        const bg = (() => {
          // Palette de base, usage BINAIRE :
          //   🟢 vert = décision exécutoire SOUS CONTRÔLE MANUEL (votre consigne active)
          //   ⚪ gris neutre = régime automatique (aucune reprise en main)
          //   ⚪ gris indispo = indéterminée (prioritaire)
          // Le régime (confort/réduit) est porté par le libellé.
          if (category === 'indispo') return 'rgba(158, 158, 158, 0.1)';
          const tit = states['input_select.chauffage_titulaire_autorite']
            ? states['input_select.chauffage_titulaire_autorite'].state : null;
          if (tit === 'manuel') return 'rgba(76, 175, 80, 0.2)';
          return 'rgba(158, 158, 158, 0.2)';
        })();

        const stateText = (() => {
          if (category === 'confort') return 'Confort commandé';
          if (category === 'reduite') return 'Réduit commandé';
          return 'Indéterminée';
        })();

        const labelText = (() => {
          if (category === 'indispo') return 'Décision exécutoire indisponible';
          return 'Régime imposé à l\'exécution';
        })();

        return { category, bg, stateText, labelText };
      ]]]

  state_display: |
    [[[
      return variables.diag.stateText;
    ]]]

  label: |
    [[[
      return variables.diag.labelText;
    ]]]

  styles:
    card:
      - background-color: |
          [[[
            return variables.diag.bg;
          ]]]
