# ==========================================================
# 🧠 ARSENAL — TEMPLATE UI METIER
#     Chauffage — Sélecteur de régime (autorité de domaine C39)
# ==========================================================
#
# 📌 STATUT
#     TEMPLATE UI METIER
#
# 🎯 ROLE
#     Un élément du SÉLECTEUR DE RÉGIME de la reprise en main. Un tap
#     prend / change la main dans le régime porté par variables.consigne,
#     en déléguant à la primitive supervisée script.chauffage_entrer_mode_manuel
#     (contrat 85 §85.4) : valider → écrire consigne → transférer l'autorité.
#     Fonctionne dans les deux régimes (auto → prise de contrôle ; manuel →
#     changement de régime). Idempotent.
#
# 🧱 NATURE
#     - Template button-card, spécialisation de carte_base_v2
#     - UI uniquement : n'écrit NI helper, NI exécution. Seule frontière =
#       la primitive supervisée (écrivain unique, §85.2).
#
# 🎨 SEMANTIQUE (palette de base, usage BINAIRE — cf. ui/couleurs/02_palette.md)
#     - régime ACTIF **en régime manuel** (= le régime que vous avez choisi)
#         -> 🟢 vert rgba(76,175,80,0.2) (action autorisée / actif)
#     - tout le reste (l'autre régime, ou n'importe quel régime en auto)
#         -> ⚪ gris neutre rgba(158,158,158,0.2)
#     Le vert n'apparaît QUE si le titulaire est manuel : en auto, aucun
#     régime n'est vert (vous ne décidez pas). Le régime (confort/réduit)
#     est porté par l'ICÔNE + le libellé.
#
# 🔗 DEPENDANCES
#     - entity   : script.chauffage_entrer_mode_manuel (feedback d'état)
#     - service  : script.chauffage_entrer_mode_manuel
#     - variables.consigne     : 'confort' | 'reduite'
#     - variables.confirmation : texte de confirmation modale
#     - lecture d'état : sensor.chauffage_mode_commande (surlignage du régime
#                        actif — restitution d'état, aucune décision UI)
#
# ⚠️ CONTRAINTES
#     - Confirmation modale OBLIGATOIRE (§85.4)
#     - N'expose JAMAIS de commande d'exécution chauffage
#     - La consigne est passée à la primitive, jamais écrite dans le helper
#       de consigne par l'UI
#
# 🔗 SATELLITE DE : carte_base_v2
# ==========================================================

carte_action_chauffage_mode:
  template: carte_base_v2

  show_state: false
  show_icon: true
  show_name: true
  color_type: card

  tap_action:
    action: call-service
    service: script.chauffage_entrer_mode_manuel
    confirmation:
      text: >
        [[[
          return variables?.confirmation
            || "Commander le chauffage (contrôle manuel) ?";
        ]]]
    service_data:
      consigne: '[[[ return variables.consigne ]]]'

  styles:
    icon:
      - color: '#111'
    name:
      - color: '#111'
      - font-size: 12px
      - font-weight: >
          [[[
            const cur = states['sensor.chauffage_mode_commande']
              ? states['sensor.chauffage_mode_commande'].state : null;
            const tit = states['input_select.chauffage_titulaire_autorite']
              ? states['input_select.chauffage_titulaire_autorite'].state : null;
            return (tit === 'manuel' && cur === variables.consigne) ? '700' : '400';
          ]]]
    card:
      - background-color: >
          [[[
            const cur = states['sensor.chauffage_mode_commande']
              ? states['sensor.chauffage_mode_commande'].state : null;
            const tit = states['input_select.chauffage_titulaire_autorite']
              ? states['input_select.chauffage_titulaire_autorite'].state : null;
            // Binaire : vert = votre régime actif EN MANUEL ; gris neutre sinon.
            if (tit === 'manuel' && cur === variables.consigne) return 'rgba(76, 175, 80, 0.2)';
            return 'rgba(158, 158, 158, 0.2)';
          ]]]
