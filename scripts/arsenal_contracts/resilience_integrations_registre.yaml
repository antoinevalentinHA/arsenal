    capteur_age:             { statut: present, entity_id: sensor.switchbot_cloud_age_donnees }
    binaire_gel:             { statut: present, entity_id: binary_sensor.gel_avere_switchbot_cloud }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.indisponibilite_franche_switchbot_cloud }
    binaire_retour_ok:       { statut: present, entity_id: binary_sensor.retour_ok_switchbot_cloud }
    binaire_recovery:        { statut: present, entity_id: binary_sensor.recovery_en_cours_switchbot_cloud }
    automation:              { statut: present, id: "10120000000032", alias: "Système - Relance SwitchBot Cloud", fichier: 11_automations/system/reload_integrations/switchbot_cloud.yaml }
    timer_backoff:           { statut: present, entity_id: timer.switchbot_cloud_reload_backoff }
    compteur_tentatives:     { statut: present, entity_id: input_number.switchbot_cloud_reload_tentatives }
    action_recovery:         { statut: present, type: reload_entry, via: canon }
    action_cible: group.switchbot_cloud_capteurs
