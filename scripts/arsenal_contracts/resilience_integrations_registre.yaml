# ==========================================================
#  ARSENAL — REGISTRE CI : Résilience des intégrations
#  Source d'autorité du checker check_resilience_integrations_contracts.py
#  Contrat : 00_documentation_arsenal/contrats/resilience_integrations.md (v1.1)
#
#  NATURE : données de référence CI. PAS du YAML runtime Home Assistant.
#  Aucune entité définie ici. Toutes les valeurs sont extraites du dépôt.
#
#  TYPAGE DES MAILLONS (champ 'statut', vocabulaire fermé) :
#    present                          -> existe ; entity_id renseigné
#    absent_non_conforme_temporaire   -> exigé mais absent = DETTE (cf. exceptions)
#    non_applicable                   -> hors périmètre pour ce mode (PAS une dette)
#
#  Un maillon a TOUJOURS la forme : { statut: <…>, entity_id: <id|null> }
# ==========================================================

meta:
  contrat: resilience_integrations.md
  version: "2.0"
  # v2.0 : la maille de couverture est l'ENTREE DE CONFIGURATION (§12).
  # Le registre n'a PAS encore ete migre a cette maille : il enumere
  # encore des integrations designees par un nom commercial. Dette
  # declaree et qualifiee NON BLOQUANTE au contrat (§10.1) ; le checker
  # ne sait donc pas constater une entree non couverte.
  # La maille est desormais EFFECTIVE : chaque chaine declare le domaine
  # d'integration qu'elle sert et la reference (cle secrets.yaml) de son
  # entree. Un domaine portant plusieurs chaines est ainsi visible en
  # lecture directe du registre — c'est exactement ce qui manquait quand
  # `homekit_controller` en portait trois sous une seule ligne.
  maille: entree_de_configuration
  # Controle d'ancrage : deux moities complementaires.
  #  - CI (R15) : volet statiquement decidable — aucune entite produite
  #    par les templates du depot dans un perimetre de detection.
  #  - Runtime  : `binary_sensor.ancrage_chaines_resilience_non_conforme`
  #    — appartenance reelle a une entree unique, via config_entry_id(),
  #    fonction de template donc inaccessible a l'analyse statique.
  controle_ancrage_runtime: binary_sensor.ancrage_chaines_resilience_non_conforme

  # ==========================================================
  # `entree_libelle` EST UNE ETIQUETTE HUMAINE, PAS UN TITRE D'ENTREE
  # ----------------------------------------------------------
  # Mesure du 2026-08-24 (Passe 0, editeur de modeles) : les titres
  # REELS des entrees ne ressemblent pas a ces libelles.
  #   Netatmo                -> titre reel « Home Assistant Cloud »
  #   Airstage               -> titre reel « local - <adresse materiel> »
  #   Overkiz                -> titre reel = l'adresse e-mail du compte
  #   Synology DSM           -> titre reel = le nom d'hote du NAS
  #   Les DEUX stations      -> titre reel « Weather Station » — IDENTIQUE
  #
  # Trois consequences, toutes opposables :
  #  1. Ce champ ne PEUT PAS servir de cle vers une entree. Aucun
  #     controle ne doit s'y adosser pour identifier une entree.
  #  2. Un titre d'entree n'est PAS UNIQUE (les deux stations le
  #     prouvent). Tout controle qui indexe par titre confond deux
  #     entrees sans le dire.
  #  3. Les titres reels ne sont pas recopies ici : l'un d'eux est une
  #     adresse e-mail personnelle, et ce depot est publie.
  # ==========================================================

  # ==========================================================
  # CARTOGRAPHIE DE COUVERTURE — mesure runtime du 2026-08-24
  # ----------------------------------------------------------
  # METHODE : balayage des entites -> config_entry_id -> domaine, compare
  # aux entrees effectivement couvertes par les groupes sources declares.
  #
  # ⚠️ LIMITE OPPOSABLE : ce balayage ne voit que les entrees ayant AU MOINS
  # UNE entite dans le state machine. Une entree sans aucune entite y est
  # invisible. Cette mesure peut donc TROUVER DES TROUS ; elle ne peut pas
  # PROUVER l'exhaustivite (cf. contrat §10.1).
  #
  # Etat mesure, format couvertes/presentes :
  #   netatmo             1/1
  #   fujitsu_airstage    1/1
  #   homekit_controller  3/3   <- scission du 2026-08-24 complete
  #   overkiz             1/1
  #   switchbot           4/7   <- ECART, voir la note de l'integration
  #   switchbot_cloud     1/1
  #   synology_dsm        1/1
  #   audiconnect         1/1
  #   withings            1/1
  #   mqtt                0/1   <- FAUX POSITIF de la methode : la chaine
  #                                Zigbee2MQTT est en disponibilite_native
  #                                (binaire de bridge), sans groupe source.
  #                                Le broker EST couvert, par un mecanisme
  #                                que cette mesure ne sait pas voir.
  #
  # ARBITRAGE OUVERT — que signifie « couverture » ?
  #   Le contrat ne le dit pas. Deux modeles possibles :
  #     - VOLONTAIRE : une chaine couvre exactement ce que son groupe
  #       declare. Creer un appareil ne l'integre jamais a la resilience,
  #       et rien ne le signale.
  #     - EXHAUSTIVE : une chaine doit couvrir toutes les entrees actives
  #       de son domaine ; les ecarts sont des derogations inscrites ici.
  #   Tant que ce n'est pas tranche, un « 4/7 » n'est ni conforme ni non
  #   conforme : il est INDECIDABLE au regard du contrat.
  # ==========================================================
  cartographie_couverture_date: "2026-08-24"

  # ==========================================================
  # MODELE DE COUVERTURE — arbitre le 2026-08-24 (contrat v3.0 §10.2)
  # ----------------------------------------------------------
  # EXHAUSTIVE BORNEE AVEC DEROGATIONS DECLAREES (R-COUVERTURE-1).
  #
  # Dans tout domaine portant AU MOINS UNE chaine, chaque entree active
  # est soit COUVERTE par un perimetre, soit DEROGEE ici avec motif et
  # critere de levee (R-COUVERTURE-2). Ni l'un ni l'autre = ECART.
  #
  # La regle n'impose PAS de tout remedier : une entree peut legitimement
  # n'appeler aucune remediation automatique. Elle impose que ce choix
  # soit ECRIT.
  #
  # Controle : binary_sensor.couverture_entrees_resilience_incomplete
  # (runtime, alimente par integration_entities — R-COUVERTURE-3).
  #
  # Domaines sous couverture SANS perimetre, exclus du decompte et
  # documentes comme tels : mqtt (Zigbee2MQTT, disponibilite native).
  # ==========================================================
  couverture_modele: exhaustive_bornee_avec_derogations
  couverture_controle_runtime: binary_sensor.couverture_entrees_resilience_incomplete
  mode: report-only
  vocabulaire_statut: [present, absent_non_conforme_temporaire, non_applicable]
  delay_on_gel_reference: "00:05:00"   # ancre *age_gel_delay_5
  delay_on_ok_reference: "00:02:00"    # ancre *age_ok_delay
  action_canon: script.resilience_integration_recover
  garde_decision: input_boolean.systeme_stable
  inhibition: binary_sensor.panne_secteur_en_cours
  inhibition_wan: binary_sensor.contexte_wan_indisponible

