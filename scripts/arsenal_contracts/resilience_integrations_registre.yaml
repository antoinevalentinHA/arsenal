    # 2026-08-24 : action migree au ciblage du perimetre (reload_target,
    # R-ANCRAGE-5). Plus aucun entry_id declare : l'entree reparee est
    # derivee du perimetre observe. Secret retire de secrets.yaml.
    entry_ref: non_applicable
    groupe_source:           { statut: present, entity_id: group.synology_capteurs }
    capteur_age:             { statut: present, entity_id: sensor.synology_age_donnees }
    binaire_gel:             { statut: present, entity_id: binary_sensor.gel_avere_synology }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.indisponibilite_franche_synology }
    binaire_retour_ok:       { statut: present, entity_id: binary_sensor.retour_ok_synology }
    binaire_recovery:        { statut: present, entity_id: binary_sensor.recovery_en_cours_synology }
    automation:              { statut: present, id: "10120000000021", alias: "Système - Relance Synology", fichier: 11_automations/system/reload_integrations/synology.yaml }
