  # ========================================================
  # SCISSION SWITCHBOT (2026-08-24)
  # L'ancien perimetre unique melangeait `switchbot` (BLE, push sur
  # changement, local_lan) et `switchbot_cloud` (polling regulier,
  # cloud_wan). Trois consequences, toutes constatees :
  #  - perimetre NON FERME -> inelegible au ciblage (R-ANCRAGE-6) ;
  #  - une panne TOTALE du cloud etait INVISIBLE, les Meters BLE
  #    empechant l'axe disponibilite d'atteindre zero ;
  #  - la chaine etait declaree local_lan, donc SANS garde WAN, alors
  #    que 14 entites sur 22 dependaient du cloud.
  # ========================================================

  - nom: SwitchBot BLE
    mode: disponibilite_seule
    classe_reseau: local_lan
    statut_attendu: active
    maille: entree_de_configuration
    domaine_integration: switchbot
    entree_libelle: "Meters SwitchBot (5 entrees, une par appareil)"
    entry_ref: non_applicable
    groupe_source:           { statut: present, entity_id: group.switchbot_ble_capteurs }
    capteur_age:             { statut: present, entity_id: sensor.switchbot_ble_age_donnees }
    binaire_gel:             { statut: non_applicable, entity_id: null, note: "Axe fraicheur inapplicable : Meters en push sur changement. Mesure 2026-08-24 jusqu'a 69 min de silence en piece stable — nominal. Un seuil produirait un faux incident (R-AXE1-1)." }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.indisponibilite_franche_switchbot_ble }
    binaire_retour_ok:       { statut: present, entity_id: binary_sensor.retour_ok_switchbot_ble }
    binaire_recovery:        { statut: present, entity_id: binary_sensor.recovery_en_cours_switchbot_ble }
    automation:              { statut: present, id: "10120000000011", alias: "Système - Relance SwitchBot BLE", fichier: 11_automations/system/reload_integrations/switchbot_ble.yaml }
    timer_backoff:           { statut: present, entity_id: timer.switchbot_ble_reload_backoff }
    compteur_tentatives:     { statut: present, entity_id: input_number.switchbot_ble_reload_tentatives }
    action_recovery:         { statut: present, type: reload_entry, via: canon }
    action_cible: group.switchbot_ble_capteurs
    seuil_gel_attendu: null
    seuil_automation_constate: null
    delay_on_gel: null
    couverture_domaine_mesuree: "5/7 couvertes + 2 derogees = 7/7"
    # ⚠️ LIMITE ASSUMEE — masquage intra-perimetre. L'axe disponibilite
    # exige zero membre exploitable : la mort d'UN Meter parmi les cinq
    # reste invisible. « Couverte » au sens de R-COUVERTURE-1 ne signifie
    # pas « detectable individuellement ». Reserve differee solvable, NON
    # BLOQUANTE ; critere de levee : observabilite par Meter, ou scission
    # par appareil si une remediation par appareil s'avere utile.
    derogations_couverture:
      - entree: "Bot Chambre parents"
        # Cle de la derogation au runtime : l'entree est RESOLUE par ce
        # temoin (config_entry_id), jamais designee par son titre —
        # un titre n'est ni stable ni unique (R-ANCRAGE-9).
        temoin: switch.bot_chambre_parents
        motif: >-
          Actionneur couvert par le socle transactionnel SwitchBot
          (switchbot_transactionnel.md, niveau A) : verrou, cooldown,
          compteur d'echecs, verdicts canoniques. Sa panne n'est pas
          silencieuse. Un reload d'entree ne le repare pas.
        critere_levee: >-
          Sortie du registre transactionnel, ou preuve terrain qu'un reload
          d'entree recupere une session BLE perdue.
      - entree: "Bot Déshumidificateur"
        # Cle de la derogation au runtime : l'entree est RESOLUE par ce
        # temoin (config_entry_id), jamais designee par son titre —
        # un titre n'est ni stable ni unique (R-ANCRAGE-9).
        temoin: switch.deshumidificateur
        motif: >-
          Actionneur retire du registre transactionnel en C40 au profit de
          l'ecrivain unique script.set_deshumidificateur_state. Son
          indisponibilite est traitee au niveau du domaine : la
          commandabilite y est une imperative de categorie A qui borne
          l'execution dans les deux regimes (deshumidificateur/
          autorite_de_domaine.md) — actionneur indisponible => abstention,
          jamais action aveugle. Sa panne n'est pas silencieuse.
        critere_levee: >-
          La garde de commandabilite cesse de couvrir l'indisponibilite de
          l'actionneur, ou preuve terrain qu'un reload d'entree le recupere.
    exceptions_temporaires: []

  - nom: SwitchBot Cloud
    mode: fraicheur+disponibilite
    classe_reseau: cloud_wan
    statut_attendu: active
    maille: entree_de_configuration
    domaine_integration: switchbot_cloud
