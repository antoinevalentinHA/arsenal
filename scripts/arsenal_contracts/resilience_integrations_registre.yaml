    exceptions_temporaires: []

  # ========================================================
  # PREMIERE CHAINE A LA MAILLE « ENTREE DE CONFIGURATION » (v2.0)
  # Les trois axes sont cables, dont l'axe 3 (echec de configuration).
  # ========================================================

  - nom: HomeKit Prise Control
    # Axe fraicheur INAPPLICABLE : cover.* en push, sans ecriture periodique du
    # coordinateur (mesure du 2026-08-24, cf. pont_idiamant.md §8.3).
    mode: disponibilite+echec_configuration
    classe_reseau: local_lan
    statut_attendu: active
    maille: entree_de_configuration
    domaine_integration: homekit_controller
    entree_libelle: "Prise Control"
    entry_ref: homekit_prise_control_entry_id
    # L'entry_id de cette entree est instance-specifique : il vit dans
    # secrets.yaml sous la cle `homekit_prise_control_entry_id`, referencee
    # par l'automation et par le capteur d'etat d'entree. Aucune valeur
    # d'identifiant n'est publiee dans ce depot.
    groupe_source:           { statut: present, entity_id: group.homekit_prise_control }
    capteur_age:             { statut: present, entity_id: sensor.homekit_prise_control_age_donnees }
    binaire_gel:             { statut: non_applicable, entity_id: null, note: "Axe fraicheur inapplicable : entites en push, last_reported fige hors mouvement. Un seuil produirait un faux incident toutes les ~50 min." }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.indisponibilite_franche_homekit_prise_control }
    binaire_retour_ok:       { statut: present, entity_id: binary_sensor.retour_ok_homekit_prise_control }
    binaire_recovery:        { statut: present, entity_id: binary_sensor.recovery_en_cours_homekit_prise_control }
    automation:              { statut: present, id: "10120000000029", alias: "Système - Relance HomeKit Prise Control", fichier: 11_automations/system/reload_integrations/homekit_prise_control.yaml }
    timer_backoff:           { statut: present, entity_id: timer.homekit_prise_control_reload_backoff }
    compteur_tentatives:     { statut: present, entity_id: input_number.homekit_prise_control_reload_tentatives }
    action_recovery:         { statut: present, type: reload_entry, via: canon }
    seuil_gel_attendu: null
    seuil_automation_constate: null
    delay_on_gel: null
    # Axe 3 — desormais VERIFIE par le checker (R7 generalise au multi-axes).
    capteur_etat_entree:     { statut: present, entity_id: sensor.etat_entree_homekit_prise_control }
    binaire_echec_configuration: { statut: present, entity_id: binary_sensor.echec_configuration_homekit_prise_control }
    debounce_echec_configuration: "00:15:00"
    # ESCALADE (echelon 2) — contrats/pont_idiamant.md v1.0.
    # Automation 10120000000030 : power-cycle unique de switch.prise_palier
    # apres 2 tentatives de reload infructueuses. Hors modele du checker
    # (dette §10.1) : la remediation physique n'est pas modelisee ici.
    # Reserve levee le 2026-08-24 : la cadence a ete mesuree des le retour de
    # l'entree. Resultat : AUCUNE cadence periodique (push pur). L'axe fraicheur
    # est donc retire, pas ajuste. Voir pont_idiamant.md §8.3.
    exceptions_temporaires: []

  # ========================================================
  # MODÈLE DE RÉFÉRENCE — disponibilité native (exception légitime)
  # Axes d'âge non_applicable (PAS une dette).
  # ========================================================

  - nom: Zigbee2MQTT
    mode: disponibilite_native
    classe_reseau: local_lan
    statut_attendu: modele_reference
    maille: entree_de_configuration
    domaine_integration: mqtt
    entree_libelle: "Zigbee2MQTT (add-on)"
    entry_ref: non_applicable
    groupe_source:           { statut: non_applicable, entity_id: null }
    capteur_age:             { statut: non_applicable, entity_id: null }
    binaire_gel:             { statut: non_applicable, entity_id: null }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.zigbee2mqtt_bridge_connection_state, fourni_par: integration_native }
    binaire_retour_ok:       { statut: non_applicable, entity_id: null, note: "retour OK = transition to:'on' for 2min du bridge, pas un binaire dédié" }
