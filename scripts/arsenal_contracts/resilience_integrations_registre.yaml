  - nom: SwitchBot
    mode: fraicheur+disponibilite
    classe_reseau: local_lan
    statut_attendu: active
    maille: entree_de_configuration
    domaine_integration: switchbot
    entree_libelle: "SwitchBot"
    entry_ref: switchbot_entry_id
    groupe_source:           { statut: present, entity_id: group.switchbot_capteurs }
    capteur_age:             { statut: present, entity_id: sensor.switchbot_age_donnees }
    binaire_gel:             { statut: present, entity_id: binary_sensor.gel_avere_switchbot }
    binaire_indisponibilite: { statut: present, entity_id: binary_sensor.indisponibilite_franche_switchbot }
    binaire_retour_ok:       { statut: present, entity_id: binary_sensor.retour_ok_switchbot }
    binaire_recovery:        { statut: present, entity_id: binary_sensor.recovery_en_cours_switchbot }
    automation:              { statut: present, id: "10120000000011", alias: "Système - Relance SwitchBot", fichier: 11_automations/system/reload_integrations/switchbot.yaml }
    timer_backoff:           { statut: present, entity_id: timer.switchbot_reload_backoff }
    compteur_tentatives:     { statut: present, entity_id: input_number.switchbot_reload_tentatives }
    action_recovery:         { statut: present, type: reload_entry, via: canon }
    seuil_gel_attendu: 45
    seuil_automation_constate: 45
    delay_on_gel: "00:05:00"
    exceptions_temporaires: []
    # ⚠️ PERIMETRE NON FERME SUR SON DOMAINE — etat au 2026-08-24.
    #
    # Composition constatee au runtime, apres retrait des 2 entites MQTT :
    #   switchbot        :  8 entites (BLE via proxys ESP32) — local_lan
    #   switchbot_cloud  : 14 entites (capteurs Imprimerie)  — cloud_wan
    #
    # ECART 1 — RESOLU le 2026-08-24. `sensor.temperature_sdb_parents` et
    # `sensor.humidite_relative_sdb_parents` etaient sur l'entree MQTT
    # (« Mosquitto broker ») : capteur physique remplace par un Zigbee, les
    # entity_id conserves, donc derive invisible a toute analyse statique.
    # Retires du groupe. Leur resilience releve de la chaine Zigbee2MQTT.
    #
    # ECART 2 — OUVERT. Le perimetre melange DEUX integrations aux modes de
    # defaillance sans rapport. Le ciblage par perimetre (`reload_target`)
    # reste donc interdit ici (R-ANCRAGE-6), et l'action demeure partielle
    # (une entree sur six, R-ANCRAGE-4).
    #
    # ECART 3 — OUVERT, et le plus serieux. UNE PANNE TOTALE DU CLOUD
    # SWITCHBOT EST INVISIBLE POUR CETTE CHAINE : l'axe disponibilite exige
    # ZERO membre exploitable, or les 8 capteurs BLE restent vivants ; l'axe
    # fraicheur prend le membre le plus frais, que les BLE maintiennent bas.
    # Aucun axe ne se declenche. Meme patron de masquage que les facades
    # HomeKit du 2026-08-24.
    # De plus `classe_reseau: local_lan` prive la chaine de garde WAN, alors
    # que 14 entites sur 22 dependent du cloud. Le contrat §11.5 justifie ce
    # classement par « BLE via proxys ESP32 » : vrai pour 8 entites, pas 22.
    #
    # PISTE — scinder en deux chaines, une par integration : une local_lan
    # pour le BLE, une cloud_wan avec garde WAN pour l'Imprimerie. Demande
    # de nouveaux identifiants d'automatisation et rouvre R-ANCRAGE-4 cote
    # BLE (chaque appareil est sa propre entree). Arbitrage proprietaire.
    #
    # Qualification (solvabilite_probatoire.md §3) : reserve differee
    # solvable, NON BLOQUANTE. Critere de levee : scission en deux chaines,
    # ou requalification explicite en exception documentee.
    arbitrage_ouvert: perimetre_non_ferme_deux_integrations
    # ECART 4 — COUVERTURE INCOMPLETE DU DOMAINE, mesure du 2026-08-24.
    # 4 entrees `switchbot` couvertes sur 7 presentes. NON COUVERTES :
    #   - Bot Chambre parents        (actionneur)
    #   - Bot Deshumidificateur      (actionneur)
    #   - Meter Petite Maison        (CAPTEUR)
    #
    # Les deux « Bot » sont des actionneurs : leur absence d'un groupe
    # nomme `switchbot_capteurs` est peut-etre deliberee — mais ils ne sont
    # alors couverts par AUCUNE chaine. Un Bot mort est un interrupteur qui
    # ne repond plus.
    #
    # « Meter Petite Maison » est en revanche un CAPTEUR, et son exclusion
    # ressemble a un oubli. C'est lui qui fournit
    # `sensor.temperature_petite_maison_2`, source SwitchBot de la
    # consolidation petite maison. S'il meurt, aucune chaine ne le remarque.
    #
    # Qualification : INDECIDABLE tant que le modele de couverture n'est pas
    # tranche (voir meta.cartographie_couverture). Ni conforme ni non
    # conforme — le contrat ne dit pas ce qu'une chaine DOIT couvrir.
    couverture_domaine_mesuree: "4/7"

