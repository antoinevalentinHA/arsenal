# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Buanderie – Clôture de fin de cycle électroménager
#
#  ID : 10080000000004
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Automation d’ACTION.
#
#     Elle clôt le cycle de la buanderie quand sa fin est
#     ÉTABLIE par la décision
#     `binary_sensor.buanderie_fin_cycle_etablie`
#     (puissance mesurée < 2 W pendant 15 min), après une
#     fenêtre de confirmation sans reprise, puis notifie
#     l’utilisateur.
#
#  🧱 NATURE
#
#     - Action réactive à une décision sur ÉTAT (autorité unique)
#     - Aucun seuil de fin local
#     - Protection contre faux positifs (reprise après arrêt)
#
#  ⚙️ PRINCIPE
#
#     - Déclenchement :
#         • passage de la décision à on (cas nominal)
#         • réconciliation : systeme_stable → on (redémarrage HA)
#         • réconciliation : automation_reloaded (rechargement)
#     - Condition unique : la décision est on
#     - Confirmation : aucune reprise (> 30 W) pendant 5 minutes
#       ET décision toujours on au terme de la fenêtre
#     - Clôture : extinction du flag, PUIS notification de fin
#
#  🔄 RÉCONCILIATION (C57)
#
#     La fin ne dépend plus d’un front unique « < 2 W pendant
#     15 min » : un rechargement des automatisations pendant la
#     fenêtre basse (front jamais réarmé) ou une exécution tuée
#     pendant la confirmation laissaient le flag à on sans
#     recours. La décision est un niveau recalculé en continu,
#     rattrapé par les déclencheurs de réconciliation.
#
#  🔁 IDEMPOTENCE
#
#     Le flag est éteint AVANT la notification : la décision
#     retombe aussitôt, tout déclenchement ultérieur échoue
#     sur la condition. Une clôture et une notification au
#     plus par cycle.
#
#  🚫 CE QUE CETTE AUTOMATION NE FAIT PAS
#
#     - Ne pilote aucun appareil
#     - Ne force jamais une fin sans décision établie
#       (aucune remise à off sur mesure absente ou par délai)
#     - Ne gère pas la notification persistante d’état
#       (projection 10080000000007)
#
#  ✅ COMPATIBILITÉ
#
#     Home Assistant 2024.8+
# ==========================================================

- id: "10080000000004"
  alias: "Électroménager - Buanderie - Fin cycle"
  description: >
    Clôt le cycle de lavage quand sa fin est établie (décision sur
    état), après 5 min de confirmation sans reprise, puis notifie.
    Réconcilie au redémarrage et au rechargement.

  mode: restart

  # ======================================================
  # 🔔 Déclencheurs — Décision établie + réconciliation
  # ======================================================
  trigger:
    - id: fin_etablie
      platform: state
      entity_id: binary_sensor.buanderie_fin_cycle_etablie
      to: "on"

    - id: reconciliation_systeme_stable
      platform: state
      entity_id: input_boolean.systeme_stable
      to: "on"

    - id: reconciliation_rechargement
      platform: event
      event_type: automation_reloaded

  # ======================================================
  # ✅ Condition — Autorité unique : fin établie
  # ======================================================
  condition:
    - condition: state
      entity_id: binary_sensor.buanderie_fin_cycle_etablie
      state: "on"

  # ======================================================
  # 🔄 Action — Confirmation + extinction + notification
  # ======================================================
  action:

    # ⏱ Attente 5 min pour vérifier qu’il n’y a pas reprise > 30 W
    - alias: "Attente de confirmation"
      wait_for_trigger:
        - platform: numeric_state
          entity_id: sensor.prise_buanderie_power
          above: 30
      timeout: "00:05:00"
      continue_on_timeout: true

    # Fin confirmée : aucune reprise ET décision toujours établie
    # (une mesure perdue ou remontée pendant la fenêtre la fait
    # retomber : pas de clôture, la décision réarmera la suite).
    - alias: "Confirmation de fin"
      condition: template
      value_template: >
        {{ wait.trigger is none
           and is_state('binary_sensor.buanderie_fin_cycle_etablie', 'on') }}

    # Clôture logique d'abord : la décision retombe, toute
    # réexécution ultérieure échoue sur la condition. La
    # disqualification de la notification persistante d'état est
    # portée par la projection (NOTIF-03).
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.buanderie_cycle

    # Push mobile de fin (événement).
    - action: script.notification_envoyer
      data:
        cible: input_text.telephone_parent_1_notify
        titre: "🧺 Buanderie – Cycle terminé"
        message: >
          Le cycle de lavage est terminé ✅
