# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Clim – Autorité : intention → primitive supervisée
#
#  ID : 10030000000123
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Traduire l'INTENTION d'autorité exprimée à l'UI
#     (input_select.clim_autorite_intention) en PRIMITIVE
#     SUPERVISÉE (contrat 16 §16.4) :
#       - intention = manuel      → script.clim_entrer_mode_manuel
#                                    (consigne = mode auto courant)
#       - intention = automatique → script.clim_revenir_mode_automatique
#
#     Cette automation :
#       - ne décide rien (elle relaie une intention vers l'écrivain unique)
#       - n'écrit NI titulaire NI relais (seule la primitive transfère)
#
#  🔁 ANTI-BOUCLE / ANTI-REPRISE SILENCIEUSE
#
#     - Gardée « n'agir que si l'intention DIFFÈRE du titulaire réel » :
#       les écritures de re-synchronisation (id 10030000000124), qui
#       posent intention = titulaire, ne re-déclenchent aucune entrée.
#     - Gardée par input_boolean.systeme_stable : au démarrage, la synchro
#       (…124) réaligne l'intention sur le titulaire restauré AVANT que
#       cette automation ne puisse agir → aucune reprise implicite au boot
#       (§16.4 « aucune reprise silencieuse », redémarrage déterministe).
#
#  🧠 AUTORITÉ D'EXÉCUTION
#
#     script.clim_entrer_mode_manuel / script.clim_revenir_mode_automatique
# ==========================================================

- id: "10030000000123"
  alias: "Clim - Autorité : intention → primitive supervisée"
  description: >
    Traduit l'intention d'autorité UI (input_select.clim_autorite_intention)
    en primitive supervisée (§16.4). N'agit que si l'intention diffère du
    titulaire réel et après le gate de stabilité — aucune boucle avec la
    synchro (id 10030000000124), aucune reprise implicite au démarrage.
  mode: single
  max_exceeded: silent

  # ======================================================
  # 🔔 Déclencheur — Changement d'intention
  # ======================================================
  trigger:
    - platform: state
      entity_id: input_select.clim_autorite_intention

  # ======================================================
  # 🛑 Gardes — stabilité + divergence réelle
  # ======================================================
  condition:
    # Pas d'action tant que le système n'est pas stabilisé (boot).
    - condition: state
      entity_id: input_boolean.systeme_stable
      state: "on"
    # N'agir que sur une intention RÉELLEMENT divergente du titulaire.
    - condition: template
      value_template: >
        {{ states('input_select.clim_autorite_intention')
           != states('input_select.clim_titulaire_autorite') }}

  # ======================================================
  # ▶️ Action — Traduction en primitive supervisée
  # ======================================================
  action:
    - choose:
        # Intention = manuel → prise de contrôle AU MODE AUTO COURANT.
        # consigne = clim_target_mode (toujours off/cool/dry/heat) ;
        # défaut 'off' en garde ultime pour ne jamais faire abstenir la
        # primitive (§16.4 : entrée atomique, jamais bloquée par l'UI).
        - conditions:
            - condition: state
              entity_id: input_select.clim_autorite_intention
              state: manuel
          sequence:
            - service: script.clim_entrer_mode_manuel
              data:
                consigne: >
                  {{ states('sensor.clim_target_mode')
                     if states('sensor.clim_target_mode') in ['off', 'cool', 'dry', 'heat']
                     else 'off' }}
        # Intention = automatique → restitution explicite à Arsenal.
        - conditions:
            - condition: state
              entity_id: input_select.clim_autorite_intention
              state: automatique
          sequence:
            - service: script.clim_revenir_mode_automatique
