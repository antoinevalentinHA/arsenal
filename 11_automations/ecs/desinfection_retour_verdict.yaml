# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     ECS – Désinfection retour : verdict de complétion (Runtime Lot 2)
#  ----------------------------------------------------------
#  🎯 RÔLE
#     Trancher le verdict FINAL d'une tentative de désinfection de
#     retour et, sur réussite corrélée UNIQUEMENT, consommer la dette.
#
#     Autorité de consommation (OFF) de input_boolean.ecs_desinfection_retour_due.
#
#  🧱 PRINCIPE — corrélation déterministe (sans UUID)
#     La tentative active est identifiée par le verdict `en_cours`
#     (posé par 10250000000021) ; la déconfliction interdit toute
#     désinfection hebdomadaire concurrente. La réussite exige donc,
#     à la complétion canonique :
#       - dette encore `on`
#       - verdict `en_cours`
#       - résumé figé de cycle `mode == 'desinfection'`
#       - cycle `valide == 'oui'` (preuve thermique gelée)
#       - complétion canonique observée (ecs_fin_cycle_signal off→on)
#
#  ⏱️ TIMEOUT (T-B, borne canonique existante)
#     Aucune durée nouvelle. Le verdict `timeout` est posé lorsque la
#     fenêtre d'inertie post-cycle (timer.fenetre_inertie_chauffe_ecs)
#     DISPARAÎT alors qu'elle portait la complétion de la tentative :
#     la complétion canonique n'arrivera plus.
#
#     ⚠️ La détection se fait par TRANSITION D'ÉTAT `active` → `idle`,
#     JAMAIS par l'événement brut `timer.cancelled` : Home Assistant
#     émet cet événement même sur un timer déjà `idle`, or 10250000000027
#     annule la fenêtre au DÉMARRAGE de CHAQUE cycle ECS — y compris
#     celui de la tentative elle-même. L'événement brut posait donc
#     `timeout` sur la tentative en train de démarrer, rendant `reussite`
#     structurellement inatteignable et la dette inconsommable.
#     Le trigger d'état ne s'arme que si une fenêtre existait réellement.
#
#  🔗 DÉPENDANCES
#     Lit    : input_boolean.ecs_fin_cycle_signal (événementiel)
#              timer.fenetre_inertie_chauffe_ecs (état active → idle)
#              input_boolean.ecs_cycle_en_cours (discrimine préemption / échéance)
#              input_select.ecs_desinfection_retour_verdict
#              input_boolean.ecs_desinfection_retour_due
#              input_text.ecs_resume_dernier_cycle_fige (mode|valide figés)
#     Écrit  : input_select.ecs_desinfection_retour_verdict (reussite/echec/timeout)
#              input_boolean.ecs_desinfection_retour_due (OFF — UNIQUEMENT sur reussite)
#
#  🚫 NE LIT PAS `remaining`/`finishes_at` ; ne pilote aucun équipement.
#  ✅ Compatibilité : Home Assistant 2024.8+
# ==========================================================

- id: "10250000000033"
  alias: "ECS - Désinfection retour verdict complétion"
  description: >
    Tranche le verdict final de la désinfection de retour et consomme la
    dette uniquement sur réussite corrélée. Pose `timeout` si la
    complétion canonique est préemptée.

  mode: single

  trigger:
    # ✅ Complétion canonique (fin exploitable du cycle)
    - platform: state
      entity_id: input_boolean.ecs_fin_cycle_signal
      from: "off"
      to: "on"
      id: completion

    # ⏱️ Disparition de la fenêtre d'inertie → candidat timeout (borne T-B)
    #    Trigger d'ÉTAT, et non `event_type: timer.cancelled` (cf. en-tête) :
    #    seule une fenêtre RÉELLEMENT ouverte produit `active` → `idle`.
    - platform: state
      entity_id: timer.fenetre_inertie_chauffe_ecs
      from: "active"
      to: "idle"
      id: preemption

  condition:
    # Ne finalise qu'une tentative de retour active…
    - condition: state
      entity_id: input_select.ecs_desinfection_retour_verdict
      state: "en_cours"
    # …dont la dette est encore due (idempotence : au plus une consommation).
    - condition: state
      entity_id: input_boolean.ecs_desinfection_retour_due
      state: "on"

  action:
    - choose:
        # ==================================================
        # A) Complétion canonique corrélée
        # ==================================================
        - conditions:
            - condition: trigger
              id: completion
          sequence:
            - variables:
                resume: "{{ states('input_text.ecs_resume_dernier_cycle_fige') }}"
                parts: "{{ (resume | string).split('|') }}"
                mode_fige: "{{ parts[1] if (parts | length >= 6) else '' }}"
                valide_fige: "{{ parts[5] if (parts | length >= 6) else '' }}"
            - choose:
                # ✅ Réussite : désinfection valide corrélée → dette consommée
                - conditions:
                    - condition: template
                      value_template: >
                        {{ mode_fige == 'desinfection' and valide_fige == 'oui' }}
                  sequence:
                    - action: input_select.select_option
                      target:
                        entity_id: input_select.ecs_desinfection_retour_verdict
                      data:
                        option: "reussite"
                    - action: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.ecs_desinfection_retour_due
                    - action: logbook.log
                      data:
                        name: "ECS Désinfection"
                        message: >
                          ✅ Désinfection retour : réussite corrélée
                          (désinfection valide + complétion canonique). Dette consommée.
                        entity_id: input_select.ecs_desinfection_retour_verdict

                    # 🔁 Circulation bouclage 5 min via la primitive EXISTANTE.
                    # Ordre : verdict `reussite` écrit + dette consommée AVANT l'appel
                    # ⇒ la garde d'unicité (condition top-level dette `on` + verdict
                    # `en_cours`) est déjà retombée, garantissant un seul appel par
                    # réussite (automation `mode: single`). ECS n'écrit jamais
                    # `switch.prise_bouclage` : le domaine Bouclage exécute et borne
                    # (timer 5 min, arrêt/purge existants). Boucle NON prouvée
                    # thermiquement (pas de sonde) ; tronçons terminaux hors garantie.
                    - action: script.bouclage_ecs_5_minutes
                    - action: logbook.log
                      data:
                        name: "ECS Désinfection"
                        message: >
                          🔁 Circulation bouclage 5 min demandée (primitive existante).
                          Ballon désinfecté prouvé ; boucle non prouvée thermiquement ;
                          tronçons terminaux hors garantie.
                        entity_id: input_boolean.bouclage_ecs_5_minutes_en_cours

                # ❌ Échec : désinfection non valide → dette conservée
                - conditions:
                    - condition: template
                      value_template: >
                        {{ mode_fige == 'desinfection' and valide_fige != 'oui' }}
                  sequence:
                    - action: input_select.select_option
                      target:
                        entity_id: input_select.ecs_desinfection_retour_verdict
                      data:
                        option: "echec"
                    - action: logbook.log
                      data:
                        name: "ECS Désinfection"
                        message: >
                          ❌ Désinfection retour : échec (cycle non valide au gel).
                          Dette conservée.
                        entity_id: input_select.ecs_desinfection_retour_verdict

                # 🚫 Complétion étrangère (mode != désinfection) → ignorer,
                #    la tentative reste `en_cours` (aucune action).

        # ==================================================
        # B) Préemption de l'inertie → timeout (dette conservée)
        # ==================================================
        - conditions:
            - condition: trigger
              id: preemption
            # 🔑 Discrimine la PRÉEMPTION de l'ÉCHÉANCE NATURELLE.
            # Seule une reprise de cycle annule la fenêtre (10250000000027
            # annule sur `ecs_cycle_en_cours` off→on) ⇒ le verrou est `on`.
            # À l'échéance naturelle le verrou est `off` et la complétion
            # canonique suit son cours (branche A) : aucun timeout ici.
            - condition: state
              entity_id: input_boolean.ecs_cycle_en_cours
              state: "on"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.ecs_desinfection_retour_verdict
              data:
                option: "timeout"
            - action: logbook.log
              data:
                name: "ECS Désinfection"
                message: >
                  ⏱️ Désinfection retour : timeout (complétion canonique préemptée).
                  Dette conservée, réconciliation ultérieure.
                entity_id: input_select.ecs_desinfection_retour_verdict
