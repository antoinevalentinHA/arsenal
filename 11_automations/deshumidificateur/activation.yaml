# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Déshumidificateur – Activation différée sur recommandation
#
#  ID : 10060000000006
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Automation de discipline d’activation.
#
#     Elle met en marche le déshumidificateur lorsque
#     la recommandation logique de fonctionnement est
#     confirmée et stable, et que le blocage inter-cycles
#     est échu.
#
#     Cette automation n’est PAS un garde-fou invariant.
#
#  🧩 PRINCIPE
#
#     - Détection d’une recommandation logique persistante
#     - Vérification que l’appareil est actuellement à l’arrêt
#     - Vérification que le blocage de redémarrage est échu
#     - Activation contrôlée et assumée
#
#     Une tolérance temporelle est volontairement appliquée
#     pour éviter des démarrages intempestifs.
#
#  🕒 TEMPORISATIONS APPLIQUÉES
#
#     - Recommandation active ≥ 5 minutes
#     - Blocage de redémarrage échu
#
#     Ces durées constituent une politique d’usage,
#     pas une règle logique absolue.
#
#  🧠 DÉCLENCHEURS UTILISÉS
#
#     - Stabilisation de la recommandation
#     - Fin du blocage de redémarrage
#
#     Cette automation est strictement événementielle.
#
#  🧠 PRODUCTEUR DE DÉCISION AUTO (autorité de domaine §8)
#
#     N’appelle PLUS l’écrivain. PUBLIE la décision auto « on » dans
#     input_select.deshumidificateur_decision_auto (branche « auto » de la
#     décision exécutoire). L’application (consommateur exécutoire unique)
#     réalise la commande. Discipline de timing auto (stabilité, min-off)
#     conservée à l’identique dans les triggers/conditions ci-dessous.
#
#     Impulsion unique (exclusivité A/B) : en régime auto, si la publication
#     CHANGE l’exécutoire → le changement d’état porte l’impulsion ; si elle ne
#     le change pas (decision_auto déjà « on ») → événement application_requise.
#     En régime manuel : la décision auto est rafraîchie (théorique) sans
#     signaler l’application (etat_commande = consigne, inchangé).
#
#  🚫 CE QUE CETTE AUTOMATION NE FAIT PAS
#
#     - Ne calcule PAS l’humidité
#     - Ne définit AUCUN seuil
#     - Ne décide PAS quand déshumidifier
#     - N’appelle PAS l’écrivain (set_deshumidificateur_state)
#     - Ne force PAS une activation immédiate
#
#  🧠 ARCHITECTURE ARSENAL
#
#     Automation de gestion d’entrée :
#     recommandation ≠ invariant.
#
#     Elle assure qu’un état recommandé
#     devienne effectif de manière robuste
#     et tolérante au bruit système.
# ==========================================================

- id: "10060000000006"
  alias: "Déshumidificateur - Activation auto"
  description: >
    Met le déshumidificateur en marche si la recommandation
    est active depuis 5 min, que l'appareil est à l'arrêt
    et que le blocage de redémarrage est échu.
  mode: single

  trigger:
    - platform: state
      entity_id: binary_sensor.deshumidificateur_cave_demarrage_recommande
      to: "on"
      for: "00:05:00"

    - platform: state
      entity_id: timer.deshumidificateur_blocage_redemarrage
      to: "idle"

  condition:
    - condition: state
      entity_id: binary_sensor.deshumidificateur_cave_demarrage_recommande
      state: "on"
      for: "00:05:00"

    - condition: state
      entity_id: binary_sensor.deshumidificateur_actif
      state: "off"

    - condition: state
      entity_id: timer.deshumidificateur_blocage_redemarrage
      state: "idle"

  action:
    # Producteur de décision auto : PUBLIE « on » (§8). Pas d'appel écrivain.
    - variables:
        avant: "{{ states('input_select.deshumidificateur_decision_auto') }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.deshumidificateur_decision_auto
      data:
        option: "on"
    # Impulsion vers l'application UNIQUEMENT en régime automatique
    # (en manuel, etat_commande = consigne — la décision auto n'est que théorique).
    - condition: state
      entity_id: input_select.deshumidificateur_titulaire_autorite
      state: automatique
    # Exclusivité A/B : événement seulement si l'exécutoire ne change pas
    # (decision_auto déjà « on » → aucun trigger d'état ; sinon le trigger A porte).
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ avant == 'on' }}"
          sequence:
            - event: deshumidificateur_application_requise