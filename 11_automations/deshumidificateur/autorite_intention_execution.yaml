# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Déshumidificateur – Autorité : intention → primitive supervisée
#
#  ID : 10060000000013
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Traduire l'INTENTION d'autorité exprimée à l'UI
#     (input_select.deshumidificateur_autorite_intention) en PRIMITIVE
#     SUPERVISÉE (contrat deshumidificateur/autorite_de_domaine.md §4) :
#       - intention = manuel      → script.deshumidificateur_entrer_mode_manuel
#                                    (consigne = état exécutoire courant)
#       - intention = automatique → script.deshumidificateur_revenir_mode_automatique
#
#     Cette automation :
#       - ne décide rien (elle relaie une intention vers la primitive)
#       - n'écrit NI titulaire NI exécution (seule la primitive transfère)
#
#  🔁 ANTI-BOUCLE / ANTI-REPRISE SILENCIEUSE
#
#     - Gardée « n'agir que si l'intention DIFFÈRE du titulaire réel » : les
#       écritures de re-synchronisation (id 10060000000014), qui posent
#       intention = titulaire, ne re-déclenchent aucune entrée.
#     - Gardée par input_boolean.systeme_stable : au démarrage, la synchro
#       (…014) réaligne l'intention sur le titulaire restauré AVANT que cette
#       automation ne puisse agir → aucune reprise implicite au boot (§4).
#
#  🧠 AUTORITÉ D'EXÉCUTION
#
#     script.deshumidificateur_entrer_mode_manuel /
#     script.deshumidificateur_revenir_mode_automatique
# ==========================================================

- id: "10060000000013"
  alias: "Déshumidificateur - Autorité : intention → primitive supervisée"
  description: >
    Traduit l'intention d'autorité UI (input_select.deshumidificateur_autorite_intention)
    en primitive supervisée (§4). N'agit que si l'intention diffère du titulaire réel
    et après le gate de stabilité — aucune boucle avec la synchro (id 10060000000014),
    aucune reprise implicite au démarrage.
  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: input_select.deshumidificateur_autorite_intention

  condition:
    - condition: state
      entity_id: input_boolean.systeme_stable
      state: "on"
    - condition: template
      value_template: >
        {{ states('input_select.deshumidificateur_autorite_intention')
           != states('input_select.deshumidificateur_titulaire_autorite') }}

  action:
    - choose:
        # Intention = manuel → prise de contrôle À L'ÉTAT EXÉCUTOIRE COURANT.
        # consigne = état commandé courant (on/off) ; défaut 'off' (conservateur)
        # en garde ultime → la primitive ne s'abstient jamais sur une valeur valide.
        - conditions:
            - condition: state
              entity_id: input_select.deshumidificateur_autorite_intention
              state: manuel
          sequence:
            - service: script.deshumidificateur_entrer_mode_manuel
              data:
                consigne: >
                  {{ states('sensor.deshumidificateur_etat_commande')
                     if states('sensor.deshumidificateur_etat_commande') in ['on', 'off']
                     else 'off' }}
        # Intention = automatique → restitution explicite à Arsenal.
        - conditions:
            - condition: state
              entity_id: input_select.deshumidificateur_autorite_intention
              state: automatique
          sequence:
            - service: script.deshumidificateur_revenir_mode_automatique
