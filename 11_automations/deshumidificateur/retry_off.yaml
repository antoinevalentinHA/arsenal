# ==========================================================
# 🧠 ARSENAL — AUTOMATION
#     Déshumidificateur - Retry automatique sur non confirmation OFF
#
# ID : 10060000000009
# ----------------------------------------------------------
# 🎯 ROLE
#   Déclencher une unique réémission automatique de la
#   commande OFF si le guard post-commande conclut à une
#   non-convergence observable.
#
# 🧩 PERIMETRE
#   - surveille le verdict du guard
#   - agit uniquement sur :
#       * verdict = not_confirmed
#       * etat attendu = off
#       * etat reel encore on
#   - déclenche une seule réémission automatique
#
# 🔗 DEPENDANCES
#   - input_text.deshum_guard_last_verdict
#   - input_text.deshum_guard_last_reason
#   - input_text.deshum_guard_last_expected_state
#   - input_text.deshum_guard_last_request_source
#   - binary_sensor.deshumidificateur_actif
#   - sensor.deshumidificateur_etat_commande
#   - script.set_deshumidificateur_state
#
# 🛡️ RETRY SOUVERAIN (autorité de domaine §7 / D9)
#   Avant toute réémission, RELIT la décision exécutoire courante :
#     - si elle n'est plus « off » → ANNULATION du retry périmé ;
#     - sinon → réémission de la VALEUR EXÉCUTOIRE COURANTE, jamais historique.
#
# 🚫 NE FAIT PAS
#   - ne qualifie pas l'effet reel
#   - ne remplace pas le guard
#   - ne boucle pas sur ses propres retries
#   - ne réémet jamais une commande devenue non souveraine
#
# 🧠 STATUT ARCHITECTURAL
#   Automation d'invariant defensif (appelant légitime — numerus clausus §2).
# ==========================================================

- id: "10060000000009"
  alias: "Déshumidificateur - Retry OFF"
  mode: single

  trigger:
    - platform: state
      entity_id: input_text.deshum_guard_last_verdict
      to: "not_confirmed"

  condition:
    - condition: state
      entity_id: input_text.deshum_guard_last_expected_state
      state: "off"

    - condition: state
      entity_id: binary_sensor.deshumidificateur_actif
      state: "on"

    - condition: state
      entity_id: input_text.deshum_guard_last_reason
      state: "timeout_reached"

    - condition: template
      value_template: >
        {{ states('input_text.deshum_guard_last_request_source')
           != 'automation.deshumidificateur_retry_off' }}

    # D9 — souveraineté : la décision exécutoire courante est toujours « off ».
    # Si elle a changé depuis l'échec → annulation (aucune réémission).
    - condition: template
      value_template: >
        {{ states('sensor.deshumidificateur_etat_commande') == 'off' }}

  action:
    - action: script.set_deshumidificateur_state
      data:
        # Valeur EXÉCUTOIRE COURANTE relue (jamais un payload historique).
        target_state: "{{ states('sensor.deshumidificateur_etat_commande') }}"
        request_source: "automation.deshumidificateur_retry_off"
        request_id: >
          retry_off_{{ now().strftime('%Y%m%dT%H%M%S') }}