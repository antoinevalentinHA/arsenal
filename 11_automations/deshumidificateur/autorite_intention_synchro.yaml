# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Déshumidificateur – Autorité : synchro intention ← titulaire réel
#
#  ID : 10060000000014
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Re-synchroniser l'INTENTION UI
#     (input_select.deshumidificateur_autorite_intention) sur le TITULAIRE RÉEL
#     (input_select.deshumidificateur_titulaire_autorite) :
#       - au DÉMARRAGE de Home Assistant (le sélecteur reflète le titulaire
#         restauré, jamais une intention périmée) ;
#       - à chaque TRANSFERT d'autorité effectif, y compris une primitive appelée
#         hors sélecteur (le sélecteur suit l'autorité en vigueur).
#
#     Le titulaire est la SOURCE DE VÉRITÉ ; l'intention n'est qu'un porteur de
#     surface qui doit refléter l'autorité réelle.
#
#  🔁 ANTI-BOUCLE
#
#     Idempotente : n'écrit QUE si l'intention diffère déjà du titulaire. Poser
#     intention = titulaire ne franchit pas la garde de divergence de l'exécution
#     (id 10060000000013) → aucune entrée re-déclenchée.
#
#  ⚠️ ANTI-FALLBACK
#
#     Ne reflète qu'un titulaire VALIDE (automatique | manuel) : un état
#     unknown/unavailable ne fabrique AUCUNE intention (§4, bootstrap ≠ fallback).
#
#  🧠 AUTORITÉ D'ÉCRITURE
#
#     input_select.deshumidificateur_autorite_intention (porteur de surface UI)
# ==========================================================

- id: "10060000000014"
  alias: "Déshumidificateur - Autorité : synchro intention ← titulaire réel"
  description: >
    Re-synchronise l'intention UI (input_select.deshumidificateur_autorite_intention)
    sur le titulaire réel au démarrage et à chaque transfert d'autorité. Idempotente
    (n'écrit que sur divergence), ne reflète qu'un titulaire valide — aucune boucle
    avec l'exécution (id 10060000000013).
  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: input_select.deshumidificateur_titulaire_autorite
    - platform: homeassistant
      event: start

  condition:
    - condition: template
      value_template: >
        {{ states('input_select.deshumidificateur_titulaire_autorite') in ['automatique', 'manuel'] }}
    - condition: template
      value_template: >
        {{ states('input_select.deshumidificateur_autorite_intention')
           != states('input_select.deshumidificateur_titulaire_autorite') }}

  action:
    - service: input_select.select_option
      target:
        entity_id: input_select.deshumidificateur_autorite_intention
      data:
        option: "{{ states('input_select.deshumidificateur_titulaire_autorite') }}"
