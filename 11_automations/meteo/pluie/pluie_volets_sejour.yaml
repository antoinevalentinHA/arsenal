# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     Pluie forte – Fermeture volets Séjour
#
#  ID : 10160000000010
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Orchestration événementielle.
#     Ferme les volets du séjour sur détection de pluie forte,
#     si l'autorisation séjour est active.
#
#  🧱 NATURE
#
#     - Orchestration événementielle
#     - Décision déléguée à sensor.cibles_volets_pluie_sejour
#     - Exécution déléguée à script.volets_fermeture_execute
#
#  ⚙️ PRINCIPE
#
#     - Déclenchement principal : intention_pluie_forte → ON
#     - Déclenchement de reprise : systeme_stable → ON si pluie forte déjà active
#     - Notification construite sur le compte rendu d'émission du script :
#         ordre transmis (cibles émises) / échec d'exécution.
#       Volets sans retour d'état : jamais de « volets fermés ».
#
#  🚫 NE FAIT PAS
#
#     - Ne détecte pas la pluie
#     - Ne recalcule pas l'autorisation (déléguée au sensor)
#     - Ne filtre pas la présence (portée par autorisation_fermeture_volets_pluie_sejour)
#     - Ne ferme aucun autre volet que le séjour
#
#  📐 CONTRAT
#     CONTRAT_PLUIE_VOLETS.md v2.3.0 — sections 4.2, 5.6, 5.7, 6
# ==========================================================

- id: "10160000000010"
  alias: "Météo - Pluie - Fermeture volets séjour"
  description: >
    Ferme les volets du séjour lors du passage à "pluie forte",
    si l'autorisation séjour est active (politique présence déléguée au sensor).
  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      id: pluie_forte
      entity_id: binary_sensor.intention_pluie_forte
      to: "on"
    - platform: state
      id: demarrage
      entity_id: input_boolean.systeme_stable
      to: "on"

  condition:
    - condition: template
      alias: "Garde-fou : pluie forte active"
      value_template: "{{ is_state('binary_sensor.intention_pluie_forte','on') }}"
    - condition: template
      alias: "Optimisation : cibles séjour non vides"
      value_template: >
        {{ (state_attr('sensor.cibles_volets_pluie_sejour','entity_ids') or []) | length > 0 }}
    - condition: or
      conditions:
        - condition: trigger
          id: pluie_forte
        - condition: and
          conditions:
            - condition: trigger
              id: demarrage
            - condition: template
              alias: "Reprise : pluie forte déjà active"
              value_template: "{{ is_state('binary_sensor.intention_pluie_forte','on') }}"

  action:
    - variables:
        cibles_sejour: "{{ state_attr('sensor.cibles_volets_pluie_sejour','entity_ids') or [] }}"
    - service: script.volets_fermeture_execute
      data:
        covers: "{{ cibles_sejour }}"
      response_variable: execution
      continue_on_error: true
    - if:
        - condition: template
          alias: "Compte rendu d'émission reçu"
          value_template: "{{ execution is defined and execution.emis is defined }}"
      then:
        - service: script.notification_envoyer_avance
          data:
            cible: input_text.telephone_parent_1_notify
            titre: "🌧️ Pluie forte – Ordre de fermeture volets séjour {{ 'transmis' if execution.emis | length > 0 else 'non transmis' }}"
            message: >
              Pluie forte détectée à {{ now().strftime('%H:%M') }}.
              {% if execution.emis | length > 0 %}Ordre de fermeture transmis par Home Assistant : {{ execution.emis | join(', ') }}.{% endif %}
              {% if execution.indisponibles | length > 0 %}Non transmis par Home Assistant (entité indisponible) : {{ execution.indisponibles | join(', ') }}.{% endif %}
              Volets sans retour d'état : fermeture physique non confirmée.
            extra:
              group: "volets"
              tag: "fermeture_volets_pluie_forte_sejour"
      else:
        - service: script.notification_envoyer_avance
          data:
            cible: input_text.telephone_parent_1_notify
            titre: "🌧️ Pluie forte – Échec de l'ordre de fermeture volets séjour"
            message: >
              Pluie forte détectée à {{ now().strftime('%H:%M') }}.
              Erreur technique pendant l'émission de l'ordre de fermeture :
              ordre non transmis, ou transmis en partie seulement.
              Cibles décidées : {{ cibles_sejour | join(', ') }}.
              Voir la trace de script.volets_fermeture_execute.
            extra:
              group: "volets"
              tag: "fermeture_volets_pluie_forte_sejour"
