# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     VMC – Autorité : intention → primitive supervisée
#
#  ID : 10190000000012
# ----------------------------------------------------------
#  🎯 RÔLE
#
#     Traduire l'INTENTION d'autorité exprimée à l'UI
#     (input_select.vmc_autorite_intention) en PRIMITIVE
#     SUPERVISÉE (contrat vmc.md §16) :
#       - intention = manuel      → script.vmc_entrer_mode_manuel
#                                    (consigne = régime auto courant)
#       - intention = automatique → script.vmc_revenir_mode_automatique
#
#     Cette automation :
#       - ne décide rien (elle relaie une intention vers l'écrivain unique)
#       - n'écrit NI titulaire NI relais (seule la primitive transfère)
#
#  🔁 ANTI-BOUCLE / ANTI-REPRISE SILENCIEUSE
#
#     - Gardée « n'agir que si l'intention DIFFÈRE du titulaire réel » :
#       les écritures de re-synchronisation (id 10190000000013), qui
#       posent intention = titulaire, ne re-déclenchent aucune entrée.
#     - Gardée par input_boolean.systeme_stable : au démarrage, la synchro
#       (…013) réaligne l'intention sur le titulaire restauré AVANT que
#       cette automation ne puisse agir → aucune reprise implicite au boot
#       (§16 « aucune reprise silencieuse », redémarrage déterministe).
#
#  🧠 AUTORITÉ D'EXÉCUTION
#
#     script.vmc_entrer_mode_manuel / script.vmc_revenir_mode_automatique
# ==========================================================

- id: "10190000000012"
  alias: "VMC - Autorité : intention → primitive supervisée"
  description: >
    Traduit l'intention d'autorité UI (input_select.vmc_autorite_intention)
    en primitive supervisée (§16). N'agit que si l'intention diffère du
    titulaire réel et après le gate de stabilité — aucune boucle avec la
    synchro (id 10190000000013), aucune reprise implicite au démarrage.
  mode: single
  max_exceeded: silent

  # ======================================================
  # 🔔 Déclencheur — Changement d'intention
  # ======================================================
  trigger:
    - platform: state
      entity_id: input_select.vmc_autorite_intention

  # ======================================================
  # 🛑 Gardes — stabilité + divergence réelle
  # ======================================================
  condition:
    # Pas d'action tant que le système n'est pas stabilisé (boot).
    - condition: state
      entity_id: input_boolean.systeme_stable
      state: "on"
    # N'agir que sur une intention RÉELLEMENT divergente du titulaire.
    - condition: template
      value_template: >
        {{ states('input_select.vmc_autorite_intention')
           != states('input_select.vmc_titulaire_autorite') }}

  # ======================================================
  # ▶️ Action — Traduction en primitive supervisée
  # ======================================================
  action:
    - choose:
        # Intention = manuel → prise de contrôle AU RÉGIME AUTO COURANT.
        # consigne = vitesse auto courante (haute si requise, sinon basse) ;
        # toujours ∈ {basse, haute} → la primitive ne s'abstient jamais.
        - conditions:
            - condition: state
              entity_id: input_select.vmc_autorite_intention
              state: manuel
          sequence:
            - service: script.vmc_entrer_mode_manuel
              data:
                consigne: >
                  {{ 'haute' if is_state('binary_sensor.vmc_haute_vitesse_requise', 'on') else 'basse' }}
        # Intention = automatique → restitution explicite à Arsenal.
        - conditions:
            - condition: state
              entity_id: input_select.vmc_autorite_intention
              state: automatique
          sequence:
            - service: script.vmc_revenir_mode_automatique
