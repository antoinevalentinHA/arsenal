# ==========================================================
# 🧠 ARSENAL — AUTOMATION : VMC – Application de la décision exécutoire
# ----------------------------------------------------------
# 🎯 ROLE
#   Appliquer la vitesse de la VMC selon la DÉCISION EXÉCUTOIRE
#   unique binary_sensor.vmc_haute_vitesse_commandee (C36 §16.2) :
#     - régime automatique → suit la décision automatique agrégée ;
#     - régime manuel      → suit la consigne utilisateur.
#   L'application ne lit QUE la décision exécutoire (la titularité et
#   la consigne y sont déjà résolues) — aucune reconstruction.
#
# 🧱 PRINCIPE D'ARCHITECTURE
#   - Aucune décision métier locale ; aucun polling.
#   - Écrivain unique préservé : commande via script.vmc_haute_vitesse /
#     script.vmc_basse_vitesse uniquement.
#   - ANTI-FALLBACK (§16.2) : décision exécutoire indisponible ⇒
#     ABSTENTION (aucune commande) ; le physique conserve son dernier
#     régime valide. AUCUN `default` vers la basse vitesse.
#
# 🔁 POLITIQUE TEMPORELLE (§8.2, §8.3)
#   - Montée (haute) : immédiate.
#   - Descente (basse) : durée minimale EXÉCUTIVE — appliquée sur la
#     seule TRANSITION de décision (trigger 'decision') ; immédiate au
#     démarrage et sur récupération.
#   - mode restart : une nouvelle demande annule une descente différée.
#
# 🩹 RÉCUPÉRATION APRÈS FAIL-SAFE (§16.5)
#   Sur le FRONT STABILISÉ de retour de la cohérence physique vers un
#   état valide (off→on, for 5 s), ré-application UNIQUE de la décision
#   exécutoire par le chemin canonique. Auto-borné : un défaut persistant
#   ne produit aucun front ; aucun compteur/retry n'est ajouté.
#
# 🚦 DÉMARRAGE / RECHARGEMENT (§16.4, §9.4)
#   Aucune application avant restauration des vérités ET stabilité :
#   déclenché sur input_boolean.systeme_stable → on, sous condition
#   systeme_stable == on. Aucune reprise implicite vers l'automatique ;
#   la décision exécutoire reflète le titulaire restauré.
# ==========================================================

- id: "10190000000001"
  alias: "VMC - Gestion humidité"
  description: >
    Applique la vitesse de la VMC selon la décision exécutoire unique
    binary_sensor.vmc_haute_vitesse_commandee (C36 §16.2), en respectant
    une durée minimale exécutive au retour en basse vitesse, en
    s'abstenant si la décision exécutoire est indisponible, et en
    ré-appliquant la décision sur un front stabilisé de récupération.
  mode: restart

  trigger:
    # Transition de la décision exécutoire (application normale).
    - platform: state
      id: decision
      entity_id: binary_sensor.vmc_haute_vitesse_commandee
      to:
        - "on"
        - "off"

    # Front de récupération après fail-safe (§16.5) : retour STABILISÉ
    # de la cohérence physique vers un état valide → ré-application unique.
    - platform: state
      id: recuperation
      entity_id: binary_sensor.vmc_coherence_physique
      from: "off"
      to: "on"
      for:
        seconds: 5

    # Démarrage : appliquer une fois la stabilité atteinte (remplace le
    # bypass homeassistant.start ; aucune reprise implicite avant restauration).
    - platform: state
      id: demarrage
      entity_id: input_boolean.systeme_stable
      to: "on"

  condition:
    # Rien ne s'applique avant la stabilité système. Aucun bypass boot.
    - condition: state
      entity_id: input_boolean.systeme_stable
      state: "on"

  variables:
    # §14.4 — durée minimale EXÉCUTIVE. Aucun repli silencieux : le helper
    # est le propriétaire de la valeur ; une valeur illisible est traitée
    # comme telle (descente suspendue), non remplacée en silence.
    duree_min_minutes: >
      {{ states('input_number.vmc_duree_min_haute') | float(none) }}

    duree_min_lisible: >
      {{ duree_min_minutes is not none and duree_min_minutes > 0 }}

  action:
    - choose:

        # ==================================================
        # 🚀 HAUTE VITESSE — immédiat (tous déclencheurs)
        # ==================================================
        - conditions:
            - condition: state
              entity_id: binary_sensor.vmc_haute_vitesse_commandee
              state: "on"
          sequence:
            - service: script.vmc_haute_vitesse

        # ==================================================
        # 🔽 BASSE VITESSE — durée mini exécutive sur transition
        # ==================================================
        - conditions:
            - condition: state
              entity_id: binary_sensor.vmc_haute_vitesse_commandee
              state: "off"
          sequence:
            # Durée illisible : aucune descente (anti-fallback paramètre, §12.3).
            - condition: template
              value_template: "{{ duree_min_lisible }}"

            # Délai UNIQUEMENT sur une transition de décision (anti-commutation).
            # Au démarrage et sur front de récupération : application immédiate.
            - if:
                - condition: template
                  value_template: "{{ trigger.id == 'decision' }}"
              then:
                - delay:
                    seconds: "{{ (duree_min_minutes * 60) | int }}"

            # Réévaluation post-délai : si une demande est revenue, le mode
            # restart a déjà annulé cette séquence. Garde reload / état modifié.
            - condition: state
              entity_id: binary_sensor.vmc_haute_vitesse_commandee
              state: "off"

            - service: script.vmc_basse_vitesse

      # PAS de `default` : décision exécutoire indisponible → ABSTENTION
      # (le physique conserve son dernier régime valide ; §16.2 anti-fallback).
      # La cause d'indisponibilité est exposée par binary_sensor.vmc_conformite_decision.
