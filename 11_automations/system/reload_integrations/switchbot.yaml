# ==========================================================
#  🧠 ARSENAL — AUTOMATION :
#     SwitchBot – Relance intégration (auto) sur gel données
#
#  ID : 10120000000011
# ----------------------------------------------------------
#  🎯 RÔLE
#     Détection + orchestration minimale :
#     - détecte le gel / backoff / retour OK
#     - délègue la procédure au script canon :
#       script.resilience_integration_recover
#
#  ✅ PRINCIPE
#     - Gel avéré :
#         • sensor.switchbot_age_donnees >= 45 min pendant 5 min
#     - Succès :
#         • âge < 10 min pendant 2 min
#     - Backoff :
#         • timer.switchbot_reload_backoff (durée gérée par le script)
#
#  🧱 GARDE-FOUS
#     - Pas de time_pattern
#     - Exécution uniquement si systeme_stable = on
# ==========================================================

- id: '10120000000011'
  alias: "Système - Relance SwitchBot"
  description: >
    Orchestration légère : déclenche la procédure de résilience SwitchBot
    (reload config_entry) sur gel données, avec backoff et plafond
    gérés par le script canon.

  mode: single
  max_exceeded: silent

  trigger:
    - platform: state
      entity_id: binary_sensor.gel_avere_switchbot
      to: "on"
      id: gel

    - platform: state
      entity_id: binary_sensor.indisponibilite_franche_switchbot
      to: "on"
      id: indispo

    - platform: event
      event_type: timer.finished
      event_data:
        entity_id: timer.switchbot_reload_backoff
      id: backoff

    - platform: state
      entity_id: binary_sensor.retour_ok_switchbot
      to: "on"
      id: retour_ok

  condition:
    - condition: state
      entity_id: input_boolean.systeme_stable
      state: "on"

  action:
    - choose:
        # ✅ Reset auto si retour données fraîches
        - conditions:
            - condition: trigger
              id: retour_ok
          sequence:
            - service: script.resilience_integration_recover
              data:
                op: reset
                notify_title_prefix: "SwitchBot"
                age_entity: sensor.switchbot_age_donnees
                ok_minutes: 10
                seuil_minutes: 45
                attempts_entity: input_number.switchbot_reload_tentatives
                backoff_timer: timer.switchbot_reload_backoff
                backoff_minutes_cap: 60

      default:
        - service: script.resilience_integration_recover
          data:
            op: attempt
            kind: reload_entry
            notify_title_prefix: "SwitchBot"
            age_entity: sensor.switchbot_age_donnees
            unavail_entity: binary_sensor.indisponibilite_franche_switchbot
            seuil_minutes: 45
            ok_minutes: 10
            attempts_entity: input_number.switchbot_reload_tentatives
            backoff_timer: timer.switchbot_reload_backoff
            # ⚠️ RETOUR ARRIERE — le ciblage par perimetre est RETIRE ici.
            # `group.switchbot_capteurs` ne contient PAS que du SwitchBot :
            # il couvre trois domaines — switchbot (BLE), switchbot_cloud
            # et, surtout, mqtt (`sensor.temperature_sdb_parents` et
            # `sensor.humidite_relative_sdb_parents`, entree « Mosquitto
            # broker »). Constate le 2026-08-24.
            #
            # Avec `reload_target`, un declenchement de cette chaine aurait
            # recharge l'entree MQTT : perte breve de toutes les entites
            # MQTT -> bascule de zigbee2mqtt_bridge_connection_state ->
            # declenchement de la chaine Zigbee2MQTT -> REDEMARRAGE de
            # l'add-on. Un capteur BLE obsolete aurait pu faire redemarrer
            # le Zigbee de la maison.
            #
            # On revient donc a la portee EXPLICITE et bornee. Elle reste
            # partielle (une entree sur six, cf. R-ANCRAGE-4) et l'ecart
            # redevient un arbitrage ouvert au registre — mais partielle
            # vaut mieux que debordante.
            #
            # Le ciblage ne pourra revenir qu'une fois le perimetre FERME
            # sur son domaine.
            entry_id: !secret switchbot_entry_id
            backoff_minutes_cap: 60
            wait_timeout: "00:03:00"