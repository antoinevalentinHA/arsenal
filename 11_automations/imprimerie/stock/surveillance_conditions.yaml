# ==========================================================
# 🧠 ARSENAL — AUTOMATION
#     Imprimerie — Stock — Alerte conditions de stockage
# ----------------------------------------------------------
# 🆔 IDENTIFIANT
#   "10180000000007"
#
# 🎯 RÔLE
#   Une alerte mobile, simple et rare, quand une mesure de
#   stockage reste hors plage pendant 24 h d'affilée.
#
# 🧩 PÉRIMÈTRE
#   Stock carton et Stock produits finis × température et
#   humidité relative. Plages (bornes incluses) :
#     - température        : 10 – 35 °C
#     - humidité relative  : 30 – 80 %
#   Pour changer une plage ou la durée : modifier ce fichier.
#
# 📜 CONTRAT
#   00_documentation_arsenal/contrats/imprimerie/surveillance_ambiance_stock.md
#
# 🧠 RÈGLES
#   - numeric_state + `for` : un pic bref ne notifie jamais ;
#     la mesure doit rester hors plage 24 h sans interruption.
#   - Une seule notification par dépassement ; aucun message
#     de retour, aucune alerte d'indisponibilité capteur.
#
# ⚠️ REDÉMARRAGE
#   Le décompte des 24 h repart à zéro à chaque redémarrage
#   ou rechargement des automations. Compromis assumé :
#   l'alerte peut être retardée, jamais inventée.
# ==========================================================

- id: "10180000000007"
  alias: "Imprimerie - Stock - Alerte conditions de stockage"
  description: >
    Notifie une mesure de stockage (température ou humidité relative)
    restée hors plage pendant 24 h d'affilée.
  mode: queued

  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.temperature_stock_carton
        - sensor.temperature_stock_pf
      below: 10
      for: "24:00:00"
    - platform: numeric_state
      entity_id:
        - sensor.temperature_stock_carton
        - sensor.temperature_stock_pf
      above: 35
      for: "24:00:00"
    - platform: numeric_state
      entity_id:
        - sensor.humidite_relative_stock_carton
        - sensor.humidite_relative_stock_pf
      below: 30
      for: "24:00:00"
    - platform: numeric_state
      entity_id:
        - sensor.humidite_relative_stock_carton
        - sensor.humidite_relative_stock_pf
      above: 80
      for: "24:00:00"

  action:
    - variables:
        hr: "{{ 'humidite_relative' in trigger.entity_id }}"
        zone: "{{ 'Stock carton' if trigger.entity_id.endswith('_carton') else 'Stock produits finis' }}"
        grandeur: "{{ 'Humidité relative' if hr else 'Température' }}"
        plage: "{{ '30–80 %' if hr else '10–35 °C' }}"
        valeur: >-
          {{ trigger.to_state.state | replace('.', ',') }} {{ '%' if hr else '°C' }}

    - service: script.notification_envoyer
      data:
        cible: input_text.telephone_parent_1_notify
        titre: "📦 {{ zone }} – {{ grandeur }} hors plage depuis 24 h"
        message: "{{ grandeur }} : {{ valeur }}. Plage attendue : {{ plage }}."
