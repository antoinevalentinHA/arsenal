# ==========================================================
# 🧠 ARSENAL — AUTOMATION
#     Imprimerie — Stock — Indisponibilité des mesures
# ----------------------------------------------------------
# 🆔 IDENTIFIANT
#   "10180000000008"
#
# 🎯 RÔLE
#   Signaler l'indisponibilité prolongée d'un capteur de
#   stockage, puis le rétablissement de sa mesure — événement
#   TECHNIQUE, distinct du dépassement des conditions de stockage.
#
# 🧩 PÉRIMÈTRE
#   - Couvre : les 4 capteurs de stockage, via
#     binary_sensor.<grandeur>_mesure_indisponible_<zone>
#     (12_template_sensors/imprimerie/stock/mesure_indisponible.yaml).
#   - Exclut : le dépassement des conditions de stockage
#     (automation 10180000000007) ; toute relance d'intégration
#     (contrat resilience_integrations.md) ; la voie d'essai.
#
# 🔖 NATURE
#   Événementielle — notification mobile
#
# ⚙️ MODE
#   queued — une notification par transition, dans l'ordre.
#
# 🧠 RÈGLES
#   - off → on : notification d'indisponibilité (motif, durée).
#     Une indisponibilité n'est JAMAIS présentée comme une
#     situation saine, ni comme un retour dans la plage.
#   - on → off : notification de mesure rétablie UNIQUEMENT si le
#     capteur porte de nouveau une valeur numérique valide (un
#     simple relèvement de la durée d'indisponibilité ne vaut pas
#     rétablissement).
#
# ⚠️ COMPORTEMENT AU DÉMARRAGE
#   Aucun rattrapage : les transitions depuis unknown /
#   unavailable ne notifient pas (même choix que l'alerte NAS
#   Imprimerie 10180000000006). Une indisponibilité déjà notifiée
#   avant un redémarrage n'est pas répétée ; le décompte de la
#   durée repart au démarrage (compromis consigné au contrat).
# ==========================================================

- id: "10180000000008"
  alias: "Imprimerie - Stock - Indisponibilité des mesures"
  description: >
    Notifie l'indisponibilité prolongée d'un capteur de stockage
    (température ou humidité relative) et le rétablissement de sa mesure.
  mode: queued
  max: 20

  trigger:
    - platform: state
      entity_id:
        - binary_sensor.temperature_mesure_indisponible_stock_carton
        - binary_sensor.humidite_relative_mesure_indisponible_stock_carton
        - binary_sensor.temperature_mesure_indisponible_stock_pf
        - binary_sensor.humidite_relative_mesure_indisponible_stock_pf
      from: "off"
      to: "on"
      id: indisponibilite
    - platform: state
      entity_id:
        - binary_sensor.temperature_mesure_indisponible_stock_carton
        - binary_sensor.humidite_relative_mesure_indisponible_stock_carton
        - binary_sensor.temperature_mesure_indisponible_stock_pf
        - binary_sensor.humidite_relative_mesure_indisponible_stock_pf
      from: "on"
      to: "off"
      id: mesure_retablie

  action:
    - variables:
        p: "{{ trigger.entity_id.split('.')[1].split('_mesure_indisponible_') }}"
        g: "{{ p[0] }}"
        z: "{{ p[1] }}"
        source: "sensor.{{ p[0] }}_{{ p[1] }}"

    - if:
        - condition: template
          value_template: >-
            {{ trigger.id == 'mesure_retablie'
               and (states(source) | float(none)) is none }}
      then:
        - stop: "Mesure toujours non exploitable : aucun rétablissement à signaler."

    - action: script.imprimerie_stock_surveillance_notifier
      data:
        evenement: "{{ trigger.id }}"
        grandeur: "{{ g }}"
        zone: "{{ z }}"
        valeur: "{{ states(source) | float(none) }}"
        motif: "{{ state_attr(trigger.entity_id, 'motif') }}"
