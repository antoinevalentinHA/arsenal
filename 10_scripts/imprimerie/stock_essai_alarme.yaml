# ==========================================================
# 🧠 ARSENAL — SCRIPT
#     Imprimerie — Surveillance d'ambiance des stocks — ESSAI
# ----------------------------------------------------------
# 🎯 RÔLE
#   Éprouver la chaîne d'alarme RÉELLE (décision → mémoire →
#   temporisation → alarme → retour → notification) sans
#   attendre la durée critique de production, par une voie
#   d'essai DISTINCTE : `essai_stock`.
#
# 🧩 PÉRIMÈTRE
#   - Couvre : le déroulé de l'essai en trois phases et son bilan.
#   - Exclut : toute décision (portée par les templates de
#     12_template_sensors/imprimerie/stock/) et toute écriture de
#     mémoire (portée par l'automation 10180000000007), hormis
#     la remise à zéro finale de la voie d'essai.
#
# 🔖 NATURE
#   Orchestration d'essai
#
# 🧪 CE QUI EST ÉPROUVÉ (mêmes entités logiques que la production)
#   Phase 1 — valeur simulée = seuil critique haut + 1 °C :
#     ouverture du dépassement, temporisation (durée d'essai
#     fixe de 2 min), entrée en alarme, notification « ESSAI ».
#   Phase 2 — valeur simulée absente (non numérique) :
#     l'alarme DOIT rester active (une mesure invalide n'est
#     jamais un retour dans la plage).
#   Phase 3 — valeur simulée = milieu de la plage :
#     retour dans la plage, notification « ESSAI » de retour
#     avec durée totale, alarme soldée.
#   Puis bilan « ESSAI » : conforme / non conforme par phase.
#
# 🛡️ GARANTIES
#   - Aucun des quatre capteurs sources n'est lu ni écrit.
#   - Seuils et durée de production : LUS, jamais écrits ; la
#     durée d'essai (2 min) est une constante distincte.
#   - Aucune statistique long terme : aucune entité d'essai n'a
#     de state_class ni n'est enregistrée par le recorder.
#   - Toute notification produite commence par « ESSAI ».
#   - Aucun état résiduel : en fin d'essai la phase revient à
#     `inactif` et le suivi d'essai à `aucun` ; si l'essai est
#     interrompu, l'automation 10180000000007 effectue la même
#     remise à zéro à l'arrêt du script et au démarrage de HA.
#     Seul subsiste l'horodatage du dernier début d'essai
#     (input_datetime), inerte tant que le suivi vaut `aucun`.
#   - N'agit que depuis un état d'essai inactif (pas d'essai
#     concurrent, pas de reprise d'un état inconnu).
#
# ⚙️ MODE
#   single — un seul essai à la fois ; appel concurrent ignoré.
#
# ⏱️ DURÉE
#   Environ 3 à 4 min (2 min de temporisation d'essai + réveil
#   minute des templates). Délais d'attente bornés.
# ==========================================================

imprimerie_stock_essai_alarme:
  alias: "Imprimerie - Stock - Essai de l'alarme"
  mode: single
  max_exceeded: silent
  sequence:
    - variables:
        suivi: input_select.temperature_suivi_hors_plage_essai_stock
        situation: sensor.temperature_surveillance_essai_stock

    # Garde : aucun essai en cours, voie d'essai au repos.
    - condition: state
      entity_id: input_select.essai_alarme_stock
      state: inactif
    - condition: state
      entity_id: input_select.temperature_suivi_hors_plage_essai_stock
      state: aucun

    # --------------------------------------------------------
    # Phase 1 — hors plage prolongé ⇒ alarme ESSAI
    # --------------------------------------------------------
    - action: input_select.select_option
      target:
        entity_id: input_select.essai_alarme_stock
      data:
        option: hors_plage
    - wait_template: "{{ is_state(suivi, 'alarme') }}"
      timeout: "00:06:00"
      continue_on_timeout: true
    - variables:
        ok_alarme: "{{ is_state(suivi, 'alarme') }}"

    # --------------------------------------------------------
    # Phase 2 — mesure invalide ⇒ l'alarme reste active
    # --------------------------------------------------------
    - action: input_select.select_option
      target:
        entity_id: input_select.essai_alarme_stock
      data:
        option: invalide
    - wait_template: "{{ is_state(situation, 'mesure_invalide') }}"
      timeout: "00:00:30"
      continue_on_timeout: true
    - delay: "00:00:20"
    - variables:
        ok_invalide: >-
          {{ ok_alarme and is_state(situation, 'mesure_invalide')
             and is_state(suivi, 'alarme') }}

    # --------------------------------------------------------
    # Phase 3 — retour réel dans la plage ⇒ retour ESSAI
    # --------------------------------------------------------
    - action: input_select.select_option
      target:
        entity_id: input_select.essai_alarme_stock
      data:
        option: dans_plage
    - wait_template: "{{ is_state(suivi, 'aucun') }}"
      timeout: "00:01:00"
      continue_on_timeout: true
    - variables:
        ok_retour: "{{ ok_alarme and is_state(suivi, 'aucun') }}"

    # --------------------------------------------------------
    # Remise à zéro — aucun état d'essai ne subsiste
    # --------------------------------------------------------
    - action: input_select.select_option
      target:
        entity_id: input_select.essai_alarme_stock
      data:
        option: inactif
    - action: input_select.select_option
      target:
        entity_id: input_select.temperature_suivi_hors_plage_essai_stock
      data:
        option: aucun

    # --------------------------------------------------------
    # Bilan — notification ESSAI
    # --------------------------------------------------------
    - action: script.imprimerie_stock_surveillance_notifier
      data:
        evenement: bilan_essai
        grandeur: temperature
        zone: essai_stock
        detail: >-
          {{ 'chaîne d’alarme conforme' if (ok_alarme and ok_invalide and ok_retour)
             else 'chaîne d’alarme NON conforme' }}.
          Alarme après dépassement prolongé : {{ 'oui' if ok_alarme else 'NON' }}.
          Mesure invalide sans retour : {{ 'oui' if ok_invalide else 'NON' }}.
          Retour dans la plage : {{ 'oui' if ok_retour else 'NON' }}.
          Aucune mesure, aucun seuil ni aucune durée réelle n’a été modifié.
