# ==========================================================
# 🧠 ARSENAL — SCRIPT : Redémarrage manuel de la box Internet
# ----------------------------------------------------------
# 🎯 RÔLE FONDAMENTAL
#   Point UNIQUE de redémarrage manuel de l’infrastructure
#   réseau domestique (box Internet).
#
#   Ce script est une ACTION volontaire.
#   Il n’est jamais déclenché automatiquement.
#
# ----------------------------------------------------------
# 🧱 POSITION DANS L’ARCHITECTURE
#
#   - Script d’intervention manuelle
#   - Niveau : infrastructure / réseau
#
#   ➜ Toute action de redémarrage manuel de la box
#     DOIT passer par ce script.
#
# ----------------------------------------------------------
# ⚙️ COMPORTEMENT
#
#   - Trace explicitement l’action AVANT toute coupure :
#       • notification mobile (information utilisateur)
#     ➜ envoyée tant que le réseau est encore disponible.
#
#   - Déclenche ENSUITE le cycle d’alimentation physique
#     via le script bas niveau dédié, en mode DÉTACHÉ
#     (script.turn_on = « fire-and-forget »).
#
#   ⚠️ POURQUOI DÉTACHÉ
#     Ce script est appelé depuis le dashboard (hold_action).
#     Le frontend ATTEND la fin de l’exécution du service.
#     Or couper l’alim de la box coupe aussi la connexion HA
#     ↔ frontend. Si le cycle était appelé en synchrone, le
#     service ne rendrait jamais la main pendant la coupure et
#     le frontend afficherait un FAUX échec « connection lost »
#     alors que le redémarrage a bien lieu.
#
#     En détachant le cycle, redemarrer_box rend la main au
#     frontend IMMÉDIATEMENT (acquittement reçu), puis la
#     coupure survient — sans erreur remontée à l’utilisateur.
#
# ----------------------------------------------------------
# 🔒 GARANTIES
#
#   - Aucun redémarrage automatique
#   - Aucun test de connectivité
#   - Aucun retry caché
#
#   ➜ Le script orchestre une action volontaire,
#     une seule fois.
#
# ----------------------------------------------------------
# 🚫 NE FAIT PAS
#
#   - Ne surveille pas l’état Internet
#   - Ne décide pas quand redémarrer
#   - Ne vérifie pas le retour de connexion
#   - Ne manipule pas directement la prise
#
# ----------------------------------------------------------
# 📊 Type :
#   Script d’intervention manuelle — infrastructure réseau
#
# 📍 Entité :
#   script.redemarrer_box
#
# 🔗 Dépendances :
#   - script.cycle_alimentation_box
#   - script.notification_envoyer
#   - persistent_notification
#
# 🧩 Pipeline :
#   Système / Réseau / Intervention manuelle
#
# ✅ Compatibilité :
#   Home Assistant 2024.8+
#   Arsenal v6+
# ==========================================================

redemarrer_box:
  alias: "Système - Redémarrer la box manuellement"
  description: Déclenche un cycle d’alimentation de la box avec traçabilité utilisateur
  mode: single
  sequence:
    # 1️⃣ Notifier PENDANT que le réseau est encore disponible.
    - action: script.notification_envoyer
      data:
        cible: input_text.telephone_parent_1_notify
        titre: "🔄 Redémarrage box"
        message: >
          {{ now().strftime('%d/%m %H:%M') }}
          La box Internet a été redémarrée manuellement.

    # 2️⃣ Lancer le cycle d'alimentation en DÉTACHÉ.
    #    script.turn_on rend la main immédiatement : le service
    #    redemarrer_box se termine et acquitte le frontend AVANT
    #    que la coupure ne survienne (évite le faux « connection
    #    lost » côté dashboard).
    - action: script.turn_on
      target:
        entity_id: script.cycle_alimentation_box
