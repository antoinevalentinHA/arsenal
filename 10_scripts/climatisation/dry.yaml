# ==========================================================
# 🧠 ARSENAL — SCRIPT
#     Clim – Exécution DRY physique
# ----------------------------------------------------------
# 🎯 RÔLE
#   Appliquer physiquement l'état cible DRY,
#   de manière idempotente et sans aucune logique métier.
#
# 🧱 PRINCIPE
#   - action pure
#   - zéro décision
#   - zéro retry
#   - zéro notification
#   - zéro lecture de sensor.clim_target_mode
#
# ✅ GARANTIES
#   - si switch.clim_power est off, il est allumé
#   - après stabilisation courte, climate.clim est positionné sur dry
#   - si l'état réel est déjà conforme, abstention silencieuse
#
# 🧯 ÉCHEC DE COMMANDE (module injoignable)
#   Une commande peut échouer alors que les entités restent connues de
#   Home Assistant : module Airstage hors du réseau (perte Wi-Fi, unité
#   débranchée). L'échec est NON FATAL ici — `continue_on_error` laisse la
#   séquence aller à son terme au lieu d'avorter l'appelant en cours de route.
#   Ce script ne constate ni ne rattrape rien de plus : la qualification du
#   résultat et la reprise restent à `script.clim_execution` (post-condition
#   + reprise différée), qui n'était jamais atteinte quand l'exception
#   remontait. Prérequis : l'intégration remonte une `HomeAssistantError`
#   (fork Airstage, `entity.airstage_command`) — `continue_on_error` ne
#   contient aucune autre famille d'exception.
# ==========================================================

clim_exec_apply_dry:
  alias: "Clim – Dry"
  mode: single
  max_exceeded: silent

  sequence:
    - variables:
        power: "{{ states('switch.clim_power') }}"

    - choose:
        - conditions: "{{ power != 'on' }}"
          sequence:
            - service: switch.turn_on
              continue_on_error: true
              target:
                entity_id: switch.clim_power
            - delay: "00:00:10"

    - condition: template
      value_template: "{{ states('climate.clim') not in ['unknown', 'unavailable'] }}"

    - choose:
        - conditions: "{{ states('climate.clim') != 'dry' }}"
          sequence:
            - service: climate.set_hvac_mode
              continue_on_error: true
              target:
                entity_id: climate.clim
              data:
                hvac_mode: dry
