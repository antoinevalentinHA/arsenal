# ==========================================================
# 🧠 ARSENAL — SCRIPT
#     Arrosage / Rain Bird — Appliquer rain_delay (coexistence V1)
# ----------------------------------------------------------
# 🎯 RÔLE
#   Encapsuler l'écriture native de `rain_delay` (contrat 11 §2 :
#   jamais un `number` brut) pour réaliser la COEXISTENCE MINIMALE
#   V1 (contrat 17, 03 §4) :
#     - Arsenal autorité (maître `on`) + pont joignable ET FRAIS
#       → pose un `rain_delay` court et borné : le programme
#         interne Rain Bird est temporairement neutralisé.
#     - Arsenal en retrait (maître `off`) + pont joignable
#       → remet `rain_delay` à 0 : le secours interne reprend
#         immédiatement la main. (Rendre la main est toujours la
#         direction sûre : NON gaté par la fraîcheur.)
#     - Pont indisponible OU données périmées (non fraîches)
#       → AUCUNE écriture : `rain_delay` n'est plus renouvelé,
#         expire, et le secours reprend seul (direction de
#         défaillance, 03 §5/§6 — pont dégradé ⇒ bascule secours).
#
# 🧱 INVARIANTS rain_delay (contrat 03 §4) — CONSERVÉS
#   court · borné · renouvelé · JAMAIS permanent. La valeur posée
#   (jours) est volontairement courte et supérieure à la cadence
#   de renouvellement de l'automation, pour ne jamais expirer tant
#   qu'Arsenal vit, et expirer rapidement s'il disparaît.
#
# 🔗 ENTITÉS
#   - number.rain_bird_bat_bt_2_e9a3_rain_delay (écrit, encadré)
#   - input_boolean.arrosage_automatique_actif (autorité Arsenal)
#   - binary_sensor.rain_bird_pont_donnees_disponibles (garde présence)
#   - binary_sensor.rain_bird_pont_donnees_fraiches (garde fraîcheur/liveness,
#     R6 : ne neutralise le secours que si le pont rapporte encore — 03 §6)
#
# 🚫 NE FAIT PAS
#   - aucune autre commande native (station, stop, run_program,
#     advance, controller_mode, water_budget, OTA) ;
#   - aucune valeur permanente ni arbitrairement longue.
#
# 🏷️ STATUT
#   Runtime V1 supervisé (contrat 17) — Arsenal v14.x
# ==========================================================

arrosage_rain_bird_rain_delay_appliquer:
  alias: "Arrosage - Appliquer rain_delay (coexistence V1)"
  mode: single

  sequence:
    - variables:
        rd_entity: number.rain_bird_bat_bt_2_e9a3_rain_delay
        # Valeur active en JOURS : courte, bornée, > cadence de renouvellement (12 h).
        valeur_active: 2
        maitre_on: "{{ is_state('input_boolean.arrosage_automatique_actif', 'on') }}"
        dispo_ok: "{{ is_state('binary_sensor.rain_bird_pont_donnees_disponibles', 'on') }}"
        # R6 (03 §6 / 17 §1) : fraîcheur = liveness. unknown/unavailable ⇒ non frais
        # ⇒ pas de neutralisation ⇒ expiration ⇒ secours (direction sûre).
        frais_ok: "{{ is_state('binary_sensor.rain_bird_pont_donnees_fraiches', 'on') }}"
        # Exploitabilité du canal sol = DISPONIBILITÉ de la médiane (n>=2 points
        # frais). MÊME autorité que la décision (intention.yaml, gate
        # `mediane_exploitable` #688 ; contrat 15 §5 : la médiane, PAS le libellé).
        # Canal sol inexploitable ⇒ Arsenal est AVEUGLE (ne peut plus décider) ⇒
        # rendre la main au secours (contrat 03 §5 « capteurs sol indisponibles →
        # le secours reste le filet » ; anti-pattern §5 : ne pas bloquer Arsenal ET
        # le secours). is_number gère unknown/unavailable (⇒ non exploitable).
        sol_exploitable: "{{ is_number(states('sensor.jardin_humidite_sol_mediane')) }}"

    - choose:
        # Arsenal autorité + pont joignable ET FRAIS + CANAL SOL EXPLOITABLE →
        # neutralisation temporaire. Arsenal est réellement capable de décider :
        # le secours peut rester dormant. La fraîcheur ne gate QUE cette branche.
        - conditions:
            - condition: template
              value_template: "{{ maitre_on and dispo_ok and frais_ok and sol_exploitable }}"
          sequence:
            - service: number.set_value
              target:
                entity_id: "{{ rd_entity }}"
              data:
                value: "{{ valeur_active }}"

        # Arsenal AVEUGLE : maître on + pont sain (dispo+frais) MAIS canal sol
        # inexploitable (médiane indisponible, <2 sondes fraîches). Arsenal ne peut
        # plus décider ⇒ RENDRE LA MAIN au secours SANS attendre l'expiration
        # native (jusqu'à 2 j = privation persistante puisque le /12h reconduit,
        # contrat 03 §5/§7.6) : écriture EXPLICITE rain_delay=0, symétrique du
        # retrait « maître off » ci-dessous (rendre la main = direction sûre).
        - conditions:
            - condition: template
              value_template: "{{ maitre_on and dispo_ok and frais_ok and not sol_exploitable }}"
          sequence:
            - service: number.set_value
              target:
                entity_id: "{{ rd_entity }}"
              data:
                value: 0

        # Arsenal en retrait (maître off) + pont joignable → rendre la main au secours
        - conditions:
            - condition: template
              value_template: "{{ not maitre_on and dispo_ok }}"
          sequence:
            - service: number.set_value
              target:
                entity_id: "{{ rd_entity }}"
              data:
                value: 0
      # default : pont indisponible OU non frais (maître on) → aucune écriture
      #           → rain_delay expire → secours Rain Bird reprend (03 §5/§6).
      #           Le canal sol inexploitable sur pont SAIN est traité au-dessus
      #           (retrait explicite) ; sur pont non frais, le dead-man suffit.
