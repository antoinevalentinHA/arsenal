# ==========================================================
# 🧠 ARSENAL — SCRIPT : Chauffage – Décision Centrale V3
# ----------------------------------------------------------
# 🎯 RÔLE FONDAMENTAL
#
#   Cerveau UNIQUE de décision du chauffage.
#   Point d'entrée canonique du domaine chauffage consigne.
#
#   Ce script est la SEULE autorité habilitée à décider
#   un changement de régime chauffage Arsenal :
#     → Confort
#     → Réduit
#
#   Il délègue toute exécution à :
#     → script.chauffage_appliquer_consigne
#
#   Il ne fait PAS :
#     - Aucune exécution directe de consigne
#     - Aucune hypothèse thermique
#     - Aucune décision implicite
#
# ----------------------------------------------------------
# 🧱 HIÉRARCHIE DES PRIORITÉS (ORDRE STRICT)
#
#   👤 NIVEAU 0 — OVERRIDE OPÉRATEUR (SOUVERAIN)
#     (commande humaine explicite, prioritaire sur toute logique Arsenal)
#     - mode_confort_chauffage = ON
#
#     Effet :
#       - impose immédiatement le programme Confort
#       - contourne les blocages métier hiérarchiques et les abstentions
#       - ne contourne pas les gardes techniques non négociables
#       - reste subordonné aux sécurités matérielles hors périmètre Arsenal
#
#   🛑 NIVEAU 1 — INTERDICTIONS SYSTÈME (RÉGIME AUTOMATIQUE)
#     (souveraines hors override opérateur)
#     - Chauffage non autorisé système
#
#   🧠 NIVEAU 2 — CONTEXTES MAJEURS (RÉGIME AUTOMATIQUE)
#     (imposent Réduit hors override opérateur, ordre d'évaluation strict,
#      avec exception normative explicite pour le pré-confort Vacances)
#     1. Aération en cours et confirmée
#     2. Blocage aération
#     3. Fenêtres ouvertes (avec délai)
#     4. Absence effective Vacances (binary_sensor.vacances_actives = on)
#        - Pré-confort actif ET autorisation cible == comfort -> Confort
#        - Sinon -> Réduit
#          (contrat 65__amendement R-65.4 : le pré-confort est une exception
#           au contexte d'absence, jamais à la pertinence thermique. La garde
#           est une égalité positive stricte au jeton `comfort` — un état non
#           exploitable n'établit simplement pas l'exception, il n'est pas
#           requalifié en `reduced`.)
#     5. Poêle actif
#
#   🌡️ NIVEAU 3 — CONFORT D'OPPORTUNITÉ (RÉGIME AUTOMATIQUE)
#     (sous réserve des niveaux supérieurs)
#     1. Présence réelle → délégué à sensor.chauffage_autorisation_cible
#     2. Inhibition géofencing → confort (stabilisation thermique d'absence)
#     3. Défaut → réduit
#
# ----------------------------------------------------------
# 🔁 HYSTÉRÉSIS DÉCISIONNELLE & ÉTAT D'ATTENTE
#
#   Hors override opérateur, la levée d'un blocage ou d'un délai
#   ne constitue jamais, à elle seule, un motif suffisant de reprise.
#
#   ➜ Fin de blocage ≠ reprise par principe
#   ➜ Passage en Confort uniquement si le calcul métier courant
#     conclut explicitement à un besoin valide
#     ou au pré-confort Vacances, lui-même subordonné à l'autorisation cible
#
#   Objectifs :
#     - Zéro effet yo-yo
#     - Respect de l'inertie thermique
#     - Aucune action "par principe"
#
# ----------------------------------------------------------
# 🚦 GARDES D'EXÉCUTION (SÉQUENCE STRICTE)
#
#   G1 — Anti-rebond géoloc
#         Timer actif ET pas d'override → STOP
#         (contournable par override opérateur)
#
#   SET — Variables principales
#         desired_mode / reason / prog_actuel calculés ici
#
#   G3 — Programme inconnu
#         prog_actuel == unknown ET pas d'override → STOP
#         (contournable par override opérateur)
#
#   G4 — Mode neutre
#         desired_mode == neutre → STOP propre sans appel descendant
#         (autorisation sans action — non contournable)
#
#   G5 — Idempotence
#         desired_mode == prog_actuel → STOP
#         Zéro appel inutile. (non contournable)
#
#   G2 — Capacité d'exécution [GARDE D'EXÉCUTION PURE, COMPOSÉE]
#         binary_sensor.boiler_commandable_heating_setpoint != on → STOP
#         Évalué après décision métier complète.
#         (non contournable)
#
#         La garde est COMPOSÉE et qualifiée PAR RÔLE. `online` est
#         NÉCESSAIRE mais JAMAIS SUFFISANT : l'écrivain souverain
#         n'implémente aucune politique de reconnexion, et son retenu
#         peut demeurer `offline` alors que le service est vivant.
#         Quatre conditions : online, fraîcheur de telemetry_status
#         (3 × période), chain.status == ok, et la fraîcheur de la
#         mesure du rôle commandé.
#
#         Le rôle qualifiant est `heating_setpoint` : la chaîne
#         descendante — événement chauffage_execution_requise →
#         automation.chauffage_application → script exécutif —
#         commande cette grandeur, et elle seule.
#
#         Réf : contrats/chauffage/30_decision_centrale__amendement_garde_execution.md §2
#
# ----------------------------------------------------------
# 🔒 ANTI-REBOND GÉOLOCALISATION
#
#   Toute décision validée déclenche timer.chauffage_geoloc_antirebond.
#   Ce timer bloque toute décision concurrente immédiate.
#
#   ➜ Stabilisation logique
#   ➜ Protection thermique et anti-rafale transactionnelle
#
# ----------------------------------------------------------
# 🧾 OBSERVABILITÉ & TRAÇABILITÉ
#
#   Toute décision explicite produit :
#     - Une application de régime observable (via chauffage_appliquer_consigne)
#     - Un logbook lisible
#     - Une raison métier traçable (voir table ci-dessous)
#
#   Raisons émises :
#     confort_force                — override opérateur
#     chauffage_non_autorise       — système non autorisé
#     aeration_en_cours            — aération en cours et confirmée
#     blocage_aeration_en_cours    — blocage aération actif
#     fenetre_ouverte_maison       — fenêtre ouverte (avec délai)
#     pre_confort_vacances         — pré-confort Vacances actif ET thermiquement permis
#     mode_maison_vacances         — absence effective Vacances sans exception
#                                    pré-confort établie (pré-confort inactif,
#                                    ou actif mais autorisation cible ≠ comfort)
#     poele_actif                  — poêle en fonctionnement
#     besoin_thermique             — présence + cible = comfort
#     presence_on                  — présence + cible = neutre
#     confort_suffisant            — présence + cible = reduced
#     stabilisation_absence        — stabilisation thermique d'absence
#     absence                      — défaut (absence non inhibée)
#
# ----------------------------------------------------------
# 🧱 GARANTIES SYSTÈME
#
#   - Une seule décision à la fois (mode: restart)
#   - Zéro appel inutile (G5 idempotence)
#   - Zéro oscillation en régime automatique (anti-rebond)
#   - Normalisation locale robuste de prog_actuel avec repli sur unknown
#   - Override toujours lisible (raison confort_force prioritaire)
#
# ----------------------------------------------------------
# 📎 RÉFÉRENCES
#
#   Contrat socle boiler :
#     contrats/boiler/CONTRAT_BOILER_SOCLE_TRANSACTIONNEL.md
#   Fiche de référence complète :
#     contrats/chauffage/30_decision_centrale.md
#   Audit pattern transactionnel boiler :
#     outils_externes/boiler_pi/AUDIT_CHAINE_MQTT_ACK_ECS.md
#
# ----------------------------------------------------------
# ✅ Compatibilité : Home Assistant 2024.8+
# ==========================================================

chauffage_decision_centrale:
  alias: "Chauffage - Décision centrale"
  description: >
    Decision automatique unique Comfort/Reduced selon le contexte
    global, avec évitement total des actions inutiles.

  mode: restart

  sequence:

    # ------------------------------------------------------
    # Protection initiale : anti-rebond geoloc
    # ------------------------------------------------------
    - alias: "Guard anti-rebond (hors override)"
      condition: template
      value_template: >
        {{
          is_state('input_boolean.mode_confort_chauffage', 'on')
          or is_state('timer.chauffage_geoloc_antirebond', 'idle')
        }}

    # ------------------------------------------------------
    # Variables principales (programme actuel et évaluation)
    # ------------------------------------------------------
    - alias: "Set variables"
      variables:

        # --------------------------------------------------
        # Programme chauffage actuel (lecture locale sécurisée)
        # --------------------------------------------------
        prog_actuel: >
          {% set v = states('sensor.programme_chauffage') | lower %}
          {% if 'eco' in v %}
            reduced
          {% elif 'comfort' in v or 'confort' in v %}
            comfort
          {% else %}
            unknown
          {% endif %}

        # --------------------------------------------------
        # Mode désiré calculé selon le contexte global
        # --------------------------------------------------
        desired_mode: >
          {% if is_state('input_boolean.mode_confort_chauffage', 'on') %}
            comfort

          {% elif is_state('input_boolean.aeration_episode_en_cours', 'on')
                 and is_state('input_boolean.aeration_confirmee', 'on') %}
            reduced

          {% elif is_state('input_boolean.chauffage_blocage_aeration', 'on') %}
            reduced

          {% elif is_state('binary_sensor.fenetre_ouverte_maison_avec_delai', 'on') %}
            reduced

          {% elif is_state('binary_sensor.vacances_actives', 'on') %}
            {% if is_state('input_boolean.pre_confort_actif_calcule', 'on')
                  and is_state('sensor.chauffage_autorisation_cible', 'comfort') %}
              comfort
            {% else %}
              reduced
            {% endif %}

          {% elif is_state('input_boolean.blocage_chauffage_poele', 'on') %}
            reduced

          {% elif is_state('binary_sensor.presence_famille_unifiee', 'on') %}
            {% set cible = states('sensor.chauffage_autorisation_cible') %}
            {% if cible in ['comfort','neutre','reduced'] %}
              {{ cible }}
            {% else %}
              neutre
            {% endif %}

          {% elif is_state('input_boolean.chauffage_inhibition_geofencing', 'on') %}
            comfort

          {% else %}
            reduced
          {% endif %}

        # --------------------------------------------------
        # Raison métier associée à la décision
        # --------------------------------------------------
        reason: >
          {% if is_state('input_boolean.mode_confort_chauffage', 'on') %}
            confort_force

          {% elif is_state('input_boolean.aeration_episode_en_cours', 'on')
                 and is_state('input_boolean.aeration_confirmee', 'on') %}
            aeration_en_cours

          {% elif is_state('input_boolean.chauffage_blocage_aeration', 'on') %}
            blocage_aeration_en_cours

          {% elif is_state('binary_sensor.fenetre_ouverte_maison_avec_delai', 'on') %}
            fenetre_ouverte_maison

          {% elif is_state('binary_sensor.vacances_actives', 'on') %}
            {% if is_state('input_boolean.pre_confort_actif_calcule', 'on')
                  and is_state('sensor.chauffage_autorisation_cible', 'comfort') %}
              pre_confort_vacances
            {% else %}
              mode_maison_vacances
            {% endif %}

          {% elif is_state('input_boolean.blocage_chauffage_poele', 'on') %}
            poele_actif

          {% elif is_state('binary_sensor.presence_famille_unifiee', 'on') %}
            {% set cible = states('sensor.chauffage_autorisation_cible') %}
            {% if cible == 'comfort' %}
              besoin_thermique
            {% elif cible == 'neutre' %}
              presence_on
            {% elif cible == 'reduced' %}
              confort_suffisant
            {% else %}
              presence_on
            {% endif %}

          {% elif is_state('input_boolean.chauffage_inhibition_geofencing', 'on') %}
            stabilisation_absence

          {% else %}
            absence
          {% endif %}

    # ------------------------------------------------------
    # Cas particulier : programme inconnu -> on stoppe tout
    # ------------------------------------------------------
    - alias: "Guard programme inconnu (hors override)"
      condition: template
      value_template: >
        {{
          is_state('input_boolean.mode_confort_chauffage', 'on')
          or prog_actuel != 'unknown'
        }}

    # ------------------------------------------------------
    # Garde-fou neutre : autorisation sans action
    # ------------------------------------------------------
    - alias: "Stop si mode neutre"
      choose:
        - conditions:
            - condition: template
              value_template: "{{ desired_mode == 'neutre' }}"
          sequence:
            - stop: "Mode neutre — autorisation sans action"

    # ------------------------------------------------------
    # Garde-fou principal : si pas de changement → stop total
    # ------------------------------------------------------
    - alias: "Guard aucun changement"
      condition: template
      value_template: "{{ desired_mode != prog_actuel }}"

    # ------------------------------------------------------
    # Garde d'exécution : capacité boiler POUR LE RÔLE heating_setpoint.
    # Composée, non contournable. La décision métier est déjà produite à ce
    # stade : ce garde conditionne uniquement l'exécution descendante.
    # Une décision valide peut donc être produite et NON exécutée.
    # ------------------------------------------------------
    - alias: "Guard capacite d execution boiler (composee, par role)"
      condition: state
      entity_id: binary_sensor.boiler_commandable_heating_setpoint
      state: "on"

    # ------------------------------------------------------
    # Decision centrale (un seul choose, seulement si changement)
    # ------------------------------------------------------
    - alias: "Decision centrale"
      choose:

        # --------------------------------------------------
        # Passage en Comfort
        # --------------------------------------------------
        - conditions:
            - condition: template
              value_template: "{{ desired_mode == 'comfort' }}"
          sequence:

            # --------------------------------------------------
            # Raison AVANT la décision exécutoire (appariement atomique,
            # contrat 85 §85.4). input_text.chauffage_raison porte la raison
            # de la décision courante (source de la raison exécutoire en auto).
            # --------------------------------------------------
            - service: input_text.set_value
              target:
                entity_id: input_text.chauffage_raison
              data:
                value: "{{ reason }}"

            # --------------------------------------------------
            # Memoire d'intention sessionnelle chauffage (= décision théorique
            # auto ; devient exécutoire via sensor.chauffage_mode_commande)
            # --------------------------------------------------
            - service: input_select.select_option
              target:
                entity_id: input_select.chauffage_mode_session
              data:
                option: "confort"

            # --------------------------------------------------
            # Signal d'exécution — l'application (décision exécutoire) est
            # déléguée à automation.chauffage_application (écrivain unique,
            # CH-4). Émis même si mode_session est inchangé, pour préserver
            # l'iso-comportement (decision_centrale décide d'appliquer →
            # l'application applique). decision_centrale N'APPELLE PLUS le
            # script exécutif (§85.2, bascule C39).
            # --------------------------------------------------
            - event: chauffage_execution_requise

            # --------------------------------------------------
            # Anti-rebond post-decision
            # --------------------------------------------------
            - alias: "Start anti-rebond"
              service: timer.start
              target:
                entity_id: timer.chauffage_geoloc_antirebond

      default:

        # --------------------------------------------------
        # Passage en Reduced
        # --------------------------------------------------
        - alias: "Activer chauffage reduit"
          sequence:

            # --------------------------------------------------
            # Raison AVANT la décision exécutoire (appariement atomique, §85.4)
            # --------------------------------------------------
            - service: input_text.set_value
              target:
                entity_id: input_text.chauffage_raison
              data:
                value: "{{ reason }}"

            # --------------------------------------------------
            # Memoire d'intention sessionnelle chauffage
            # --------------------------------------------------
            - service: input_select.select_option
              target:
                entity_id: input_select.chauffage_mode_session
              data:
                option: "reduite"

            # --------------------------------------------------
            # Signal d'exécution — application déléguée à
            # automation.chauffage_application (écrivain unique, CH-4).
            # decision_centrale N'APPELLE PLUS le script exécutif (§85.2).
            # --------------------------------------------------
            - event: chauffage_execution_requise

            # --------------------------------------------------
            # Anti-rebond post-decision
            # --------------------------------------------------
            - alias: "Start anti-rebond"
              service: timer.start
              target:
                entity_id: timer.chauffage_geoloc_antirebond