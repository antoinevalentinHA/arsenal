# ==========================================================
# 🧠 ARSENAL — SCRIPT
#     Chauffage – Entrer en mode manuel (primitive supervisée)
# ----------------------------------------------------------
# 🎯 RÔLE
#   Primitive backend d'ENTRÉE en régime manuel (autorité de
#   domaine, contrat 85 §85.4). Séquence ATOMIQUE :
#     1. valider le régime demandé (confort/reduite)
#     2. écrire la consigne
#     3. transférer l'autorité (titulaire → manuel)
#   La consigne est écrite AVANT le transfert : à l'instant où le
#   titulaire devient manuel, la consigne porte déjà la valeur voulue
#   (aucune consigne antérieure exécutée transitoirement).
#
# 🧱 PRINCIPE
#   - N'écrit AUCUN relais / consigne physique (écrivain unique
#     script.chauffage_appliquer_consigne préservé, §85.2)
#   - Consigne invalide → ABSTENTION (aucune écriture) + cause loguée
#   - Appelée par l'UI ; l'UI n'orchestre pas la transition
#
# 📍 État actuel : ÉCHAFAUDAGE INERTE — la décision exécutoire
#   (sensor.chauffage_mode_commande) n'est pas encore consommée par
#   l'application (bascule ultérieure).
# ==========================================================

chauffage_entrer_mode_manuel:
  alias: "Chauffage - Entrer en mode manuel (primitive supervisée)"
  mode: single
  max_exceeded: silent

  fields:
    consigne:
      description: "Régime manuel demandé : confort ou reduite"
      example: "confort"
      selector:
        select:
          options:
            - confort
            - reduite

  sequence:
    - choose:
        # Consigne invalide → ABSTENTION (aucune écriture) + log
        - conditions:
            - condition: template
              value_template: "{{ (consigne | default('')) not in ['confort', 'reduite'] }}"
          sequence:
            - service: system_log.write
              data:
                level: warning
                logger: arsenal.chauffage.autorite
                message: >
                  Chauffage entrer_mode_manuel : consigne invalide
                  ('{{ consigne | default('') }}') — abstention, aucune écriture
                  (titulaire et consigne inchangés).
      # Consigne valide → séquence ATOMIQUE : consigne AVANT autorité
      default:
        - service: input_select.select_option
          target:
            entity_id: input_select.chauffage_consigne_manuelle
          data:
            option: "{{ consigne }}"

        - service: input_select.select_option
          target:
            entity_id: input_select.chauffage_titulaire_autorite
          data:
            option: manuel
